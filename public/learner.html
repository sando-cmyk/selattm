<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/site-header.css" />
  <title>SELA TTM | Your Courses</title>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-hover: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .learner-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px;
      width: 100%;
      flex: 1;
    }

    .learner-header {
      margin-bottom: 40px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 20px;
    }

    .learner-header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .learner-header p {
      font-size: 1rem;
      color: var(--text-muted);
    }

    .learner-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .course-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .course-card:hover {
      transform: translateY(-4px);
      border-color: rgba(34, 197, 94, 0.3);
    }

    .course-code {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .course-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 8px 0 12px;
      color: var(--text-main);
    }

    .course-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-launch {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: var(--accent-green);
      color: #0f172a;
      font-weight: 700;
      padding: 12px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .course-step {
      display: inline-block; font-size: 0.75rem; font-weight: 700; letter-spacing: .04em;
      background: rgba(56, 189, 248, 0.15); color: var(--accent-blue);
      padding: 3px 8px; border-radius: 999px; margin: 0 6px 8px 0;
    }
    .course-done {
      display: inline-block; font-size: 0.75rem; font-weight: 700;
      background: rgba(34, 197, 94, 0.15); color: var(--accent-green);
      padding: 3px 8px; border-radius: 999px; margin: 0 6px 8px 0;
    }
    .course-locked { opacity: 0.6; }
    .btn-locked, .btn-locked:hover {
      background: rgba(148, 163, 184, 0.2) !important; color: var(--text-muted) !important;
      cursor: not-allowed; font-size: 0.85rem; line-height: 1.3;
    }

    .btn-record {
      display: block; width: 100%; margin-top: 10px; padding: 10px;
      background: transparent; color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 6px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer;
    }
    .btn-record:hover { background: rgba(56, 189, 248, 0.1); }
    .btn-record:disabled { opacity: 0.6; cursor: wait; }

    .btn-launch:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <header class="site-header" id="global-header"></header>

  <!-- Learner Content -->
  <main class="learner-container">
    <header class="learner-header">
      <h1>Your Courses</h1>
      <p id="learner-welcome-text">Access your active training modules and assessments.</p>
    </header>

    <div id="learner-courses-grid" class="learner-grid">
      <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
        Loading enrolled modules...
      </div>
    </div>
  </main>

  <footer class="site-footer" id="global-footer"></footer>

  <!-- Global Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="./js/firebase-init.js"></script>
  <script type="module" src="./js/navigation.js"></script>

  <!-- Learner Hub Data Pipeline -->
  <script type="module">
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { ensureLearnerProfile } from "./js/learner-profile.js";
    import { loadSequence } from "./js/course-sequence.js";
    import { downloadRecordOfLearning } from "./js/record-of-learning.js";

    const auth = getAuth();
    const db = getFirestore();

    const FALLBACK_MODULES = [
      {
        id: "ashtas-01",
        code: "ASHTAS-01",
        title: "ASHTAS Operative",
        description: "Interactive checkpoints, slide decks, and roadside practical knowledge.",
        launchPath: "/courses/ashtas-01/index.html"
      },
      {
        id: "pts-01",
        code: "PTS-01",
        title: "Working with Portable Traffic Signals",
        description: "Certified training for the safe setup and operation of portable traffic signals on site.",
        launchPath: "/courses/ttm-portable-traffic-signals/index.html"
      },
      {
        id: "ttm-eng-01",
        code: "TTM-ENG-01",
        title: "Core Engineering Concepts of TTM in New Zealand",
        description: "Narrated deck covering the core engineering principles behind temporary traffic management design.",
        launchPath: "/courses/ttm-engineering-essentials/index.html"
      },
      {
        id: "ttm-roles-01",
        code: "TTM-ROLES-01",
        title: "Roles & Responsibilities for TTM in New Zealand",
        description: "Who does what on a TTM site -- roles, responsibilities, and accountability under NZ practice.",
        launchPath: "/courses/nzgttm-roles-responsibilities/index.html"
      },
      {
        id: "nzgttm-01",
        code: "NZGTTM-01",
        title: "NZGTTM Essentials",
        description: "Foundational training in the New Zealand Guidelines for Temporary Traffic Management.",
        launchPath: "/courses/nzgttm-essentials/index.html"
      }
    ];

    /**
     * Renders course module cards into the hub.
     */
    function renderModules(modules) {
      const grid = document.getElementById("learner-courses-grid");
      if (!grid) return;

      if (!modules || !modules.length) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No paid modules yet. <a href="store.html" style="color: var(--accent-green);">Browse the store</a> to enroll.</p>`;
        return;
      }

      grid.innerHTML = modules.map(mod => {
        const code = mod.code || mod.id || "TTM";
        const title = mod.title || "Course Module";
        const desc = mod.description || "Certified roadside training module.";
        const launch = mod.launchPath || `/courses/${mod.id}/index.html`;
        const step = mod._step ? `<span class="course-step">Step ${mod._step}</span>` : "";
        const done = mod._passed ? `<span class="course-done">&#10003; Completed</span>` : "";
        const action = mod._lockedBy
          ? `<span class="btn-launch btn-locked" title="Complete the earlier course first">&#128274; Complete &ldquo;${mod._lockedBy}&rdquo; first</span>`
          : `<a href="${launch}" class="btn-launch">${mod._passed ? "Review Module" : "Launch Module"}</a>`;

        return `
          <div class="course-card${mod._lockedBy ? " course-locked" : ""}">
            <div>
              ${step}${done}
              <span class="course-code">${code}</span>
              <h3 class="course-title">${title}</h3>
              <p class="course-desc">${desc}</p>
            </div>
            <div>
              ${action}
              ${mod._passed ? `<button type="button" class="btn-record" data-course-id="${mod.id}" data-title="${title}" data-code="${mod.code || ""}">&#11015; Download Record of Learning</button>` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    /**
     * Loads live modules from Firestore with local fallback.
     */
    async function loadLearnerModules(user, paidCourseIds, grantedCourseIds, grantedAllCourses) {
      const welcomeText = document.getElementById("learner-welcome-text");
      if (welcomeText && user) {
        welcomeText.textContent = `Welcome back, ${user.displayName || user.email || 'Learner'}. Select a module to continue.`;
      }

      let catalog = null;

      // 1. Check Firestore
      try {
        const snap = await getDocs(collection(db, "courses"));
        if (!snap.empty) {
          const live = [];
          snap.forEach(d => live.push({ id: d.id, ...d.data() }));
          catalog = live;
        }
      } catch (e) {
        console.warn("[Learner] Firestore query bypassed:", e.message);
      }

      // 2. Check /data/courses.json
      if (!catalog) {
        try {
          const res = await fetch("/data/courses.json", { cache: "no-cache" });
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) catalog = data;
          }
        } catch (err) {
          console.log("[Learner] Fallback JSON bypass:", err.message);
        }
      }

      // 3. Guaranteed hardcoded fallback
      if (!catalog) catalog = FALLBACK_MODULES;

      // Only show courses this account has actually paid for, matched by
      // the real Stripe Price ID recorded on the payment (not id/code, which
      // the payment record never actually contains).
      //
      // A course also carries legacyStripePriceIds -- prices it used to sell
      // under before being archived and replaced (e.g. a GST correction).
      // Someone who paid under an old price must not lose access just
      // because the catalog has since moved on to a new price ID for the
      // same course -- check every ID the course has ever sold under, not
      // only the current one.
      const owned = catalog.filter(c => {
        // Manually granted access (admin.html "Grant Course Access") wins
        // outright -- no payment involved, that's the whole point of it.
        if (grantedAllCourses) return true;
        if (grantedCourseIds && grantedCourseIds.has(c.id)) return true;

        const validIds = [c.stripePriceId, ...(Array.isArray(c.legacyStripePriceIds) ? c.legacyStripePriceIds : [])]
          .filter(Boolean);
        return validIds.some(id => paidCourseIds.has(id));
      });
      // Admin-set completion order (admin.html -> Learners -> View). Courses in
      // the plan come first, in order; anything else follows. When the plan is
      // enforced, a course stays locked until every earlier one is passed.
      try {
        const seq = await loadSequence(user);
        const ownedIds = owned.map(c => c.id);
        const pos = id => { const i = seq.order.indexOf(id); return i === -1 ? 9999 : i; };
        owned.sort((a, b) => pos(a.id) - pos(b.id));
        owned.forEach(c => {
          c._passed = seq.passed.has(c.id);
          if (seq.order.includes(c.id) && seq.order.length > 1) c._step = seq.order.filter(id => ownedIds.includes(id)).indexOf(c.id) + 1;
          const prev = seq.blockedBy(c.id, ownedIds);
          if (prev) {
            const p = catalog.find(x => x.id === prev);
            c._lockedBy = (p && (p.title || p.code)) || prev;
          }
        });
      } catch (e) {
        console.warn("[Learner] sequence check skipped:", e.message);
      }
      renderModules(owned);
    }

    // Record of Learning PDF for completed courses (js/record-of-learning.js).
    document.getElementById("learner-courses-grid")?.addEventListener("click", async (e) => {
      const btn = e.target.closest(".btn-record");
      if (!btn) return;
      const label = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = "Preparing PDF...";
      try {
        await downloadRecordOfLearning({ user: auth.currentUser, courseId: btn.dataset.courseId, courseTitle: btn.dataset.title, courseCode: btn.dataset.code });
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = label;
      }
    });

    // Authenticate, confirm payment, then load
    onAuthStateChanged(auth, async (user) => {
      if (!user || user.isAnonymous) {
        window.location.replace("login.html");
        return;
      }

      // First visit: collect first/last name, date of birth and postcode.
      await ensureLearnerProfile(user, db);

      const paidCourseIds = new Set();
      try {
        const paidSnap = await getDocs(
          query(collection(db, "customers", user.uid, "payments"), where("status", "==", "succeeded"))
        );
        paidSnap.forEach(d => {
          const p = d.data();
          // Real payment records from the firestore-stripe-payments extension carry
          // an "items" array; each item's price.id is the actual Stripe Price ID
          // purchased. There is no "courseId" field -- that was never real.
          const items = Array.isArray(p.items) ? p.items : [];
          items.forEach(item => {
            const priceId = item && item.price && item.price.id;
            if (priceId) paidCourseIds.add(priceId);
          });
        });
      } catch (e) {
        console.warn("[Learner] Payment lookup failed:", e.message);
      }

      // Manually granted access -- set from admin.html, no payment involved.
      // Keyed by lowercased email, same normalisation the admin panel uses
      // when it writes the grant.
      let grantedCourseIds = new Set();
      let grantedAllCourses = false;
      try {
        const grantEmail = (user.email || "").trim().toLowerCase();
        if (grantEmail) {
          const grantSnap = await getDoc(doc(db, "grants", grantEmail));
          if (grantSnap.exists()) {
            const g = grantSnap.data();
            if (g.allCourses) grantedAllCourses = true;
            if (Array.isArray(g.courseIds)) g.courseIds.forEach(id => grantedCourseIds.add(id));
          }
        }
      } catch (e) {
        console.warn("[Learner] Grant lookup failed:", e.message);
      }

      loadLearnerModules(user, paidCourseIds, grantedCourseIds, grantedAllCourses);
    });
  </script>
</body>
</html>
