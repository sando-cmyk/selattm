<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELA TTM Training & Compliance Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <div class="nav-container">
      <div class="brand">
        <span class="brand-logo">🚧</span>
        <div>
          <h1 class="brand-title">SELA TTM</h1>
          <p class="brand-subtitle">Training & Compliance Portal</p>
        </div>
      </div>
      <div class="nav-status">
        <span id="connection-status" class="badge badge-online">● System Ready</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-container">

    <!-- Worker Authentication / ID Card -->
    <section class="card" id="worker-card">
      <h2 class="card-title">Staff Identification</h2>
      <div class="form-row">
        <div class="form-group flex-1">
          <label for="worker-id">Worker ID / License Number</label>
          <input type="text" id="worker-id" placeholder="e.g. EMP-4019" autocomplete="off" />
        </div>
        <div class="form-group flex-2">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" placeholder="e.g. John Doe" autocomplete="off" />
        </div>
      </div>
    </section>

    <!-- Module Selector & Course Content -->
    <section class="card" id="course-section">
      <div class="section-header">
        <h2 class="card-title">Assigned Compliance Modules</h2>
        <div class="form-group-inline">
          <label for="module-select">Select Module:</label>
          <select id="module-select">
            <option value="">-- Loading Modules... --</option>
          </select>
        </div>
      </div>

      <!-- Training Content Display -->
      <div id="module-content" class="module-content hidden">
        <div id="module-info-header" class="module-info-header"></div>
        <div id="module-reading-material" class="reading-material"></div>

        <hr class="divider" />

        <!-- Quiz Container -->
        <div id="quiz-container">
          <h3 class="quiz-title">Knowledge Assessment</h3>
          <div id="questions-list"></div>

          <!-- Digital Signature Area -->
          <div class="signature-section">
            <label>Digital Declaration Signature (Sign inside box):</label>
            <div class="signature-wrapper">
              <canvas id="sig-pad" width="450" height="120"></canvas>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-clear-sig">Clear Signature</button>
          </div>

          <!-- Action Buttons & Progress -->
          <div class="actions-wrapper">
            <button type="button" class="btn btn-primary" id="btn-submit-assessment">Submit & Verify Compliance</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Progress / Loading Banner -->
    <div id="status-banner" class="status-banner hidden">
      <div class="spinner"></div>
      <span id="status-message">Submitting records to Google Cloud...</span>
    </div>

    <!-- Results Modal / Feedback Panel -->
    <div id="result-modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modal-title">Assessment Result</h3>
        <p id="modal-score" class="score-display"></p>
        <p id="modal-details"></p>
        <button type="button" class="btn btn-primary" id="btn-modal-close">Close</button>
      </div>
    </div>

  </main>

<script src="app.js?v=1.0.1"></script>
</body>
</html>
