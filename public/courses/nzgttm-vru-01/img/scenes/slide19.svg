<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A temporary bus stop set up within 100 metres of the original, with cones along the stop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A temporary bus stop set up within 100 metres of the original, with cones along the stop</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><rect x="0" y="220" width="800" height="46" fill="#D9D4C7"/><line x1="0" y1="266" x2="800" y2="266" stroke="#A9A291" stroke-width="4"/><rect x="0" y="268" width="800" height="72" fill="#5B6270"/><line x1="0" y1="272" x2="800" y2="272" stroke="#fff" stroke-width="3"/><line x1="0" y1="336" x2="800" y2="336" stroke="#fff" stroke-width="3"/><line x1="0" y1="304.0" x2="800" y2="304.0" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/><g class="a fade" style="animation-delay:0.00s" ><g transform="translate(150,222) scale(0.8)"><rect x="-3" y="-110" width="6" height="110" fill="#777"/><rect x="-30" y="-140" width="60" height="38" rx="5" fill="#13223D"/><text x="0" y="-115" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">BUS</text></g><rect x="120" y="70" width="60" height="70" fill="none"/><line x1="120" y1="110" x2="180" y2="150" stroke="#C8102E" stroke-width="6"/></g><g class="a drop" style="animation-delay:0.50s" ><g transform="translate(560,222) scale(0.8)"><rect x="-3" y="-110" width="6" height="110" fill="#777"/><rect x="-30" y="-140" width="60" height="38" rx="5" fill="#F2A900"/><text x="0" y="-115" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">TEMP</text></g></g><g class="a fade" style="animation-delay:0.80s" ><g transform="translate(420,300) scale(0.4)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(450,300) scale(0.4)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(480,300) scale(0.4)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(510,300) scale(0.4)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(540,300) scale(0.4)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(570,300) scale(0.4)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(600,300) scale(0.4)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(630,300) scale(0.4)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(660,300) scale(0.4)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(690,300) scale(0.4)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g></g><g class="a fade" style="animation-delay:1.10s" ><line x1="200" y1="190" x2="502.0" y2="190.0" stroke="#13223D" stroke-width="4" stroke-linecap="round"/><path d="M520,190 L502.0,202.0 L502.0,178.0Z" fill="#13223D"/><text x="360" y="180" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">within 100 m</text></g></svg>