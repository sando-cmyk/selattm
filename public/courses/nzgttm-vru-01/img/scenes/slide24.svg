e-linecap="round" fill="none"/></g></g></g><g class="a right" style="animation-delay:0.20s" ><g transform="translate(680,286)"><g transform="translate(0,0) scale(0.7)"><circle cx="-22" cy="-16" r="16" fill="none" stroke="#222" stroke-width="4"/><circle cx="22" cy="-16" r="16" fill="none" stroke="#222" stroke-width="4"/><path d="M-22,-16 L-4,-44 L14,-44 L22,-16 M-4,-44 L-2,-16 L-22,-16" stroke="#C8102E" stroke-width="4" fill="none"/><circle cx="0" cy="-86" r="10" fill="#E8B48A"/><path d="M0,-76 L-6,-52 L8,-44" stroke="#1E3A5F" stroke-width="10" stroke-linecap="round" fill="none"/></g></g></g></svg>