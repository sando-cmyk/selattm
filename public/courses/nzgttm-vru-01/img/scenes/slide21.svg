th="68" height="12" fill="#fff" stroke="#222" stroke-width="2" transform="rotate(-30)"/></g><rect x="-30" y="-92" width="60" height="22" rx="4" fill="#222"/><circle cx="-16" cy="-81" r="8" fill="#C8102E"/><circle cx="16" cy="-81" r="8" fill="#C8102E"/></g></g><g class="a fade" style="animation-delay:1.20s" ><g transform="translate(430,176) rotate(0)"><rect x="0" y="-5" width="44" height="10" fill="#fff" stroke="#999"/><rect x="10" y="-5" width="15" height="10" fill="#C8102E"/></g><rect x="422" y="168" width="16" height="60" fill="#555"/></g><g class="a drive" style="animation-delay:0.40s" ><g transform="translate(470,250) scale(0.62,0.62)"><rect x="-50" y="-34" width="100" height="24" rx="8" fill="#1E3A5F"/><path d="M-30,-34 L-18,-54 L18,-54 L32,-34Z" fill="#1E3A5F"/><path d="M-22,-36 L-14,-50 L0,-50 L0,-36Z M4,-36 L4,-50 L16,-50 L26,-36Z" fill="#BFD6EA"/><circle cx="-28" cy="-10" r="11" fill="#222"/><circle cx="28" cy="-10" r="11" fill="#222"/><rect x="42" y="-30" width="8" height="6" fill="#F2A900"/></g></g><g class="a pop" style="animation-delay:1.80s" ><polygon points="492.0,205.0 481.2,209.6 485.6,220.6 474.6,216.2 470.0,227.0 465.4,216.2 454.4,220.6 458.8,209.6 448.0,205.0 458.8,200.4 454.4,189.4 465.4,193.8 470.0,183.0 474.6,193.8 485.6,189.4 481.2,200.4" fill="#F2A900"/><text x="470" y="213" font-size="20" fill="#C8102E" text-anchor="middle" font-weight="bold">!</text></g><g class="a fade" style="animation-delay:1.60s" ><text x="160" y="120" font-size="18" fill="#C8102E" text-anchor="middle" font-weight="bold">Wrong side = no barrier, no lights</text></g></svg>