<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A bus stop with passengers: keep open, move nearby, or close as a last resort" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A bus stop with passengers: keep open, move nearby, or close as a last resort</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><rect x="0" y="220" width="800" height="46" fill="#D9D4C7"/><line x1="0" y1="266" x2="800" y2="266" stroke="#A9A291" stroke-width="4"/><rect x="0" y="268" width="800" height="72" fill="#5B6270"/><line x1="0" y1="272" x2="800" y2="272" stroke="#fff" stroke-width="3"/><line x1="0" y1="336" x2="800" y2="336" stroke="#fff" stroke-width="3"/><line x1="0" y1="304.0" x2="800" y2="304.0" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/><g class="a fade" style="animation-delay:0.00s" ><g transform="translate(300,222) scale(0.9)"><rect x="-60" y="-100" width="120" height="10" fill="#13223D"/><rect x="-56" y="-90" width="6" height="90" fill="#777"/><rect x="50" y="-90" width="6" height="90" fill="#777"/><rect x="-50" y="-88" width="100" height="70" fill="#BFD6EA" opacity=".6"/><rect x="-40" y="-30" width="80" height="8" fill="#7A5230"/></g><g transform="translate(390,222) scale(0.9)"><rect x="-3" y="-110" width="6" height="110" fill="#777"/><rect x="-30" y="-140" width="60" height="38" rx="5" fill="#13223D"/><text x="0" y="-115" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">BUS</text></g></g><g class="a drive" style="animation-delay:0.40s" ><g transform="translate(560,330) scale(0.7)"><rect x="-90" y="-80" width="180" height="70" rx="10" fill="#2E7D32"/><rect x="-80" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><rect x="-46" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><rect x="-12" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><rect x="22" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><rect x="56" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><circle cx="-56" cy="-10" r="13" fill="#222"/><circle cx="56" cy="-10" r="13" fill="#222"/></g></g><g class="a up" style="animation-delay:1.20s" ><g transform="translate(270,262)"><g transform="translate(0,0) scale(0.6)"><circle cx="-4" cy="-22" r="22" fill="none" stroke="#222" stroke-width="5"/><circle cx="24" cy="-6" r="6" fill="#222"/><circle cx="-2" cy="-84" r="11" fill="#E8B48A"/><path d="M-2,-72 L-2,-46 L22,-46 L26,-10" stroke="#1E3A5F" stroke-width="11" stroke-linecap="round" fill="none"/></g></g><g transform="translate(330,262)"><g transform="translate(0,0) scale(0.6)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#6A8CAF"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g></g></g><g class="a pop" style="animation-delay:1.50s" ><rect x="60.44" y="64" width="139.12" height="25.6" rx="12.8" fill="#2E7D32"/><text x="130" y="85.6" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1 Keep open</text><rect x="320.52" y="64" width="158.96" height="25.6" rx="12.8" fill="#F2A900"/><text x="400" y="85.6" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">2 Move nearby</text><rect x="620.28" y="64" width="99.44" height="25.6" rx="12.8" fill="#C8102E"/><text x="670" y="85.6" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3 Close</text></g></svg>