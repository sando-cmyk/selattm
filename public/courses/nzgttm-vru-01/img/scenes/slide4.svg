<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Physical, cognitive and sensory differences: if it is safe for disabled people it is safe for everybody" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Physical, cognitive and sensory differences: if it is safe for disabled people it is safe for everybody</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a drop" style="animation-delay:0.20s" ><rect x="50" y="60" width="200" height="210" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><g transform="translate(150,210)"><g transform="translate(0,0) scale(0.9)"><circle cx="-4" cy="-22" r="22" fill="none" stroke="#222" stroke-width="5"/><circle cx="24" cy="-6" r="6" fill="#222"/><circle cx="-2" cy="-84" r="11" fill="#E8B48A"/><path d="M-2,-72 L-2,-46 L22,-46 L26,-10" stroke="#1E3A5F" stroke-width="11" stroke-linecap="round" fill="none"/></g></g><text x="150" y="252" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">Physical</text></g><g class="a drop" style="animation-delay:0.50s" ><rect x="300" y="60" width="200" height="210" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><g transform="translate(400,210)"><circle cx="0" cy="-60" r="34" fill="#9A7FB5"/><text x="0" y="-50" font-size="40" fill="#FFFFFF" text-anchor="middle" font-weight="bold">?</text></g><text x="400" y="252" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">Cognitive</text></g><g class="a drop" style="animation-delay:0.80s" ><rect x="550" y="60" width="200" height="210" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><g transform="translate(650,210)"><g transform="translate(0,0) scale(0.9)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#6A8CAF"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><g transform="translate(0,0) scale(0.9)"><line x1="12" y1="-46" x2="34" y2="0" stroke="#fff" stroke-width="4"/><line x1="26" y1="-16" x2="34" y2="0" stroke="#C8102E" stroke-width="4"/><rect x="-10" y="-82" width="20" height="6" rx="3" fill="#222"/></g></g><text x="650" y="252" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">Sensory</text></g><g class="a pop" style="animation-delay:1.30s" ><rect x="195.28" y="297" width="409.44" height="28.8" rx="14.4" fill="#2E7D32"/><text x="400" y="321.3" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Safe for them = safe for everybody</text></g></svg>