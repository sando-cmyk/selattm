ke-width="2" opacity=".6"/><line x1="495" y1="198" x2="495" y2="230" stroke="#fff" stroke-width="2" opacity=".6"/><line x1="510" y1="198" x2="510" y2="230" stroke="#fff" stroke-width="2" opacity=".6"/></g><g class="a fade" style="animation-delay:0.40s" ><rect x="300" y="126" width="220" height="10" fill="#13223D"/><rect x="300" y="120" width="220" height="40" fill="#13223D" opacity=".15"/><text x="410" y="110" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">covered walkway</text></g><g class="a fade" style="animation-delay:0.80s" ><path d="M120,260 C160,200 160,160 200,150" stroke="#C8102E" stroke-width="5" fill="none" stroke-dasharray="10 8"/><g><circle cx="170" cy="205" r="16" fill="#C8102E"/><path d="M163.6,198.6 L176.4,211.4 M176.4,198.6 L163.6,211.4" stroke="#fff" stroke-width="3.52" stroke-linecap="round"/></g></g><g class="a left" style="animation-delay:0.20s" ><g transform="translate(140,272)"><g transform="translate(0,0) scale(0.7)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#6A8CAF"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g></g></g><g class="a fade" style="animation-delay:1.30s" ><text x="650" y="300" font-size="18" fill="#C8102E" text-anchor="middle" font-weight="bold">Other side? Often ignored.</text></g></svg>