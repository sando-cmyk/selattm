<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Twelve methods for vulnerable road users in order of preference" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Twelve methods for vulnerable road users in order of preference</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a up" style="animation-delay:0.10s" ><rect x="60" y="70" width="104" height="90" rx="10" fill="#2E7D32"/><text x="112" y="106" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="112" y="136" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Keep existing</text></g><g class="a up" style="animation-delay:0.18s" ><rect x="60" y="190" width="104" height="90" rx="10" fill="#4E9A52"/><text x="112" y="226" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="112" y="256" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Separate by time</text></g><g class="a up" style="animation-delay:0.26s" ><rect x="178" y="70" width="104" height="90" rx="10" fill="#7FB069"/><text x="230" y="106" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="230" y="136" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Narrow</text></g><g class="a up" style="animation-delay:0.34s" ><rect x="178" y="190" width="104" height="90" rx="10" fill="#B5C95A"/><text x="230" y="226" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="230" y="256" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Divert footpath</text></g><g class="a up" style="animation-delay:0.42s" ><rect x="296" y="70" width="104" height="90" rx="10" fill="#E3C24A"/><text x="348" y="106" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="348" y="136" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Cycleway</text></g><g class="a up" style="animation-delay:0.50s" ><rect x="296" y="190" width="104" height="90" rx="10" fill="#F2A900"/><text x="348" y="226" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="348" y="256" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Shared path</text></g><g class="a up" style="animation-delay:0.58s" ><rect x="414" y="70" width="104" height="90" rx="10" fill="#F09A2E"/><text x="466" y="106" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text><text x="466" y="136" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Share lane</text></g><g class="a up" style="animation-delay:0.66s" ><rect x="414" y="190" width="104" height="90" rx="10" fill="#EE7D2A"/><text x="466" y="226" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">8</text><text x="466" y="256" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Other side</text></g><g class="a up" style="animation-delay:0.74s" ><rect x="532" y="70" width="104" height="90" rx="10" fill="#E3612A"/><text x="584" y="106" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">9</text><text x="584" y="136" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Walk detour</text></g><g class="a up" style="animation-delay:0.82s" ><rect x="532" y="190" width="104" height="90" rx="10" fill="#D6482B"/><text x="584" y="226" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">10</text><text x="584" y="256" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Cycle detour</text></g><g class="a up" style="animation-delay:0.90s" ><rect x="650" y="70" width="104" height="90" rx="10" fill="#C8352B"/><text x="702" y="106" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">11</text><text x="702" y="136" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Dismount</text></g><g class="a up" style="animation-delay:0.98s" ><rect x="650" y="190" width="104" height="90" rx="10" fill="#C8102E"/><text x="702" y="226" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">12</text><text x="702" y="256" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Shuttle</text></g><g class="a fade" style="animation-delay:1.30s" ><line x1="60" y1="310" x2="722.0" y2="310.0" stroke="#13223D" stroke-width="6" stroke-linecap="round"/><path d="M740,310 L722.0,322.0 L722.0,298.0Z" fill="#13223D"/><text x="120" y="300" font-size="14" fill="#2E7D32" text-anchor="start" font-weight="bold">most preferred</text><text x="720" y="300" font-size="14" fill="#C8102E" text-anchor="end" font-weight="bold">least</text></g></svg>