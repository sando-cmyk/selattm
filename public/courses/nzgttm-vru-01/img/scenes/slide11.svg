<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A temporary crossing with drivers needing stopping sight distance" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A temporary crossing with drivers needing stopping sight distance</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><rect x="0" y="120" width="800" height="160" fill="#5B6270"/><line x1="0" y1="124" x2="800" y2="124" stroke="#fff" stroke-width="3"/><line x1="0" y1="276" x2="800" y2="276" stroke="#fff" stroke-width="3"/><line x1="0" y1="200.0" x2="800" y2="200.0" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/><g class="a fade" style="animation-delay:0.00s" ><rect x="360" y="124" width="80" height="8" fill="#fff"/><rect x="360" y="138" width="80" height="8" fill="#fff"/><rect x="360" y="152" width="80" height="8" fill="#fff"/><rect x="360" y="166" width="80" height="8" fill="#fff"/><rect x="360" y="180" width="80" height="8" fill="#fff"/><rect x="360" y="194" width="80" height="8" fill="#fff"/><rect x="360" y="208" width="80" height="8" fill="#fff"/><rect x="360" y="222" width="80" height="8" fill="#fff"/><rect x="360" y="236" width="80" height="8" fill="#fff"/><rect x="360" y="250" width="80" height="8" fill="#fff"/><rect x="360" y="264" width="80" height="8" fill="#fff"/></g><g class="a up" style="animation-delay:0.30s" ><g transform="translate(400,210)"><g transform="translate(0,0) scale(0.7)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#6A8CAF"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g></g></g><g class="a drive" style="animation-delay:0.50s" ><g transform="translate(150,186) scale(0.7,0.7)"><rect x="-50" y="-34" width="100" height="24" rx="8" fill="#1E3A5F"/><path d="M-30,-34 L-18,-54 L18,-54 L32,-34Z" fill="#1E3A5F"/><path d="M-22,-36 L-14,-50 L0,-50 L0,-36Z M4,-36 L4,-50 L16,-50 L26,-36Z" fill="#BFD6EA"/><circle cx="-28" cy="-10" r="11" fill="#222"/><circle cx="28" cy="-10" r="11" fill="#222"/><rect x="42" y="-30" width="8" height="6" fill="#F2A900"/></g></g><g class="a fade" style="animation-delay:1.60s" ><line x1="140" y1="150" x2="340" y2="150" stroke="#F2A900" stroke-width="4" stroke-dasharray="8 6"/><text x="240" y="140" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">stopping sight distance</text></g><g class="a pop" style="animation-delay:1.90s" ><rect x="569.2" y="52" width="141.6" height="28.8" rx="14.4" fill="#13223D"/><text x="640" y="76.3" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1.8 m wide</text><rect x="535.72" y="102" width="208.56" height="28.8" rx="14.4" fill="#F2A900"/><text x="640" y="126.3" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">refuge if > 10 m</text></g></svg>