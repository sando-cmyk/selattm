<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="All six modules lead to the final assessment" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>All six modules lead to the final assessment</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a pop" style="animation-delay:0.15s" ><g><circle cx="90" cy="120" r="40" fill="#1E3A5F"/><text x="90" y="128" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">M1</text></g></g><g class="a pop" style="animation-delay:0.50s" ><g transform="translate(118,92)"><g><circle cx="0" cy="0" r="14" fill="#2E7D32"/><path d="M-6.3,0 l4.2,4.48 l7.700000000000001,-8.4" stroke="#fff" stroke-width="3.08" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="a pop" style="animation-delay:0.30s" ><g><circle cx="214" cy="120" r="40" fill="#1E3A5F"/><text x="214" y="128" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">M2</text></g></g><g class="a pop" style="animation-delay:0.65s" ><g transform="translate(242,92)"><g><circle cx="0" cy="0" r="14" fill="#2E7D32"/><path d="M-6.3,0 l4.2,4.48 l7.700000000000001,-8.4" stroke="#fff" stroke-width="3.08" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="a pop" style="animation-delay:0.45s" ><g><circle cx="338" cy="120" r="40" fill="#1E3A5F"/><text x="338" y="128" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">M3</text></g></g><g class="a pop" style="animation-delay:0.80s" ><g transform="translate(366,92)"><g><circle cx="0" cy="0" r="14" fill="#2E7D32"/><path d="M-6.3,0 l4.2,4.48 l7.700000000000001,-8.4" stroke="#fff" stroke-width="3.08" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="a pop" style="animation-delay:0.60s" ><g><circle cx="462" cy="120" r="40" fill="#1E3A5F"/><text x="462" y="128" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">M4</text></g></g><g class="a pop" style="animation-delay:0.95s" ><g transform="translate(490,92)"><g><circle cx="0" cy="0" r="14" fill="#2E7D32"/><path d="M-6.3,0 l4.2,4.48 l7.700000000000001,-8.4" stroke="#fff" stroke-width="3.08" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="a pop" style="animation-delay:0.75s" ><g><circle cx="586" cy="120" r="40" fill="#1E3A5F"/><text x="586" y="128" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">M5</text></g></g><g class="a pop" style="animation-delay:1.10s" ><g transform="translate(614,92)"><g><circle cx="0" cy="0" r="14" fill="#2E7D32"/><path d="M-6.3,0 l4.2,4.48 l7.700000000000001,-8.4" stroke="#fff" stroke-width="3.08" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="a pop" style="animation-delay:0.90s" ><g><circle cx="710" cy="120" r="40" fill="#1E3A5F"/><text x="710" y="128" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">M6</text></g></g><g class="a pop" style="animation-delay:1.25s" ><g transform="translate(738,92)"><g><circle cx="0" cy="0" r="14" fill="#2E7D32"/><path d="M-6.3,0 l4.2,4.48 l7.700000000000001,-8.4" stroke="#fff" stroke-width="3.08" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="a fade" style="animation-delay:1.40s" ><line x1="400" y1="175" x2="400.0" y2="207.0" stroke="#F2A900" stroke-width="6" stroke-linecap="round"/><path d="M400,225 L388.0,207.0 L412.0,207.0Z" fill="#F2A900"/></g><g class="a pop" style="animation-delay:1.60s" ><rect x="250" y="235" width="300" height="70" rx="14" fill="#F2A900"/><text x="400" y="266" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">FINAL ASSESSMENT</text><text x="400" y="292" font-size="18" fill="#13223D" text-anchor="middle" font-weight="normal">15 questions · 80% to pass</text></g></svg>