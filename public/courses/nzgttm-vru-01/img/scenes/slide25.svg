<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Recording changes and reporting near misses with a TMP and a phone camera" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Recording changes and reporting near misses with a TMP and a phone camera</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a drop" style="animation-delay:0.10s" ><g transform="translate(200,170) scale(1.4)"><rect x="-36" y="-48" width="72" height="96" rx="6" fill="#FFFFFF" stroke="#13223D" stroke-width="3"/><rect x="-24" y="-32" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="-16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="0" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="32" width="48" height="6" rx="3" fill="#B8C2CF"/></g></g><g class="a pop" style="animation-delay:0.50s" ><rect x="360" y="110" width="110" height="80" rx="10" fill="#13223D"/><circle cx="415" cy="150" r="24" fill="#BFD6EA"/><circle cx="415" cy="150" r="12" fill="#13223D"/></g><g class="a left" style="animation-delay:0.90s" ><text x="600" y="120" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Record changes</text><text x="600" y="160" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Report near misses</text><text x="600" y="200" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Agree critical calls</text></g><g class="a pop" style="animation-delay:1.40s" ><g><circle cx="200" cy="270" r="18" fill="#2E7D32"/><path d="M191.9,270 l5.3999999999999995,5.76 l9.9,-10.799999999999999" stroke="#fff" stroke-width="3.96" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g><circle cx="415" cy="230" r="18" fill="#2E7D32"/><path d="M406.9,230 l5.3999999999999995,5.76 l9.9,-10.799999999999999" stroke="#fff" stroke-width="3.96" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>