<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Design for people walking and cycling first, then vehicles" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Design for people walking and cycling first, then vehicles</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a left" style="animation-delay:0.00s" ><rect x="50" y="70" width="300" height="210" rx="14" fill="#ECECEC" stroke="#D8D4CA" stroke-width="2"/><text x="200" y="108" font-size="24" fill="#777" text-anchor="middle" font-weight="bold">Usual approach</text><g transform="translate(200,200)"><g transform="translate(0,0) scale(0.9,0.9)"><rect x="-50" y="-34" width="100" height="24" rx="8" fill="#1E3A5F"/><path d="M-30,-34 L-18,-54 L18,-54 L32,-34Z" fill="#1E3A5F"/><path d="M-22,-36 L-14,-50 L0,-50 L0,-36Z M4,-36 L4,-50 L16,-50 L26,-36Z" fill="#BFD6EA"/><circle cx="-28" cy="-10" r="11" fill="#222"/><circle cx="28" cy="-10" r="11" fill="#222"/><rect x="42" y="-30" width="8" height="6" fill="#F2A900"/></g></g><text x="200" y="250" font-size="22" fill="#777" text-anchor="middle" font-weight="bold">1st</text><g transform="translate(300,232)"><g transform="translate(0,0) scale(0.45)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#AAA"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g></g><text x="300" y="262" font-size="16" fill="#999" text-anchor="middle" font-weight="bold">last</text></g><g class="a fade" style="animation-delay:0.70s" ><line x1="365" y1="175" x2="417.0" y2="175.0" stroke="#F2A900" stroke-width="8" stroke-linecap="round"/><path d="M435,175 L417.0,187.0 L417.0,163.0Z" fill="#F2A900"/></g><g class="a right" style="animation-delay:1.00s" ><rect x="450" y="70" width="300" height="210" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><text x="600" y="108" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Good practice</text><g transform="translate(540,232)"><g transform="translate(0,0) scale(0.8)"><circle cx="-4" cy="-22" r="22" fill="none" stroke="#222" stroke-width="5"/><circle cx="24" cy="-6" r="6" fill="#222"/><circle cx="-2" cy="-84" r="11" fill="#E8B48A"/><path d="M-2,-72 L-2,-46 L22,-46 L26,-10" stroke="#1E3A5F" stroke-width="11" stroke-linecap="round" fill="none"/></g></g><g transform="translate(600,232)"><g transform="translate(0,0) scale(0.65)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#C8102E"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g></g><text x="570" y="262" font-size="22" fill="#2E7D32" text-anchor="middle" font-weight="bold">1st</text><g transform="translate(690,226)"><g transform="translate(0,0) scale(0.45,0.45)"><rect x="-50" y="-34" width="100" height="24" rx="8" fill="#1E3A5F"/><path d="M-30,-34 L-18,-54 L18,-54 L32,-34Z" fill="#1E3A5F"/><path d="M-22,-36 L-14,-50 L0,-50 L0,-36Z M4,-36 L4,-50 L16,-50 L26,-36Z" fill="#BFD6EA"/><circle cx="-28" cy="-10" r="11" fill="#222"/><circle cx="28" cy="-10" r="11" fill="#222"/><rect x="42" y="-30" width="8" height="6" fill="#F2A900"/></g></g><text x="690" y="262" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">then</text></g></svg>