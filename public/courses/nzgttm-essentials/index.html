<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NZGTTM Essentials — Sela Civil Advisory</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <header class="course-header">
    <div class="brand">
      <img class="brand-logo" src="assets/sela-logo.png" alt="Sela Civil Advisory Limited" />
      <div class="brand-text">
        <div class="sub">TTM &amp; Roading Safety Advisory</div>
      </div>
    </div>
    <div class="course-title-wrap">
      <div class="course-title-header" id="headerCourseTitle">NZGTTM Essentials</div>
      <button type="button" class="restart-link" id="restartBtn">Start over</button>
    </div>
  </header>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="narration-bar" id="narrationBar" style="display:none;">
    <button type="button" class="narration-toggle" id="narrationBtn" aria-label="Play narration">
      <span id="narrationIcon">&#9654;</span>
    </button>
    <div class="narration-label" id="narrationLabel">Listen to this page</div>
    <div class="narration-time" id="narrationTime">0:00 / 0:00</div>
  </div>
  <audio id="narrationPlayer" preload="none"></audio>

  <main class="course-body" id="courseBody"></main>

  <footer class="course-footer">
    <button type="button" class="nav-btn secondary" id="prevBtn">Back</button>
    <div style="text-align:center;">
      <div class="step-indicator" id="stepIndicator"></div>
      <div class="wait-hint" id="waitHint"></div>
    </div>
    <button type="button" class="nav-btn primary" id="nextBtn">Next</button>
  </footer>

</div>

<script src="js/progress-store.js"></script>
<script src="js/course-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
