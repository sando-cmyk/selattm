<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A self-check list and the TMP practical sign-off"><title>A self-check list and the TMP practical sign-off</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><g class="a left" style="animation-delay:0.20s" ><g><circle cx="90" cy="90" r="16" fill="#2E7D32"/><path d="M82.8,90 l4.8,5.12 l8.8,-9.6" stroke="#fff" stroke-width="3.52" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="120" y="96" font-size="18" fill="#13223D" text-anchor="start" font-weight="bold">Design speed stated and achieved</text></g><g class="a left" style="animation-delay:0.40s" ><g><circle cx="90" cy="142" r="16" fill="#2E7D32"/><path d="M82.8,142 l4.8,5.12 l8.8,-9.6" stroke="#fff" stroke-width="3.52" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="120" y="148" font-size="18" fill="#13223D" text-anchor="start" font-weight="bold">Signs, zones and tapers sized</text></g><g class="a left" style="animation-delay:0.60s" ><g><circle cx="90" cy="194" r="16" fill="#2E7D32"/><path d="M82.8,194 l4.8,5.12 l8.8,-9.6" stroke="#fff" stroke-width="3.52" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="120" y="200" font-size="18" fill="#13223D" text-anchor="start" font-weight="bold">Diagram an STMS can set out</text></g><g class="a left" style="animation-delay:0.80s" ><g><circle cx="90" cy="246" r="16" fill="#2E7D32"/><path d="M82.8,246 l4.8,5.12 l8.8,-9.6" stroke="#fff" stroke-width="3.52" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="120" y="252" font-size="18" fill="#13223D" text-anchor="start" font-weight="bold">Risk drives every change</text></g><g class="a pop" style="animation-delay:1.10s" ><rect x="520" y="80" width="230" height="190" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><text x="635" y="130" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">Practical</text><text x="635" y="158" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">sign-off</text><text x="635" y="196" font-size="15" fill="#3C4A5E" text-anchor="middle" font-weight="bold">submit a TMP</text><text x="635" y="220" font-size="14" fill="#C8102E" text-anchor="middle" font-weight="bold">18 criteria · 3 attempts</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Check it, then get it signed off</text></svg>