<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A draft traffic management diagram with five numbered problems"><title>A draft traffic management diagram with five numbered problems</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#DCEBCF'/><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFE7A8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#F2A900" stroke-width="6"/></pattern></defs><rect x="0" y="150" width="800" height="96" fill="#5B6270"/><line x1="0" y1="153" x2="800" y2="153" stroke="#fff" stroke-width="3"/><line x1="0" y1="243" x2="800" y2="243" stroke="#fff" stroke-width="3"/><line x1="0" y1="198" x2="800" y2="198" stroke="#fff" stroke-width="3" stroke-dasharray="24 20"/><g class="a fade" style="animation-delay:0.10s" ><rect x="560" y="152" width="230" height="44" fill="url(#hatch)" stroke="#F2A900" stroke-width="2"/><rect x="625.0" y="163.0" width="100" height="22" rx="4" fill="#fff" opacity=".9"/><text x="675.0" y="179.0" font-size="13" fill="#13223D" text-anchor="middle" font-weight="bold">WORK AREA</text></g><g class="a fade" style="animation-delay:0.20s" ><g><line x1="60" y1="118" x2="60" y2="141.0" stroke="#555" stroke-width="3"/><rect x="45.0" y="103.0" width="30.0" height="30.0" fill="#F26B1D" stroke="#222" stroke-width="2" transform="rotate(45 60 118)"/><text x="60" y="123.0" font-size="14.0" font-weight="bold" text-anchor="middle" fill="#222" font-family="Arial">!</text></g><g><line x1="140" y1="118" x2="140" y2="141.0" stroke="#555" stroke-width="3"/><rect x="125.0" y="103.0" width="30.0" height="30.0" fill="#F26B1D" stroke="#222" stroke-width="2" transform="rotate(45 140 118)"/><text x="140" y="123.0" font-size="14.0" font-weight="bold" text-anchor="middle" fill="#222" font-family="Arial">!</text></g></g><g class="a pop" style="animation-delay:0.30s" ><circle cx="420.0" cy="150.0" r="6" fill="#F26B1D"/><circle cx="420.0" cy="150.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.35s" ><circle cx="466.6666666666667" cy="165.33333333333334" r="6" fill="#F26B1D"/><circle cx="466.6666666666667" cy="165.33333333333334" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.40s" ><circle cx="513.3333333333334" cy="180.66666666666666" r="6" fill="#F26B1D"/><circle cx="513.3333333333334" cy="180.66666666666666" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.45s" ><circle cx="560.0" cy="196.0" r="6" fill="#F26B1D"/><circle cx="560.0" cy="196.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.40s" ><circle cx="560.0" cy="198.0" r="6" fill="#F26B1D"/><circle cx="560.0" cy="198.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.45s" ><circle cx="615.0" cy="198.0" r="6" fill="#F26B1D"/><circle cx="615.0" cy="198.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.50s" ><circle cx="670.0" cy="198.0" r="6" fill="#F26B1D"/><circle cx="670.0" cy="198.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.55s" ><circle cx="725.0" cy="198.0" r="6" fill="#F26B1D"/><circle cx="725.0" cy="198.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.60s" ><circle cx="780.0" cy="198.0" r="6" fill="#F26B1D"/><circle cx="780.0" cy="198.0" r="2.4000000000000004" fill="#fff"/></g><g class="a fade" style="animation-delay:0.60s" ><text x="20" y="330" font-size="13" fill="#3C4A5E" text-anchor="start" font-weight="bold">No north point · no road names · no dimensions</text></g><g class="a pop" style="animation-delay:0.90s" ><circle cx="100" cy="82" r="17" fill="#C8102E" class="pulse"/><text x="100" y="88" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text></g><g class="a pop" style="animation-delay:1.05s" ><circle cx="490" cy="150" r="17" fill="#C8102E" class="pulse"/><text x="490" y="156" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text></g><g class="a pop" style="animation-delay:1.20s" ><circle cx="560" cy="230" r="17" fill="#C8102E" class="pulse"/><text x="560" y="236" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text></g><g class="a pop" style="animation-delay:1.35s" ><circle cx="700" cy="230" r="17" fill="#C8102E" class="pulse"/><text x="700" y="236" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text></g><g class="a pop" style="animation-delay:1.50s" ><circle cx="240" cy="300" r="17" fill="#C8102E" class="pulse"/><text x="240" y="306" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Activity: find the five errors</text></svg>