<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="The TMP Planning Form, General Form, TMD Form and diagram"><title>The TMP Planning Form, General Form, TMD Form and diagram</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><g class="a up" style="animation-delay:0.20s" ><g transform="translate(70,150) scale(1.2)"><rect x="-36" y="-48" width="72" height="96" rx="6" fill="#FFFFFF" stroke="#13223D" stroke-width="3"/><rect x="-24" y="-32" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="-16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="0" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="32" width="48" height="6" rx="3" fill="#B8C2CF"/></g><text x="110" y="230" font-size="17" fill="#13223D" text-anchor="middle" font-weight="bold">Planning Form</text><text x="110" y="252" font-size="13" fill="#3C4A5E" text-anchor="middle" font-weight="bold">risk reviewer, approver</text></g><g class="a up" style="animation-delay:0.35s" ><g transform="translate(263,150) scale(1.2)"><rect x="-36" y="-48" width="72" height="96" rx="6" fill="#FFFFFF" stroke="#13223D" stroke-width="3"/><rect x="-24" y="-32" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="-16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="0" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="32" width="48" height="6" rx="3" fill="#B8C2CF"/></g><text x="303" y="230" font-size="17" fill="#13223D" text-anchor="middle" font-weight="bold">General Form</text><text x="303" y="252" font-size="13" fill="#3C4A5E" text-anchor="middle" font-weight="bold">everyone</text></g><g class="a up" style="animation-delay:0.50s" ><g transform="translate(456,150) scale(1.2)"><rect x="-36" y="-48" width="72" height="96" rx="6" fill="#FFFFFF" stroke="#13223D" stroke-width="3"/><rect x="-24" y="-32" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="-16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="0" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="32" width="48" height="6" rx="3" fill="#B8C2CF"/></g><text x="496" y="230" font-size="17" fill="#13223D" text-anchor="middle" font-weight="bold">TMD Form</text><text x="496" y="252" font-size="13" fill="#3C4A5E" text-anchor="middle" font-weight="bold">one per layout</text></g><g class="a up" style="animation-delay:0.65s" ><g transform="translate(649,150) scale(1.2)"><rect x="-36" y="-48" width="72" height="96" rx="6" fill="#FFFFFF" stroke="#13223D" stroke-width="3"/><rect x="-24" y="-32" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="-16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="0" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="32" width="48" height="6" rx="3" fill="#B8C2CF"/></g><text x="689" y="230" font-size="17" fill="#13223D" text-anchor="middle" font-weight="bold">Diagram</text><text x="689" y="252" font-size="13" fill="#3C4A5E" text-anchor="middle" font-weight="bold">the drawing</text></g><g class="a fade" style="animation-delay:1.00s" ><text x="400" y="310" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Label distances in metres and seconds so the STMS can check them</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">The NZGTTM TMP form set</text></svg>