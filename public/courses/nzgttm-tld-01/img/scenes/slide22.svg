<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A mobile operation: tail pilot, shadow vehicle with TMA and work vehicle with separations"><title>A mobile operation: tail pilot, shadow vehicle with TMA and work vehicle with separations</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#DCEBCF'/><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFE7A8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#F2A900" stroke-width="6"/></pattern></defs><rect x="0" y="150" width="800" height="96" fill="#5B6270"/><line x1="0" y1="153" x2="800" y2="153" stroke="#fff" stroke-width="3"/><line x1="0" y1="243" x2="800" y2="243" stroke="#fff" stroke-width="3"/><line x1="0" y1="198" x2="800" y2="198" stroke="#fff" stroke-width="3" stroke-dasharray="24 20"/><g class="a left" style="animation-delay:0.20s" ><rect x="75.0" y="209.0" width="70" height="26" rx="3" fill="#fff"/><rect x="125.0" y="209.0" width="20" height="26" rx="3" fill="#3C4A5E"/><g><line x1="110" y1="280" x2="110" y2="298.5" stroke="#555" stroke-width="3"/><rect x="99.5" y="269.5" width="21.0" height="21.0" fill="#F26B1D" stroke="#222" stroke-width="2" transform="rotate(45 110 280)"/><text x="110" y="283.5" font-size="9.799999999999999" font-weight="bold" text-anchor="middle" fill="#222" font-family="Arial">!</text></g></g><g class="a left" style="animation-delay:0.40s" ><rect x="392.0" y="209.0" width="76" height="26" rx="3" fill="#1E3A5F"/><rect x="448.0" y="209.0" width="20" height="26" rx="3" fill="#3C4A5E"/><rect x="374.0" y="211.0" width="18" height="22" fill="#F2A900"/><line x1="374.0" y1="211.0" x2="380.0" y2="233.0" stroke="#222" stroke-width="2"/><line x1="380.0" y1="211.0" x2="386.0" y2="233.0" stroke="#222" stroke-width="2"/><line x1="386.0" y1="211.0" x2="392.0" y2="233.0" stroke="#222" stroke-width="2"/></g><g class="a left" style="animation-delay:0.60s" ><rect x="595.0" y="208.0" width="90" height="28" rx="3" fill="#F2A900"/><rect x="665.0" y="208.0" width="20" height="28" rx="3" fill="#3C4A5E"/></g><g class="a fade" style="animation-delay:0.80s" ><text x="110" y="140" font-size="14" fill="#13223D" text-anchor="middle" font-weight="bold">tail pilot</text><text x="430" y="140" font-size="14" fill="#13223D" text-anchor="middle" font-weight="bold">shadow + TMA</text><text x="640" y="140" font-size="14" fill="#13223D" text-anchor="middle" font-weight="bold">work vehicle</text></g><g class="a grow" style="animation-delay:1.00s" ><line x1="150" y1="300" x2="380" y2="300" stroke="#C8102E" stroke-width="2.5"/><line x1="150" y1="292" x2="150" y2="308" stroke="#C8102E" stroke-width="2.5"/><line x1="380" y1="292" x2="380" y2="308" stroke="#C8102E" stroke-width="2.5"/><path d="M150,300 l9,-5 v10z M380,300 l-9,-5 v10z" fill="#C8102E"/><rect x="179.625" y="305" width="170.75" height="21" rx="4" fill="#fff" opacity=".92"/><text x="265.0" y="320" font-size="15" fill="#C8102E" text-anchor="middle" font-weight="bold">4-8 s at 60-80 km/h</text></g><g class="a grow" style="animation-delay:1.20s" ><line x1="450" y1="112" x2="590" y2="112" stroke="#3C4A5E" stroke-width="2.5"/><line x1="450" y1="104" x2="450" y2="120" stroke="#3C4A5E" stroke-width="2.5"/><line x1="590" y1="104" x2="590" y2="120" stroke="#3C4A5E" stroke-width="2.5"/><path d="M450,112 l9,-5 v10z M590,112 l-9,-5 v10z" fill="#3C4A5E"/><rect x="422.25" y="89" width="195.50000000000003" height="21" rx="4" fill="#fff" opacity=".92"/><text x="520.0" y="104" font-size="15" fill="#3C4A5E" text-anchor="middle" font-weight="bold">roll-ahead: it depends</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Mobile operations</text></svg>