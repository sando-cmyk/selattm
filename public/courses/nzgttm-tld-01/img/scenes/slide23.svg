<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Four ways to manage traffic around a site, matched to the eight NZGTTM design guides"><title>Four ways to manage traffic around a site, matched to the eight NZGTTM design guides</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><g class="a up" style="animation-delay:0.20s" ><rect x="25" y="70" width="170" height="200" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><g><circle cx="110" cy="130" r="38" fill="#13223D"/><text x="110" y="142" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text></g><text x="110" y="200" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Go round</text><text x="110" y="224" font-size="13" fill="#3C4A5E" text-anchor="middle" font-weight="bold">detour / closure</text><text x="110" y="252" font-size="13" fill="#C8102E" text-anchor="middle" font-weight="bold">Design guide 1-2</text></g><g class="a up" style="animation-delay:0.35s" ><rect x="218" y="70" width="170" height="200" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><g><circle cx="303" cy="130" r="38" fill="#1E3A5F"/><text x="303" y="142" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text></g><text x="303" y="200" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Go through</text><text x="303" y="224" font-size="13" fill="#3C4A5E" text-anchor="middle" font-weight="bold">contraflow, signals</text><text x="303" y="252" font-size="13" fill="#C8102E" text-anchor="middle" font-weight="bold">Design guide 3</text></g><g class="a up" style="animation-delay:0.50s" ><rect x="411" y="70" width="170" height="200" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><g><circle cx="496" cy="130" r="38" fill="#2E7D32"/><text x="496" y="142" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text></g><text x="496" y="200" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Go past</text><text x="496" y="224" font-size="13" fill="#3C4A5E" text-anchor="middle" font-weight="bold">lane closure</text><text x="496" y="252" font-size="13" fill="#C8102E" text-anchor="middle" font-weight="bold">Design guide 4, 5, 6, 8</text></g><g class="a up" style="animation-delay:0.65s" ><rect x="604" y="70" width="170" height="200" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><g><circle cx="689" cy="130" r="38" fill="#F2A900"/><text x="689" y="142" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text></g><text x="689" y="200" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">In the gaps</text><text x="689" y="224" font-size="13" fill="#3C4A5E" text-anchor="middle" font-weight="bold">short stops</text><text x="689" y="252" font-size="13" fill="#C8102E" text-anchor="middle" font-weight="bold">Design guide 7</text></g><g class="a fade" style="animation-delay:1.00s" ><text x="400" y="310" font-size="17" fill="#13223D" text-anchor="middle" font-weight="bold">Prompts for thinking - not plans to copy</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">The design guide diagrams</text></svg>