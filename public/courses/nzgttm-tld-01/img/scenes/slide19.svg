<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A taper of about ten cones that reads as a wall, and a threshold of cones on the approach"><title>A taper of about ten cones that reads as a wall, and a threshold of cones on the approach</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#DCEBCF'/><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFE7A8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#F2A900" stroke-width="6"/></pattern></defs><rect x="0" y="150" width="800" height="96" fill="#5B6270"/><line x1="0" y1="153" x2="800" y2="153" stroke="#fff" stroke-width="3"/><line x1="0" y1="243" x2="800" y2="243" stroke="#fff" stroke-width="3"/><line x1="0" y1="198" x2="800" y2="198" stroke="#fff" stroke-width="3" stroke-dasharray="24 20"/><g class="a pop" style="animation-delay:0.20s" ><circle cx="290.0" cy="246.0" r="6" fill="#F26B1D"/><circle cx="290.0" cy="246.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.26s" ><circle cx="316.6666666666667" cy="240.66666666666666" r="6" fill="#F26B1D"/><circle cx="316.6666666666667" cy="240.66666666666666" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.32s" ><circle cx="343.3333333333333" cy="235.33333333333334" r="6" fill="#F26B1D"/><circle cx="343.3333333333333" cy="235.33333333333334" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.38s" ><circle cx="370.0" cy="230.0" r="6" fill="#F26B1D"/><circle cx="370.0" cy="230.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.44s" ><circle cx="396.6666666666667" cy="224.66666666666666" r="6" fill="#F26B1D"/><circle cx="396.6666666666667" cy="224.66666666666666" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.50s" ><circle cx="423.33333333333337" cy="219.33333333333334" r="6" fill="#F26B1D"/><circle cx="423.33333333333337" cy="219.33333333333334" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.56s" ><circle cx="450.0" cy="214.0" r="6" fill="#F26B1D"/><circle cx="450.0" cy="214.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.62s" ><circle cx="476.66666666666663" cy="208.66666666666666" r="6" fill="#F26B1D"/><circle cx="476.66666666666663" cy="208.66666666666666" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.68s" ><circle cx="503.33333333333337" cy="203.33333333333334" r="6" fill="#F26B1D"/><circle cx="503.33333333333337" cy="203.33333333333334" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.74s" ><circle cx="530.0" cy="198.0" r="6" fill="#F26B1D"/><circle cx="530.0" cy="198.0" r="2.4000000000000004" fill="#fff"/></g><g class="a fade" style="animation-delay:0.10s" ><rect x="530" y="200" width="260" height="44" fill="url(#hatch)" stroke="#F2A900" stroke-width="2"/><rect x="610.0" y="211.0" width="100" height="22" rx="4" fill="#fff" opacity=".9"/><text x="660.0" y="227.0" font-size="13" fill="#13223D" text-anchor="middle" font-weight="bold">WORK AREA</text></g><g class="a pop" style="animation-delay:0.90s" ><circle cx="110.0" cy="140.0" r="6" fill="#F26B1D"/><circle cx="110.0" cy="140.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.95s" ><circle cx="130.0" cy="140.0" r="6" fill="#F26B1D"/><circle cx="130.0" cy="140.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:1.00s" ><circle cx="150.0" cy="140.0" r="6" fill="#F26B1D"/><circle cx="150.0" cy="140.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:1.05s" ><circle cx="170.0" cy="140.0" r="6" fill="#F26B1D"/><circle cx="170.0" cy="140.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:1.10s" ><circle cx="190.0" cy="140.0" r="6" fill="#F26B1D"/><circle cx="190.0" cy="140.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:1.00s" ><circle cx="110.0" cy="256.0" r="6" fill="#F26B1D"/><circle cx="110.0" cy="256.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:1.05s" ><circle cx="130.0" cy="256.0" r="6" fill="#F26B1D"/><circle cx="130.0" cy="256.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:1.10s" ><circle cx="150.0" cy="256.0" r="6" fill="#F26B1D"/><circle cx="150.0" cy="256.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:1.15s" ><circle cx="170.0" cy="256.0" r="6" fill="#F26B1D"/><circle cx="170.0" cy="256.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:1.20s" ><circle cx="190.0" cy="256.0" r="6" fill="#F26B1D"/><circle cx="190.0" cy="256.0" r="2.4000000000000004" fill="#fff"/></g><g class="a fade" style="animation-delay:1.20s" ><text x="150" y="126" font-size="14" fill="#13223D" text-anchor="middle" font-weight="bold">threshold: 5 devices</text></g><g class="a fade" style="animation-delay:1.00s" ><text x="410" y="290" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">about 10 devices = looks like a wall</text></g><g class="a fade" style="animation-delay:1.30s" ><text x="400" y="322" font-size="15" fill="#3C4A5E" text-anchor="middle" font-weight="bold">Taper spacing: 2.5 m / 5 m / 10 m - set out from the dashed lane markings</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Tapers, curves and thresholds</text></svg>