<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Rear view of a 2.55 m truck with mirrors in a 2.75 m lane, leaving almost no clearance"><title>Rear view of a 2.55 m truck with mirrors in a 2.75 m lane, leaving almost no clearance</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><rect x="0" y="0" width="800" height="340" fill="#E3ECF5"/><rect x="120" y="250" width="560" height="20" fill="#5B6270"/><g class="a up" style="animation-delay:0.20s" ><rect x="275" y="110" width="250" height="140" rx="6" fill="#13223D"/><rect x="250" y="130" width="22" height="34" fill="#3C4A5E"/><rect x="528" y="130" width="22" height="34" fill="#3C4A5E"/></g><g class="a grow" style="animation-delay:0.60s" ><line x1="275" y1="300" x2="525" y2="300" stroke="#13223D" stroke-width="2.5"/><line x1="275" y1="292" x2="275" y2="308" stroke="#13223D" stroke-width="2.5"/><line x1="525" y1="292" x2="525" y2="308" stroke="#13223D" stroke-width="2.5"/><path d="M275,300 l9,-5 v10z M525,300 l-9,-5 v10z" fill="#13223D"/><rect x="343.5" y="305" width="113.00000000000001" height="21" rx="4" fill="#fff" opacity=".92"/><text x="400.0" y="320" font-size="15" fill="#13223D" text-anchor="middle" font-weight="bold">truck 2.55 m</text></g><g class="a grow" style="animation-delay:0.90s" ><line x1="250" y1="92" x2="550" y2="92" stroke="#3C4A5E" stroke-width="2.5"/><line x1="250" y1="84" x2="250" y2="100" stroke="#3C4A5E" stroke-width="2.5"/><line x1="550" y1="84" x2="550" y2="100" stroke="#3C4A5E" stroke-width="2.5"/><path d="M250,92 l9,-5 v10z M550,92 l-9,-5 v10z" fill="#3C4A5E"/><rect x="261.0" y="69" width="278.0" height="21" rx="4" fill="#fff" opacity=".92"/><text x="400.0" y="84" font-size="15" fill="#3C4A5E" text-anchor="middle" font-weight="bold">+ mirrors up to 240 mm each side</text></g><g class="a fade" style="animation-delay:1.20s" ><line x1="262" y1="230" x2="262" y2="270" stroke="#C8102E" stroke-width="4"/><line x1="538" y1="230" x2="538" y2="270" stroke="#C8102E" stroke-width="4"/></g><g class="a fade" style="animation-delay:1.30s" ><text x="400" y="214" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2.75 m lane = 100 mm each side</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Temporary lane width</text><text x="776" y="30" font-size="15" fill="#F2A900" text-anchor="end" font-weight="bold">rear view</text></svg>