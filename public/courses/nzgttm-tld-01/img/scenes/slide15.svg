<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A taper of cones moves traffic one lane width at one metre per second"><title>A taper of cones moves traffic one lane width at one metre per second</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#DCEBCF'/><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFE7A8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#F2A900" stroke-width="6"/></pattern></defs><rect x="0" y="150" width="800" height="96" fill="#5B6270"/><line x1="0" y1="153" x2="800" y2="153" stroke="#fff" stroke-width="3"/><line x1="0" y1="243" x2="800" y2="243" stroke="#fff" stroke-width="3"/><line x1="0" y1="198" x2="800" y2="198" stroke="#fff" stroke-width="3" stroke-dasharray="24 20"/><g class="a fade" style="animation-delay:0.10s" ><rect x="520" y="200" width="270" height="44" fill="url(#hatch)" stroke="#F2A900" stroke-width="2"/><rect x="605.0" y="211.0" width="100" height="22" rx="4" fill="#fff" opacity=".9"/><text x="655.0" y="227.0" font-size="13" fill="#13223D" text-anchor="middle" font-weight="bold">WORK AREA</text></g><g class="a pop" style="animation-delay:0.20s" ><circle cx="300.0" cy="246.0" r="6" fill="#F26B1D"/><circle cx="300.0" cy="246.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.25s" ><circle cx="324.44444444444446" cy="240.66666666666666" r="6" fill="#F26B1D"/><circle cx="324.44444444444446" cy="240.66666666666666" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.30s" ><circle cx="348.8888888888889" cy="235.33333333333334" r="6" fill="#F26B1D"/><circle cx="348.8888888888889" cy="235.33333333333334" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.35s" ><circle cx="373.3333333333333" cy="230.0" r="6" fill="#F26B1D"/><circle cx="373.3333333333333" cy="230.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.40s" ><circle cx="397.77777777777777" cy="224.66666666666666" r="6" fill="#F26B1D"/><circle cx="397.77777777777777" cy="224.66666666666666" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.45s" ><circle cx="422.22222222222223" cy="219.33333333333334" r="6" fill="#F26B1D"/><circle cx="422.22222222222223" cy="219.33333333333334" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.50s" ><circle cx="446.66666666666663" cy="214.0" r="6" fill="#F26B1D"/><circle cx="446.66666666666663" cy="214.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.55s" ><circle cx="471.1111111111111" cy="208.66666666666666" r="6" fill="#F26B1D"/><circle cx="471.1111111111111" cy="208.66666666666666" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.60s" ><circle cx="495.55555555555554" cy="203.33333333333334" r="6" fill="#F26B1D"/><circle cx="495.55555555555554" cy="203.33333333333334" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.65s" ><circle cx="520.0" cy="198.0" r="6" fill="#F26B1D"/><circle cx="520.0" cy="198.0" r="2.4000000000000004" fill="#fff"/></g><g class="a fade" style="animation-delay:0.80s" ><path d="M40,222 L300,222 C400,222 420,174 520,174 L790,174" fill="none" stroke="#2E7D32" stroke-width="4" stroke-dasharray="10 8"/></g><g class="a drive" style="animation-delay:0.30s" ><g><rect x="77.0" y="211.0" width="46" height="22" rx="6" fill="#1E3A5F"/><rect x="101.0" y="214.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g><g class="a grow" style="animation-delay:1.00s" ><line x1="300" y1="300" x2="520" y2="300" stroke="#2E7D32" stroke-width="2.5"/><line x1="300" y1="292" x2="300" y2="308" stroke="#2E7D32" stroke-width="2.5"/><line x1="520" y1="292" x2="520" y2="308" stroke="#2E7D32" stroke-width="2.5"/><path d="M300,300 l9,-5 v10z M520,300 l-9,-5 v10z" fill="#2E7D32"/><rect x="217.37499999999997" y="305" width="385.25000000000006" height="21" rx="4" fill="#fff" opacity=".92"/><text x="410.0" y="320" font-size="15" fill="#2E7D32" text-anchor="middle" font-weight="bold">taper = lane width at 1 m/s (3.5 s of travel)</text></g><g class="a fade" style="animation-delay:1.20s" ><text x="160" y="90" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">80 km/h ≈ 78 m</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Taper length</text></svg>