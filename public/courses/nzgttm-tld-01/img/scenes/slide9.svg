<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Three speed signs, 50, 80 and 100 km/h, to tap"><title>Three speed signs, 50, 80 and 100 km/h, to tap</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><g class="a pop" style="animation-delay:0.20s" ><circle cx="160" cy="150" r="56" fill="#fff" stroke="#C8102E" stroke-width="12.32"/><text x="160" y="168.48" font-size="50.4" fill="#111" text-anchor="middle" font-weight="bold">50</text></g><g class="a fade" style="animation-delay:0.60s" ><text x="160" y="248" font-size="15" fill="#3C4A5E" text-anchor="middle" font-weight="bold">tap to see</text><text x="160" y="270" font-size="15" fill="#3C4A5E" text-anchor="middle" font-weight="bold">the dimensions</text></g><g class="a pop" style="animation-delay:0.40s" ><circle cx="400" cy="150" r="56" fill="#fff" stroke="#C8102E" stroke-width="12.32"/><text x="400" y="168.48" font-size="50.4" fill="#111" text-anchor="middle" font-weight="bold">80</text></g><g class="a fade" style="animation-delay:0.80s" ><text x="400" y="248" font-size="15" fill="#3C4A5E" text-anchor="middle" font-weight="bold">tap to see</text><text x="400" y="270" font-size="15" fill="#3C4A5E" text-anchor="middle" font-weight="bold">the dimensions</text></g><g class="a pop" style="animation-delay:0.60s" ><circle cx="640" cy="150" r="56" fill="#fff" stroke="#C8102E" stroke-width="12.32"/><text x="640" y="168.48" font-size="50.4" fill="#111" text-anchor="middle" font-weight="bold">100</text></g><g class="a fade" style="animation-delay:1.00s" ><text x="640" y="248" font-size="15" fill="#3C4A5E" text-anchor="middle" font-weight="bold">tap to see</text><text x="640" y="270" font-size="15" fill="#3C4A5E" text-anchor="middle" font-weight="bold">the dimensions</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Activity: pick a speed</text></svg>