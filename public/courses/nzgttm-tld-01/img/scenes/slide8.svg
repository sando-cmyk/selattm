<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A queue stretches past the first sign, so the advance signs are moved further back"><title>A queue stretches past the first sign, so the advance signs are moved further back</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#DCEBCF'/><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFE7A8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#F2A900" stroke-width="6"/></pattern></defs><rect x="0" y="170" width="800" height="96" fill="#5B6270"/><line x1="0" y1="173" x2="800" y2="173" stroke="#fff" stroke-width="3"/><line x1="0" y1="263" x2="800" y2="263" stroke="#fff" stroke-width="3"/><line x1="0" y1="218" x2="800" y2="218" stroke="#fff" stroke-width="3" stroke-dasharray="24 20"/><g class="a fade" style="animation-delay:0.10s" ><rect x="620" y="172" width="170" height="44" fill="url(#hatch)" stroke="#F2A900" stroke-width="2"/><rect x="655.0" y="183.0" width="100" height="22" rx="4" fill="#fff" opacity=".9"/><text x="705.0" y="199.0" font-size="13" fill="#13223D" text-anchor="middle" font-weight="bold">WORK AREA</text></g><g class="a left" style="animation-delay:0.20s" ><g><rect x="537.0" y="231.0" width="46" height="22" rx="6" fill="#8A9BB0"/><rect x="561.0" y="234.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g><g class="a left" style="animation-delay:0.32s" ><g><rect x="479.0" y="231.0" width="46" height="22" rx="6" fill="#1E3A5F"/><rect x="503.0" y="234.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g><g class="a left" style="animation-delay:0.44s" ><g><rect x="421.0" y="231.0" width="46" height="22" rx="6" fill="#6E7F94"/><rect x="445.0" y="234.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g><g class="a left" style="animation-delay:0.56s" ><g><rect x="363.0" y="231.0" width="46" height="22" rx="6" fill="#8A9BB0"/><rect x="387.0" y="234.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g><g class="a left" style="animation-delay:0.68s" ><g><rect x="305.0" y="231.0" width="46" height="22" rx="6" fill="#1E3A5F"/><rect x="329.0" y="234.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g><g class="a left" style="animation-delay:0.80s" ><g><rect x="247.0" y="231.0" width="46" height="22" rx="6" fill="#6E7F94"/><rect x="271.0" y="234.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g><g class="a left" style="animation-delay:0.92s" ><g><rect x="189.0" y="231.0" width="46" height="22" rx="6" fill="#8A9BB0"/><rect x="213.0" y="234.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g><g class="a left" style="animation-delay:1.04s" ><g><rect x="131.0" y="231.0" width="46" height="22" rx="6" fill="#1E3A5F"/><rect x="155.0" y="234.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g><g class="a fade" style="animation-delay:0.30s" ><g><line x1="250" y1="138" x2="250" y2="161.0" stroke="#555" stroke-width="3"/><rect x="235.0" y="123.0" width="30.0" height="30.0" fill="#F26B1D" stroke="#222" stroke-width="2" transform="rotate(45 250 138)"/><text x="250" y="143.0" font-size="14.0" font-weight="bold" text-anchor="middle" fill="#222" font-family="Arial">!</text></g></g><g class="a pop" style="animation-delay:1.30s" ><g><circle cx="250" cy="92" r="16" fill="#C8102E"/><path d="M243.6,85.6 L256.4,98.4 M256.4,85.6 L243.6,98.4" stroke="#fff" stroke-width="3.52" stroke-linecap="round"/></g></g><g class="a drop" style="animation-delay:1.50s" ><g><line x1="60" y1="138" x2="60" y2="161.0" stroke="#555" stroke-width="3"/><rect x="45.0" y="123.0" width="30.0" height="30.0" fill="#F26B1D" stroke="#222" stroke-width="2" transform="rotate(45 60 138)"/><text x="60" y="143.0" font-size="14.0" font-weight="bold" text-anchor="middle" fill="#222" font-family="Arial">!</text></g></g><g class="a pop" style="animation-delay:1.70s" ><g><circle cx="60" cy="92" r="16" fill="#2E7D32"/><path d="M52.8,92 l4.8,5.12 l8.8,-9.6" stroke="#fff" stroke-width="3.52" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="a fade" style="animation-delay:1.50s" ><line x1="230" y1="92" x2="108.0" y2="92.0" stroke="#C8102E" stroke-width="4" stroke-linecap="round"/><path d="M90,92 L108.0,80.0 L108.0,104.0Z" fill="#C8102E"/></g><g class="a fade" style="animation-delay:1.60s" ><text x="400" y="320" font-size="17" fill="#13223D" text-anchor="middle" font-weight="bold">If the queue can reach the first sign, move the signs back</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Queues and the approach</text></svg>