"/><circle cx="530.0" cy="258.3333333333333" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.50s" ><circle cx="550.0" cy="250.66666666666666" r="6" fill="#F26B1D"/><circle cx="550.0" cy="250.66666666666666" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.55s" ><circle cx="570.0" cy="243.0" r="6" fill="#F26B1D"/><circle cx="570.0" cy="243.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.60s" ><circle cx="590.0" cy="235.33333333333334" r="6" fill="#F26B1D"/><circle cx="590.0" cy="235.33333333333334" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.65s" ><circle cx="610.0" cy="227.66666666666666" r="6" fill="#F26B1D"/><circle cx="610.0" cy="227.66666666666666" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.70s" ><circle cx="630.0" cy="220.0" r="6" fill="#F26B1D"/><circle cx="630.0" cy="220.0" r="2.4000000000000004" fill="#fff"/></g><g class="a drive" style="animation-delay:0.10s" ><g><rect x="17.0" y="231.0" width="46" height="22" rx="6" fill="#1E3A5F"/><rect x="41.0" y="234.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g><g class="a grow" style="animation-delay:0.90s" ><line x1="150" y1="300" x2="510" y2="300" stroke="#C8102E" stroke-width="2.5"/><line x1="150" y1="292" x2="150" y2="308" stroke="#C8102E" stroke-width="2.5"/><line x1="510" y1="292" x2="510" y2="308" stroke="#C8102E" stroke-width="2.5"/><path d="M150,300 l9,-5 v10z M510,300 l-9,-5 v10z" fill="#C8102E"/><rect x="153.875" y="305" width="352.25" height="21" rx="4" fill="#fff" opacity=".92"/><text x="330.0" y="320" font-size="15" fill="#C8102E" text-anchor="middle" font-weight="bold">warning distance = SISD − sign visibility</text></g><g class="a grow" style="animation-delay:1.10s" ><line x1="40" y1="112" x2="150" y2="112" stroke="#3C4A5E" stroke-width="2.5"/><line x1="40" y1="104" x2="40" y2="120" stroke="#3C4A5E" stroke-width="2