<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Three signs spaced at 1.25 times reaction time, and a variable message sign that needs longer"><title>Three signs spaced at 1.25 times reaction time, and a variable message sign that needs longer</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#DCEBCF'/><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFE7A8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#F2A900" stroke-width="6"/></pattern></defs><rect x="0" y="170" width="800" height="96" fill="#5B6270"/><line x1="0" y1="173" x2="800" y2="173" stroke="#fff" stroke-width="3"/><line x1="0" y1="263" x2="800" y2="263" stroke="#fff" stroke-width="3"/><line x1="0" y1="218" x2="800" y2="218" stroke="#fff" stroke-width="3" stroke-dasharray="24 20"/><g class="a drop" style="animation-delay:0.20s" ><g><line x1="120" y1="138" x2="120" y2="161.0" stroke="#555" stroke-width="3"/><rect x="105.0" y="123.0" width="30.0" height="30.0" fill="#F26B1D" stroke="#222" stroke-width="2" transform="rotate(45 120 138)"/><text x="120" y="143.0" font-size="14.0" font-weight="bold" text-anchor="middle" fill="#222" font-family="Arial">!</text></g></g><g class="a drop" style="animation-delay:0.40s" ><g><line x1="330" y1="138" x2="330" y2="161.0" stroke="#555" stroke-width="3"/><rect x="315.0" y="123.0" width="30.0" height="30.0" fill="#F26B1D" stroke="#222" stroke-width="2" transform="rotate(45 330 138)"/><text x="330" y="143.0" font-size="14.0" font-weight="bold" text-anchor="middle" fill="#222" font-family="Arial">!</text></g></g><g class="a drop" style="animation-delay:0.60s" ><g><line x1="540" y1="138" x2="540" y2="161.0" stroke="#555" stroke-width="3"/><rect x="525.0" y="123.0" width="30.0" height="30.0" fill="#F26B1D" stroke="#222" stroke-width="2" transform="rotate(45 540 138)"/><text x="540" y="143.0" font-size="14.0" font-weight="bold" text-anchor="middle" fill="#222" font-family="Arial">!</text></g></g><g class="a pop" style="animation-delay:0.90s" ><rect x="660" y="96" width="120" height="58" rx="4" fill="#111"/><text x="720" y="120" font-size="13" fill="#F2A900" text-anchor="middle" font-weight="bold">ROAD WORKS</text><text x="720" y="142" font-size="12" fill="#F2A900" text-anchor="middle" font-weight="bold">EXPECT DELAYS</text><line x1="700" y1="154" x2="700" y2="168" stroke="#555" stroke-width="4"/><line x1="740" y1="154" x2="740" y2="168" stroke="#555" stroke-width="4"/></g><g class="a grow" style="animation-delay:1.00s" ><line x1="120" y1="300" x2="330" y2="300" stroke="#13223D" stroke-width="2.5"/><line x1="120" y1="292" x2="120" y2="308" stroke="#13223D" stroke-width="2.5"/><line x1="330" y1="292" x2="330" y2="308" stroke="#13223D" stroke-width="2.5"/><path d="M120,300 l9,-5 v10z M330,300 l-9,-5 v10z" fill="#13223D"/><rect x="114.87499999999999" y="305" width="220.25000000000003" height="21" rx="4" fill="#fff" opacity=".92"/><text x="225.0" y="320" font-size="15" fill="#13223D" text-anchor="middle" font-weight="bold">spacing = 1.25 × reaction</text></g><g class="a grow" style="animation-delay:1.20s" ><line x1="330" y1="300" x2="540" y2="300" stroke="#13223D" stroke-width="2.5"/><line x1="330" y1="292" x2="330" y2="308" stroke="#13223D" stroke-width="2.5"/><line x1="540" y1="292" x2="540" y2="308" stroke="#13223D" stroke-width="2.5"/><path d="M330,300 l9,-5 v10z M540,300 l-9,-5 v10z" fill="#13223D"/><rect x="399.125" y="305" width="71.75" height="21" rx="4" fill="#fff" opacity=".92"/><text x="435.0" y="320" font-size="15" fill="#13223D" text-anchor="middle" font-weight="bold">spacing</text></g><g class="a fade" style="animation-delay:1.30s" ><text x="780" y="86" font-size="14" fill="#C8102E" text-anchor="end" font-weight="bold">VMS: more words, more time</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Sign spacing</text></svg>