<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="All six modules lead to the final assessment"><title>All six modules lead to the final assessment</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><g class="a pop" style="animation-delay:0.20s" ><g><circle cx="90" cy="140" r="40" fill="#13223D"/><text x="90" y="152" font-size="34" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text></g><text x="90" y="206" font-size="14" fill="#13223D" text-anchor="middle" font-weight="bold">Module 1</text></g><g class="a pop" style="animation-delay:0.35s" ><g><circle cx="214" cy="140" r="40" fill="#1E3A5F"/><text x="214" y="152" font-size="34" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text></g><text x="214" y="206" font-size="14" fill="#13223D" text-anchor="middle" font-weight="bold">Module 2</text></g><g class="a pop" style="animation-delay:0.50s" ><g><circle cx="338" cy="140" r="40" fill="#2E7D32"/><text x="338" y="152" font-size="34" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text></g><text x="338" y="206" font-size="14" fill="#13223D" text-anchor="middle" font-weight="bold">Module 3</text></g><g class="a pop" style="animation-delay:0.65s" ><g><circle cx="462" cy="140" r="40" fill="#F2A900"/><text x="462" y="152" font-size="34" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text></g><text x="462" y="206" font-size="14" fill="#13223D" text-anchor="middle" font-weight="bold">Module 4</text></g><g class="a pop" style="animation-delay:0.80s" ><g><circle cx="586" cy="140" r="40" fill="#C8102E"/><text x="586" y="152" font-size="34" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text></g><text x="586" y="206" font-size="14" fill="#13223D" text-anchor="middle" font-weight="bold">Module 5</text></g><g class="a pop" style="animation-delay:0.95s" ><g><circle cx="710" cy="140" r="40" fill="#3C4A5E"/><text x="710" y="152" font-size="34" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text></g><text x="710" y="206" font-size="14" fill="#13223D" text-anchor="middle" font-weight="bold">Module 6</text></g><g class="a fade" style="animation-delay:1.20s" ><text x="400" y="280" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Final assessment: 15 questions, 80% to pass</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Final assessment</text></svg>