<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Perception, Identification, Emotion and Volition make up reaction time: 1.5, 2.0 and 2.5 seconds"><title>Perception, Identification, Emotion and Volition make up reaction time: 1.5, 2.0 and 2.5 seconds</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><g class="a pop" style="animation-delay:0.20s" ><g><circle cx="110" cy="120" r="42" fill="#13223D"/><text x="110" y="135" font-size="40" fill="#F2A900" text-anchor="middle" font-weight="bold">P</text></g><text x="110" y="190" font-size="17" fill="#13223D" text-anchor="middle" font-weight="bold">Perception</text><text x="110" y="212" font-size="13" fill="#3C4A5E" text-anchor="middle" font-weight="bold">sees something</text></g><g class="a fade" style="animation-delay:0.30s" ><line x1="160" y1="120" x2="220.0" y2="120.0" stroke="#3C4A5E" stroke-width="4" stroke-linecap="round"/><path d="M238,120 L220.0,132.0 L220.0,108.0Z" fill="#3C4A5E"/></g><g class="a pop" style="animation-delay:0.40s" ><g><circle cx="290" cy="120" r="42" fill="#1E3A5F"/><text x="290" y="135" font-size="40" fill="#F2A900" text-anchor="middle" font-weight="bold">I</text></g><text x="290" y="190" font-size="17" fill="#13223D" text-anchor="middle" font-weight="bold">Identification</text><text x="290" y="212" font-size="13" fill="#3C4A5E" text-anchor="middle" font-weight="bold">works out what it is</text></g><g class="a fade" style="animation-delay:0.50s" ><line x1="340" y1="120" x2="400.0" y2="120.0" stroke="#3C4A5E" stroke-width="4" stroke-linecap="round"/><path d="M418,120 L400.0,132.0 L400.0,108.0Z" fill="#3C4A5E"/></g><g class="a pop" style="animation-delay:0.60s" ><g><circle cx="470" cy="120" r="42" fill="#13223D"/><text x="470" y="135" font-size="40" fill="#F2A900" text-anchor="middle" font-weight="bold">E</text></g><text x="470" y="190" font-size="17" fill="#13223D" text-anchor="middle" font-weight="bold">Emotion</text><text x="470" y="212" font-size="13" fill="#3C4A5E" text-anchor="middle" font-weight="bold">how they feel about it</text></g><g class="a fade" style="animation-delay:0.70s" ><line x1="520" y1="120" x2="580.0" y2="120.0" stroke="#3C4A5E" stroke-width="4" stroke-linecap="round"/><path d="M598,120 L580.0,132.0 L580.0,108.0Z" fill="#3C4A5E"/></g><g class="a pop" style="animation-delay:0.80s" ><g><circle cx="650" cy="120" r="42" fill="#1E3A5F"/><text x="650" y="135" font-size="40" fill="#F2A900" text-anchor="middle" font-weight="bold">V</text></g><text x="650" y="190" font-size="17" fill="#13223D" text-anchor="middle" font-weight="bold">Volition</text><text x="650" y="212" font-size="13" fill="#3C4A5E" text-anchor="middle" font-weight="bold">decides to act</text></g><g class="a up" style="animation-delay:1.10s" ><rect x="50" y="248" width="200" height="70" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><text x="150" y="276" font-size="16" fill="#3C4A5E" text-anchor="middle" font-weight="bold">30-50 km/h</text><text x="150" y="306" font-size="24" fill="#C8102E" text-anchor="middle" font-weight="bold">1.5 s</text></g><g class="a up" style="animation-delay:1.25s" ><rect x="300" y="248" width="200" height="70" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><text x="400" y="276" font-size="16" fill="#3C4A5E" text-anchor="middle" font-weight="bold">60-80 km/h</text><text x="400" y="306" font-size="24" fill="#C8102E" text-anchor="middle" font-weight="bold">2.0 s</text></g><g class="a up" style="animation-delay:1.40s" ><rect x="550" y="248" width="200" height="70" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><text x="650" y="276" font-size="16" fill="#3C4A5E" text-anchor="middle" font-weight="bold">90-110 km/h</text><text x="650" y="306" font-size="24" fill="#C8102E" text-anchor="middle" font-weight="bold">2.5 s</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Reaction time (PIEV)</text></svg>