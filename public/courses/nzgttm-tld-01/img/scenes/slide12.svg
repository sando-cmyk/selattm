<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A drifting car crosses into the lateral exclusion zone between the cones and the work area"><title>A drifting car crosses into the lateral exclusion zone between the cones and the work area</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#DCEBCF'/><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFE7A8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#F2A900" stroke-width="6"/></pattern></defs><rect x="0" y="150" width="800" height="96" fill="#5B6270"/><line x1="0" y1="153" x2="800" y2="153" stroke="#fff" stroke-width="3"/><line x1="0" y1="243" x2="800" y2="243" stroke="#fff" stroke-width="3"/><line x1="0" y1="198" x2="800" y2="198" stroke="#fff" stroke-width="3" stroke-dasharray="24 20"/><g class="a fade" style="animation-delay:0.10s" ><rect x="0" y="260" width="800" height="60" fill="url(#hatch)" stroke="#F2A900" stroke-width="2"/><rect x="350.0" y="279.0" width="100" height="22" rx="4" fill="#fff" opacity=".9"/><text x="400.0" y="295.0" font-size="13" fill="#13223D" text-anchor="middle" font-weight="bold">WORK AREA</text></g><rect x="0" y="246" width="800" height="14" fill="#5B6270"/><g class="a fade" style="animation-delay:0.30s" ><rect x="0" y="222" width="800" height="38" fill="#C8102E" opacity=".18" stroke="#C8102E" stroke-dasharray="6 4" stroke-width="2"/></g><g class="a pop" style="animation-delay:0.40s" ><circle cx="20.0" cy="222.0" r="6" fill="#F26B1D"/><circle cx="20.0" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.43s" ><circle cx="78.46153846153845" cy="222.0" r="6" fill="#F26B1D"/><circle cx="78.46153846153845" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.46s" ><circle cx="136.9230769230769" cy="222.0" r="6" fill="#F26B1D"/><circle cx="136.9230769230769" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.49s" ><circle cx="195.3846153846154" cy="222.0" r="6" fill="#F26B1D"/><circle cx="195.3846153846154" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.52s" ><circle cx="253.84615384615384" cy="222.0" r="6" fill="#F26B1D"/><circle cx="253.84615384615384" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.55s" ><circle cx="312.3076923076923" cy="222.0" r="6" fill="#F26B1D"/><circle cx="312.3076923076923" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.58s" ><circle cx="370.7692307692308" cy="222.0" r="6" fill="#F26B1D"/><circle cx="370.7692307692308" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.61s" ><circle cx="429.2307692307692" cy="222.0" r="6" fill="#F26B1D"/><circle cx="429.2307692307692" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.64s" ><circle cx="487.6923076923077" cy="222.0" r="6" fill="#F26B1D"/><circle cx="487.6923076923077" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.67s" ><circle cx="546.1538461538462" cy="222.0" r="6" fill="#F26B1D"/><circle cx="546.1538461538462" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.70s" ><circle cx="604.6153846153846" cy="222.0" r="6" fill="#F26B1D"/><circle cx="604.6153846153846" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.73s" ><circle cx="663.0769230769231" cy="222.0" r="6" fill="#F26B1D"/><circle cx="663.0769230769231" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.76s" ><circle cx="721.5384615384615" cy="222.0" r="6" fill="#F26B1D"/><circle cx="721.5384615384615" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.79s" ><circle cx="780.0" cy="222.0" r="6" fill="#F26B1D"/><circle cx="780.0" cy="222.0" r="2.4000000000000004" fill="#fff"/></g><g class="a drive" style="animation-delay:0.70s;animation-duration:1.4s" ><g transform="rotate(8 360 196)"><g><rect x="337.0" y="185.0" width="46" height="22" rx="6" fill="#1E3A5F"/><rect x="361.0" y="188.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g></g><g class="a fade" style="animation-delay:1.60s" ><line x1="390" y1="206" x2="502.5" y2="232.0" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/><path d="M520,236 L499.8,243.6 L505.2,220.3Z" fill="#C8102E"/></g><g class="a fade" style="animation-delay:1.20s" ><rect x="560" y="80" width="225" height="54" rx="6" fill="#fff" opacity=".95"/><text x="672" y="104" font-size="16" fill="#C8102E" text-anchor="middle" font-weight="bold">0.9 m / 1.2 m / 1.5 m</text><text x="672" y="125" font-size="13" fill="#3C4A5E" text-anchor="middle" font-weight="bold">30-50 / 60-80 / 90-110 km/h</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Lateral exclusion zone</text><text x="776" y="30" font-size="15" fill="#F2A900" text-anchor="end" font-weight="bold">0.6 m/s drift × reaction time</text></svg>