<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="An empty exclusion zone between the end of the taper and the work area"><title>An empty exclusion zone between the end of the taper and the work area</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#DCEBCF'/><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFE7A8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#F2A900" stroke-width="6"/></pattern></defs><rect x="0" y="170" width="800" height="96" fill="#5B6270"/><line x1="0" y1="173" x2="800" y2="173" stroke="#fff" stroke-width="3"/><line x1="0" y1="263" x2="800" y2="263" stroke="#fff" stroke-width="3"/><line x1="0" y1="218" x2="800" y2="218" stroke="#fff" stroke-width="3" stroke-dasharray="24 20"/><g class="a fade" style="animation-delay:0.10s" ><rect x="560" y="172" width="230" height="44" fill="url(#hatch)" stroke="#F2A900" stroke-width="2"/><rect x="625.0" y="183.0" width="100" height="22" rx="4" fill="#fff" opacity=".9"/><text x="675.0" y="199.0" font-size="13" fill="#13223D" text-anchor="middle" font-weight="bold">WORK AREA</text></g><g class="a pop" style="animation-delay:0.20s" ><circle cx="300.0" cy="266.0" r="6" fill="#F26B1D"/><circle cx="300.0" cy="266.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.25s" ><circle cx="320.0" cy="258.3333333333333" r="6" fill="#F26B1D"/><circle cx="320.0" cy="258.3333333333333" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.30s" ><circle cx="340.0" cy="250.66666666666666" r="6" fill="#F26B1D"/><circle cx="340.0" cy="250.66666666666666" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.35s" ><circle cx="360.0" cy="243.0" r="6" fill="#F26B1D"/><circle cx="360.0" cy="243.0" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.40s" ><circle cx="380.0" cy="235.33333333333334" r="6" fill="#F26B1D"/><circle cx="380.0" cy="235.33333333333334" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.45s" ><circle cx="400.0" cy="227.66666666666666" r="6" fill="#F26B1D"/><circle cx="400.0" cy="227.66666666666666" r="2.4000000000000004" fill="#fff"/></g><g class="a pop" style="animation-delay:0.50s" ><circle cx="420.0" cy="220.0" r="6" fill="#F26B1D"/><circle cx="420.0" cy="220.0" r="2.4000000000000004" fill="#fff"/></g><g class="a fade" style="animation-delay:0.60s" ><rect x="420" y="172" width="140" height="44" fill="#C8102E" opacity=".18" stroke="#C8102E" stroke-dasharray="6 4" stroke-width="2"/><text x="490.0" y="199.0" font-size="13" fill="#C8102E" text-anchor="middle" font-weight="bold">keep clear</text></g><g class="a drive" style="animation-delay:0.40s;animation-duration:1.4s" ><g><rect x="177.0" y="183.0" width="46" height="22" rx="6" fill="#1E3A5F"/><rect x="201.0" y="186.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g><g class="a fade" style="animation-delay:0.00s" ></g><g class="a grow" style="animation-delay:1.00s" ><line x1="420" y1="112" x2="560" y2="112" stroke="#C8102E" stroke-width="2.5"/><line x1="420" y1="104" x2="420" y2="120" stroke="#C8102E" stroke-width="2.5"/><line x1="560" y1="104" x2="560" y2="120" stroke="#C8102E" stroke-width="2.5"/><path d="M420,112 l9,-5 v10z M560,112 l-9,-5 v10z" fill="#C8102E"/><rect x="289.125" y="89" width="401.75000000000006" height="21" rx="4" fill="#fff" opacity=".92"/><text x="490.0" y="104" font-size="15" fill="#C8102E" text-anchor="middle" font-weight="bold">longitudinal exclusion zone = stopping distance</text></g><g class="a fade" style="animation-delay:1.30s" ><text x="400" y="320" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Room for a driver who misses the taper to stop before the work area</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Longitudinal exclusion zone</text></svg>