<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Stopping on an unsealed surface takes much longer than on a sealed road"><title>Stopping on an unsealed surface takes much longer than on a sealed road</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#DCEBCF'/><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFE7A8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#F2A900" stroke-width="6"/></pattern></defs><rect x="220" y="100" width="580" height="68" fill="#5B6270"/><line x1="220" y1="103" x2="800" y2="103" stroke="#fff" stroke-width="3"/><line x1="220" y1="165" x2="800" y2="165" stroke="#fff" stroke-width="3"/><line x1="220" y1="134" x2="800" y2="134" stroke="#fff" stroke-width="3" stroke-dasharray="24 20"/><g class="a drive" style="animation-delay:0.20s" ><g><rect x="227.0" y="140.0" width="46" height="22" rx="6" fill="#1E3A5F"/><rect x="251.0" y="143.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g><g class="a grow" style="animation-delay:0.70s" ><rect x="280" y="140" width="381.1" height="22" rx="4" fill="#C8102E" opacity=".35"/></g><g class="a fade" style="animation-delay:0.50s" ><text x="20" y="140" font-size="15" fill="#13223D" text-anchor="start" font-weight="bold">Sealed, d = 0.36</text><text x="20" y="162" font-size="15" fill="#C8102E" text-anchor="start" font-weight="bold">80 km/h: about 103 m</text></g><rect x="220" y="210" width="580" height="68" fill="#5B6270"/><line x1="220" y1="213" x2="800" y2="213" stroke="#fff" stroke-width="3"/><line x1="220" y1="275" x2="800" y2="275" stroke="#fff" stroke-width="3"/><line x1="220" y1="244" x2="800" y2="244" stroke="#fff" stroke-width="3" stroke-dasharray="24 20"/><g class="a drive" style="animation-delay:0.50s" ><g><rect x="227.0" y="250.0" width="46" height="22" rx="6" fill="#F2A900"/><rect x="251.0" y="253.0" width="8" height="16" rx="2" fill="#BFD6EA"/></g></g><g class="a grow" style="animation-delay:1.00s" ><rect x="280" y="250" width="495.8" height="22" rx="4" fill="#C8102E" opacity=".35"/></g><g class="a fade" style="animation-delay:0.80s" ><text x="20" y="250" font-size="15" fill="#13223D" text-anchor="start" font-weight="bold">Unsealed, d = 0.25</text><text x="20" y="272" font-size="15" fill="#C8102E" text-anchor="start" font-weight="bold">80 km/h: about 134 m</text></g><g class="a fade" style="animation-delay:1.30s" ><text x="400" y="322" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Gravel, steel plates, oil, ice or lots of trucks: make it longer</text></g><rect x="0" y="0" width="800" height="46" fill="#13223D"/><text x="24" y="31" font-size="21" fill="#FFFFFF" text-anchor="start" font-weight="bold">Sealed or unsealed</text></svg>