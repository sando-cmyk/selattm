<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A risk register: hazards, ratings, controls and residual risk" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A risk register: hazards, ratings, controls and residual risk</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a fade" style="animation-delay:0.00s" ><rect x="120" y="40" width="146" height="44" rx="6" fill="#13223D"/><text x="193.0" y="70" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Hazard</text></g><g class="a fade" style="animation-delay:0.00s" ><rect x="270" y="40" width="116" height="44" rx="6" fill="#13223D"/><text x="328.0" y="70" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Rating</text></g><g class="a fade" style="animation-delay:0.00s" ><rect x="390" y="40" width="166" height="44" rx="6" fill="#13223D"/><text x="473.0" y="70" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Control</text></g><g class="a fade" style="animation-delay:0.00s" ><rect x="560" y="40" width="116" height="44" rx="6" fill="#13223D"/><text x="618.0" y="70" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Residual</text></g><g class="a left" style="animation-delay:0.30s" ><rect x="120" y="92" width="556" height="48" rx="6" fill="#fff" stroke="#E5E2DA"/><text x="132" y="123" font-size="19" fill="#13223D" text-anchor="start" font-weight="bold">Footpath</text><rect x="295" y="102" width="60" height="28" rx="14" fill="#C8102E"/><text x="325" y="123" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">20</text><text x="402" y="123" font-size="19" fill="#13223D" text-anchor="start" font-weight="bold">Temp path</text><rect x="585" y="102" width="60" height="28" rx="14" fill="#F2A900"/><text x="615" y="123" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">6</text></g><g class="a left" style="animation-delay:0.60s" ><rect x="120" y="148" width="556" height="48" rx="6" fill="#fff" stroke="#E5E2DA"/><text x="132" y="179" font-size="19" fill="#13223D" text-anchor="start" font-weight="bold">Bus stop</text><rect x="295" y="158" width="60" height="28" rx="14" fill="#F26B1D"/><text x="325" y="179" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">15</text><text x="402" y="179" font-size="19" fill="#13223D" text-anchor="start" font-weight="bold">Relocate</text><rect x="585" y="158" width="60" height="28" rx="14" fill="#F2A900"/><text x="615" y="179" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">6</text></g><g class="a left" style="animation-delay:0.90s" ><rect x="120" y="204" width="556" height="48" rx="6" fill="#fff" stroke="#E5E2DA"/><text x="132" y="235" font-size="19" fill="#13223D" text-anchor="start" font-weight="bold">Sun glare</text><rect x="295" y="214" width="60" height="28" rx="14" fill="#F26B1D"/><text x="325" y="235" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">15</text><text x="402" y="235" font-size="19" fill="#13223D" text-anchor="start" font-weight="bold">Timing</text><rect x="585" y="214" width="60" height="28" rx="14" fill="#2E7D32"/><text x="615" y="235" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text></g><g class="a left" style="animation-delay:1.20s" ><rect x="120" y="260" width="556" height="48" rx="6" fill="#fff" stroke="#E5E2DA"/><text x="132" y="291" font-size="19" fill="#13223D" text-anchor="start" font-weight="bold">Van access</text><rect x="295" y="270" width="60" height="28" rx="14" fill="#F2A900"/><text x="325" y="291" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">9</text><text x="402" y="291" font-size="19" fill="#13223D" text-anchor="start" font-weight="bold">Verge park</text><rect x="585" y="270" width="60" height="28" rx="14" fill="#2E7D32"/><text x="615" y="291" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text></g></svg>