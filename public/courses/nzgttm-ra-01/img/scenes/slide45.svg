<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Swiss cheese model: six layers of quality, assurance and control" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Swiss cheese model: six layers of quality, assurance and control</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a right" style="animation-delay:0.20s" ><g transform="translate(120,40) skewY(-12)"><rect x="0" y="0" width="150" height="250" rx="10" fill="#F7C948" stroke="#D9A520" stroke-width="3"/><circle cx="40" cy="50" r="16" fill="#E0AE2E"/><circle cx="120" cy="120" r="16" fill="#E0AE2E"/><circle cx="70" cy="190" r="16" fill="#E0AE2E"/></g><text x="195" y="322" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">1</text></g><g class="a right" style="animation-delay:0.45s" ><g transform="translate(215,40) skewY(-12)"><rect x="0" y="0" width="150" height="250" rx="10" fill="#F7C948" stroke="#D9A520" stroke-width="3"/><circle cx="90" cy="70" r="16" fill="#E0AE2E"/><circle cx="40" cy="160" r="16" fill="#E0AE2E"/><circle cx="120" cy="210" r="16" fill="#E0AE2E"/></g><text x="290" y="322" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">2</text></g><g class="a right" style="animation-delay:0.70s" ><g transform="translate(310,40) skewY(-12)"><rect x="0" y="0" width="150" height="250" rx="10" fill="#F7C948" stroke="#D9A520" stroke-width="3"/><circle cx="60" cy="100" r="16" fill="#E0AE2E"/><circle cx="120" cy="60" r="16" fill="#E0AE2E"/><circle cx="90" cy="200" r="16" fill="#E0AE2E"/></g><text x="385" y="322" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">3</text></g><g class="a right" style="animation-delay:0.95s" ><g transform="translate(405,40) skewY(-12)"><rect x="0" y="0" width="150" height="250" rx="10" fill="#F7C948" stroke="#D9A520" stroke-width="3"/><circle cx="40" cy="60" r="16" fill="#E0AE2E"/><circle cx="110" cy="140" r="16" fill="#E0AE2E"/><circle cx="60" cy="210" r="16" fill="#E0AE2E"/></g><text x="480" y="322" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">4</text></g><g class="a right" style="animation-delay:1.20s" ><g transform="translate(500,40) skewY(-12)"><rect x="0" y="0" width="150" height="250" rx="10" fill="#F7C948" stroke="#D9A520" stroke-width="3"/><circle cx="100" cy="90" r="16" fill="#E0AE2E"/><circle cx="50" cy="150" r="16" fill="#E0AE2E"/><circle cx="110" cy="220" r="16" fill="#E0AE2E"/></g><text x="575" y="322" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">5</text></g><g class="a right" style="animation-delay:1.45s" ><g transform="translate(595,40) skewY(-12)"><rect x="0" y="0" width="150" height="250" rx="10" fill="#F7C948" stroke="#D9A520" stroke-width="3"/><circle cx="70" cy="60" r="16" fill="#E0AE2E"/><circle cx="40" cy="200" r="16" fill="#E0AE2E"/><circle cx="120" cy="130" r="16" fill="#E0AE2E"/></g><text x="670" y="322" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">6</text></g><g class="a fade" style="animation-delay:1.90s" ><path class="a draw" pathLength="900" style="animation-delay:2.0s" d="M40,170 L180,150" stroke="#C8102E" stroke-width="6" stroke-dasharray="900" stroke-linecap="round"/></g><g class="a pop" style="animation-delay:2.80s" ><polygon points="224.0,148.0 212.2,153.1 217.0,165.0 205.1,160.2 200.0,172.0 194.9,160.2 183.0,165.0 187.8,153.1 176.0,148.0 187.8,142.9 183.0,131.0 194.9,135.8 200.0,124.0 205.1,135.8 217.0,131.0 212.2,142.9" fill="#C8102E"/></g><g class="a fade" style="animation-delay:3.00s" ><text x="24" y="216" font-size="18" fill="#C8102E" text-anchor="start" font-weight="bold">Hazard</text><text x="24" y="238" font-size="18" fill="#13223D" text-anchor="start" font-weight="bold">stopped</text></g></svg>