<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A stop/go queue about 89 metres long; advance warning must sit beyond it" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A stop/go queue about 89 metres long; advance warning must sit beyond it</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><rect x="0" y="160" width="800" height="180" fill="#CFE3C4"/><rect x="0" y="180" width="800" height="90" fill="#5B6270"/><line x1="0" y1="184" x2="800" y2="184" stroke="#fff" stroke-width="3"/><line x1="0" y1="266" x2="800" y2="266" stroke="#fff" stroke-width="3"/><line x1="0" y1="225.0" x2="800" y2="225.0" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/><g transform="translate(720,170)"><rect x="-4" y="-60" width="8" height="60" fill="#555"/><circle cx="0" cy="-74" r="22" fill="#C8102E"/><text x="0" y="-67" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">STOP</text></g><g class="a right" style="animation-delay:0.20s" ><g transform="translate(650,262) scale(0.62,0.62)"><rect x="-50" y="-34" width="100" height="24" rx="8" fill="#4A6A8F"/><path d="M-30,-34 L-18,-54 L18,-54 L32,-34Z" fill="#4A6A8F"/><path d="M-22,-36 L-14,-50 L0,-50 L0,-36Z M4,-36 L4,-50 L16,-50 L26,-36Z" fill="#BFD6EA"/><circle cx="-28" cy="-10" r="11" fill="#222"/><circle cx="28" cy="-10" r="11" fill="#222"/><rect x="42" y="-30" width="8" height="6" fill="#F2A900"/></g></g><g class="a right" style="animation-delay:0.38s" ><g transform="translate(568,262) scale(0.62,0.62)"><rect x="-50" y="-34" width="100" height="24" rx="8" fill="#1E3A5F"/><path d="M-30,-34 L-18,-54 L18,-54 L32,-34Z" fill="#1E3A5F"/><path d="M-22,-36 L-14,-50 L0,-50 L0,-36Z M4,-36 L4,-50 L16,-50 L26,-36Z" fill="#BFD6EA"/><circle cx="-28" cy="-10" r="11" fill="#222"/><circle cx="28" cy="-10" r="11" fill="#222"/><rect x="42" y="-30" width="8" height="6" fill="#F2A900"/></g></g><g class="a right" style="animation-delay:0.56s" ><g transform="translate(486,262) scale(0.62,0.62)"><rect x="-50" y="-34" width="100" height="24" rx="8" fill="#4A6A8F"/><path d="M-30,-34 L-18,-54 L18,-54 L32,-34Z" fill="#4A6A8F"/><path d="M-22,-36 L-14,-50 L0,-50 L0,-36Z M4,-36 L4,-50 L16,-50 L26,-36Z" fill="#BFD6EA"/><circle cx="-28" cy="-10" r="11" fill="#222"/><circle cx="28" cy="-10" r="11" fill="#222"/><rect x="42" y="-30" width="8" height="6" fill="#F2A900"/></g></g><g class="a right" style="animation-delay:0.74s" ><g transform="translate(404,262) scale(0.62,0.62)"><rect x="-50" y="-34" width="100" height="24" rx="8" fill="#1E3A5F"/><path d="M-30,-34 L-18,-54 L18,-54 L32,-34Z" fill="#1E3A5F"/><path d="M-22,-36 L-14,-50 L0,-50 L0,-36Z M4,-36 L4,-50 L16,-50 L26,-36Z" fill="#BFD6EA"/><circle cx="-28" cy="-10" r="11" fill="#222"/><circle cx="28" cy="-10" r="11" fill="#222"/><rect x="42" y="-30" width="8" height="6" fill="#F2A900"/></g></g><g class="a right" style="animation-delay:0.92s" ><g transform="translate(322,262) scale(0.62,0.62)"><rect x="-50" y="-34" width="100" height="24" rx="8" fill="#4A6A8F"/><path d="M-30,-34 L-18,-54 L18,-54 L32,-34Z" fill="#4A6A8F"/><path d="M-22,-36 L-14,-50 L0,-50 L0,-36Z M4,-36 L4,-50 L16,-50 L26,-36Z" fill="#BFD6EA"/><circle cx="-28" cy="-10" r="11" fill="#222"/><circle cx="28" cy="-10" r="11" fill="#222"/><rect x="42" y="-30" width="8" height="6" fill="#F2A900"/></g></g><g class="a right" style="animation-delay:1.10s" ><g transform="translate(240,262) scale(0.62,0.62)"><rect x="-50" y="-34" width="100" height="24" rx="8" fill="#1E3A5F"/><path d="M-30,-34 L-18,-54 L18,-54 L32,-34Z" fill="#1E3A5F"/><path d="M-22,-36 L-14,-50 L0,-50 L0,-36Z M4,-36 L4,-50 L16,-50 L26,-36Z" fill="#BFD6EA"/><circle cx="-28" cy="-10" r="11" fill="#222"/><circle cx="28" cy="-10" r="11" fill="#222"/><rect x="42" y="-30" width="8" height="6" fill="#F2A900"/></g></g><g class="a right" style="animation-delay:1.28s" ><g transform="translate(158,262) scale(0.62,0.62)"><rect x="-50" y="-34" width="100" height="24" rx="8" fill="#4A6A8F"/><path d="M-30,-34 L-18,-54 L18,-54 L32,-34Z" fill="#4A6A8F"/><path d="M-22,-36 L-14,-50 L0,-50 L0,-36Z M4,-36 L4,-50 L16,-50 L26,-36Z" fill="#BFD6EA"/><circle cx="-28" cy="-10" r="11" fill="#222"/><circle cx="28" cy="-10" r="11" fill="#222"/><rect x="42" y="-30" width="8" height="6" fill="#F2A900"/></g></g><g class="a fade" style="animation-delay:1.60s" ><line x1="104" y1="130" x2="690" y2="130" stroke="#13223D" stroke-width="3"/><path d="M104,122 v16 M690,122 v16" stroke="#13223D" stroke-width="3"/><rect x="330" y="108" width="140" height="40" rx="20" fill="#13223D"/><text x="400" y="136" font-size="24" fill="#F2A900" text-anchor="middle" font-weight="bold">≈ 89 m</text></g><g class="a pop" style="animation-delay:2.00s" ><g transform="translate(60,230) scale(0.7)"><rect x="-3" y="-10" width="6" height="70" fill="#888"/><rect x="-32" y="-74" width="64" height="64" transform="rotate(45 0 -42)" fill="#F26B1D" stroke="#222" stroke-width="4"/><text x="0" y="-28" font-size="38" font-weight="bold" text-anchor="middle" fill="#222" font-family="Arial">!</text></g></g><g class="a fade" style="animation-delay:2.20s" ><text x="20" y="92" font-size="18" fill="#C8102E" text-anchor="start" font-weight="bold">Warning sign</text><text x="20" y="112" font-size="18" fill="#C8102E" text-anchor="start" font-weight="bold">beyond the queue?</text></g></svg>