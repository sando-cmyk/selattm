<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Safety is the main focus among many risk types" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Safety is the main focus among many risk types</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a fade" style="animation-delay:0.30s" ><line x1="400" y1="170" x2="400" y2="50" stroke="#C9C4B8" stroke-width="3"/></g><g class="a pop" style="animation-delay:0.40s" ><rect x="337" y="30" width="126" height="40" rx="20" fill="#F2A900"/><text x="400" y="58" font-size="19" fill="#13223D" text-anchor="middle" font-weight="bold">Security</text></g><g class="a fade" style="animation-delay:0.42s" ><line x1="400" y1="170" x2="591" y2="85" stroke="#C9C4B8" stroke-width="3"/></g><g class="a pop" style="animation-delay:0.52s" ><rect x="540" y="65" width="102" height="40" rx="20" fill="#1E3A5F"/><text x="591" y="93" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Health</text></g><g class="a fade" style="animation-delay:0.54s" ><line x1="400" y1="170" x2="670" y2="170" stroke="#C9C4B8" stroke-width="3"/></g><g class="a pop" style="animation-delay:0.64s" ><rect x="577" y="150" width="186" height="40" rx="20" fill="#1E3A5F"/><text x="670" y="178" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Environmental</text></g><g class="a fade" style="animation-delay:0.66s" ><line x1="400" y1="170" x2="591" y2="255" stroke="#C9C4B8" stroke-width="3"/></g><g class="a pop" style="animation-delay:0.76s" ><rect x="546" y="235" width="90" height="40" rx="20" fill="#1E3A5F"/><text x="591" y="263" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Legal</text></g><g class="a fade" style="animation-delay:0.78s" ><line x1="400" y1="170" x2="400" y2="290" stroke="#C9C4B8" stroke-width="3"/></g><g class="a pop" style="animation-delay:0.88s" ><rect x="343" y="270" width="114" height="40" rx="20" fill="#1E3A5F"/><text x="400" y="298" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Quality</text></g><g class="a fade" style="animation-delay:0.90s" ><line x1="400" y1="170" x2="209" y2="255" stroke="#C9C4B8" stroke-width="3"/></g><g class="a pop" style="animation-delay:1.00s" ><rect x="146" y="235" width="126" height="40" rx="20" fill="#1E3A5F"/><text x="209" y="263" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Property</text></g><g class="a fade" style="animation-delay:1.02s" ><line x1="400" y1="170" x2="130" y2="170" stroke="#C9C4B8" stroke-width="3"/></g><g class="a pop" style="animation-delay:1.12s" ><rect x="55" y="150" width="150" height="40" rx="20" fill="#1E3A5F"/><text x="130" y="178" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Reputation</text></g><g class="a fade" style="animation-delay:1.14s" ><line x1="400" y1="170" x2="209" y2="85" stroke="#C9C4B8" stroke-width="3"/></g><g class="a pop" style="animation-delay:1.24s" ><rect x="140" y="65" width="138" height="40" rx="20" fill="#1E3A5F"/><text x="209" y="93" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Financial</text></g><g class="a pop" style="animation-delay:0.00s" ><g><circle cx="400" cy="170" r="78" fill="#C8102E"/><text x="400" y="180" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="bold">SAFETY</text></g></g></svg>