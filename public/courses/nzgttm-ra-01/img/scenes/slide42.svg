<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="STMS monitoring by driving, walking and cycling through the site" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>STMS monitoring by driving, walking and cycling through the site</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><rect x="0" y="170" width="800" height="170" fill="#CFE3C4"/><rect x="0" y="200" width="800" height="90" fill="#5B6270"/><line x1="0" y1="204" x2="800" y2="204" stroke="#fff" stroke-width="3"/><line x1="0" y1="286" x2="800" y2="286" stroke="#fff" stroke-width="3"/><line x1="0" y1="245.0" x2="800" y2="245.0" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/><g transform="translate(300,246) scale(0.65)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(360,246) scale(0.65)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(420,246) scale(0.65)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(480,246) scale(0.65)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(540,246) scale(0.65)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(640,240) scale(0.75)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><g transform="translate(640,240) scale(0.75)"><rect x="-14" y="-52" width="28" height="4" fill="#fff"/><path d="M-13,-90 Q0,-104 13,-90Z" fill="#F2A900"/></g><g class="a drive" style="animation-delay:0.30s;animation-duration:2.2s" ><g transform="translate(200,290) scale(0.7,0.7)"><rect x="-50" y="-34" width="100" height="24" rx="8" fill="#1E3A5F"/><path d="M-30,-34 L-18,-54 L18,-54 L32,-34Z" fill="#1E3A5F"/><path d="M-22,-36 L-14,-50 L0,-50 L0,-36Z M4,-36 L4,-50 L16,-50 L26,-36Z" fill="#BFD6EA"/><circle cx="-28" cy="-10" r="11" fill="#222"/><circle cx="28" cy="-10" r="11" fill="#222"/><rect x="42" y="-30" width="8" height="6" fill="#F2A900"/></g></g><g class="a pop" style="animation-delay:0.50s" ><g><circle cx="120" cy="70" r="30" fill="#1E3A5F"/></g><text x="120" y="78" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="164" y="78" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Drive</text></g><g class="a pop" style="animation-delay:0.80s" ><g><circle cx="300" cy="70" r="30" fill="#F2A900"/></g><text x="300" y="78" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="344" y="78" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Walk</text></g><g class="a pop" style="animation-delay:1.10s" ><g><circle cx="480" cy="70" r="30" fill="#1E3A5F"/></g><text x="480" y="78" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="524" y="78" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Cycle</text></g><g class="a pop" style="animation-delay:1.70s" ><g transform="translate(700,70)"><g><circle cx="0" cy="0" r="26" fill="#2E7D32"/><path d="M-11.700000000000001,0 l7.8,8.32 l14.3,-15.6" stroke="#fff" stroke-width="5.72" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="700" y="128" font-size="18" fill="#2E7D32" text-anchor="middle" font-weight="bold">Every shift</text></g></svg>