<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="When the site changes: call the planner, update the TMP, record every change" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>When the site changes: call the planner, update the TMP, record every change</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a up" style="animation-delay:0.10s" ><g transform="translate(130,250) scale(1.1)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="130" y="280" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">STMS</text></g><g class="a pop" style="animation-delay:0.40s" ><g transform="translate(130,90)"><rect x="-26" y="-40" width="52" height="80" rx="8" fill="#13223D"/><rect x="-20" y="-32" width="40" height="56" rx="3" fill="#BFD6EA"/></g></g><g class="a fade" style="animation-delay:0.70s" ><line x1="180" y1="110" x2="312.0" y2="110.0" stroke="#F2A900" stroke-width="6" stroke-linecap="round"/><path d="M330,110 L312.0,122.0 L312.0,98.0Z" fill="#F2A900"/><text x="255" y="92" font-size="18" fill="#3C4A5E" text-anchor="middle" font-weight="bold">Call</text></g><g class="a up" style="animation-delay:0.90s" ><g transform="translate(380,250) scale(1.0)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#1E3A5F"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="380" y="280" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Planner</text></g><g class="a pop" style="animation-delay:1.30s" ><g transform="translate(560,160) scale(1.1)"><rect x="-36" y="-48" width="72" height="96" rx="6" fill="#FFFFFF" stroke="#13223D" stroke-width="3"/><rect x="-24" y="-32" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="-16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="0" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="16" width="36" height="6" rx="3" fill="#B8C2CF"/></g><path d="M530,140 l50,40" stroke="#C8102E" stroke-width="5"/><text x="600" y="120" font-size="22" font-weight="bold" fill="#C8102E" font-family="Arial">edit</text></g><g class="a pop" style="animation-delay:1.80s" ><rect x="460" y="270" width="250" height="40" rx="20" fill="#2E7D32"/><text x="585" y="297" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Record every change</text></g></svg>