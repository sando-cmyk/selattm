<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="No mandatory national matrix: use your company's own method" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>No mandatory national matrix: use your company's own method</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a up" style="animation-delay:0.20s" ><rect x="40" y="60" width="230" height="230" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><rect x="105" y="110" width="20" height="20" fill="#F26B1D"/><rect x="127" y="110" width="20" height="20" fill="#F26B1D"/><rect x="149" y="110" width="20" height="20" fill="#C8102E"/><rect x="171" y="110" width="20" height="20" fill="#C8102E"/><rect x="105" y="132" width="20" height="20" fill="#F2A900"/><rect x="127" y="132" width="20" height="20" fill="#F26B1D"/><rect x="149" y="132" width="20" height="20" fill="#F26B1D"/><rect x="171" y="132" width="20" height="20" fill="#C8102E"/><rect x="105" y="154" width="20" height="20" fill="#F2A900"/><rect x="127" y="154" width="20" height="20" fill="#F2A900"/><rect x="149" y="154" width="20" height="20" fill="#F26B1D"/><rect x="171" y="154" width="20" height="20" fill="#F26B1D"/><rect x="105" y="176" width="20" height="20" fill="#2E7D32"/><rect x="127" y="176" width="20" height="20" fill="#F2A900"/><rect x="149" y="176" width="20" height="20" fill="#F2A900"/><rect x="171" y="176" width="20" height="20" fill="#F26B1D"/><text x="155" y="262" font-size="21" fill="#13223D" text-anchor="middle" font-weight="bold">Risk matrix</text></g><g class="a up" style="animation-delay:0.50s" ><rect x="300" y="60" width="230" height="230" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><g transform="translate(400,150) scale(0.9)"><rect x="-36" y="-48" width="72" height="96" rx="6" fill="#FFFFFF" stroke="#13223D" stroke-width="3"/><rect x="-24" y="-32" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="-16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="0" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="16" width="36" height="6" rx="3" fill="#B8C2CF"/></g><rect x="364" y="102" width="72" height="18" fill="#1E3A5F"/><text x="415" y="262" font-size="19" fill="#13223D" text-anchor="middle" font-weight="bold">Austroads AGTTM Pt 10</text></g><g class="a up" style="animation-delay:0.80s" ><rect x="560" y="60" width="230" height="230" rx="14" fill="#FFF6E0" stroke="#F2A900" stroke-width="2"/><g transform="translate(660,150) scale(0.9)"><rect x="-36" y="-48" width="72" height="96" rx="6" fill="#FFF6E0" stroke="#13223D" stroke-width="3"/><rect x="-24" y="-32" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="-16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="0" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="16" width="36" height="6" rx="3" fill="#B8C2CF"/></g><text x="675" y="262" font-size="21" fill="#13223D" text-anchor="middle" font-weight="bold">Company method</text></g><g class="a pop" style="animation-delay:1.40s" ><g transform="translate(730,78)"><g><circle cx="0" cy="0" r="26" fill="#2E7D32"/><path d="M-11.700000000000001,0 l7.8,8.32 l14.3,-15.6" stroke="#fff" stroke-width="5.72" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="a fade" style="animation-delay:1.00s" ><text x="400" y="38" font-size="24" fill="#3C4A5E" text-anchor="middle" font-weight="bold">Options, not a mandate</text></g></svg>