<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Footpath closure sends pedestrians across the road; a temporary path keeps them safe" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Footpath closure sends pedestrians across the road; a temporary path keeps them safe</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><rect width="800" height="340" fill="#CFE3C4"/><rect x="0" y="60" width="800" height="120" fill="#5B6270"/><line x1="0" y1="120" x2="800" y2="120" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/><rect x="0" y="200" width="800" height="40" fill="#C9C4B8"/><rect x="380" y="244" width="50" height="60" rx="4" fill="#888"/><text x="405" y="330" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Cabinet</text><rect x="330" y="196" width="150" height="48" fill="none" stroke="#C8102E" stroke-width="4" stroke-dasharray="10 6"/><g transform="translate(330,244) scale(0.6)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(480,244) scale(0.6)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g class="a fade" style="animation-delay:0.40s" ><path pathLength="900" class="a draw" style="animation-delay:.5s" d="M120,220 L280,220 L300,150 L300,90 L520,90 L520,150 L540,220 L700,220" fill="none" stroke="#C8102E" stroke-width="6" stroke-dasharray="900"/></g><g class="a fade" style="animation-delay:1.60s" ><text x="430" y="38" font-size="22" fill="#C8102E" text-anchor="start" font-weight="bold">Crossing the arterial?</text></g><g class="a pop" style="animation-delay:1.80s" ><g transform="translate(406,30)"><g><circle cx="0" cy="0" r="16" fill="#C8102E"/><path d="M-6.4,-6.4 L6.4,6.4 M6.4,-6.4 L-6.4,6.4" stroke="#fff" stroke-width="3.52" stroke-linecap="round"/></g></g></g><g class="a fade" style="animation-delay:2.40s" ><path d="M120,226 L300,226 Q330,190 405,184 Q480,190 510,226 L700,226" fill="none" stroke="#2E7D32" stroke-width="8"/></g><g class="a pop" style="animation-delay:2.60s" ><text x="640" y="270" font-size="20" fill="#2E7D32" text-anchor="middle" font-weight="bold">Temporary path</text><g transform="translate(640,300)"><g><circle cx="0" cy="0" r="16" fill="#2E7D32"/><path d="M-7.2,0 l4.8,5.12 l8.8,-9.6" stroke="#fff" stroke-width="3.52" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="a left" style="animation-delay:0.20s" ><g transform="translate(160,214) scale(0.5)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#C8102E"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g></g></svg>