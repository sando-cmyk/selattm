<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Planning effort grows from common to site-specific sites" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Planning effort grows from common to site-specific sites</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a grow" style="animation-delay:0.00s" ><rect x="80" y="280" width="640" height="10" rx="5" fill="#C9C4B8"/></g><g class="a growup" style="animation-delay:0.30s" ><g transform="translate(160,250)"><rect x="-44" y="-16" width="88" height="30" rx="4" fill="#fff" stroke="#13223D" stroke-width="2"/><rect x="-32" y="-6" width="52" height="5" fill="#B8C2CF"/></g></g><g class="a pop" style="animation-delay:0.20s" ><g><circle cx="160" cy="285" r="14" fill="#2E7D32"/></g><text x="160" y="330" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">Common</text></g><g class="a growup" style="animation-delay:0.70s" ><g transform="translate(400,250)"><rect x="-44" y="-16" width="88" height="30" rx="4" fill="#fff" stroke="#13223D" stroke-width="2"/><rect x="-32" y="-6" width="52" height="5" fill="#B8C2CF"/></g><g transform="translate(404,228)"><rect x="-44" y="-16" width="88" height="30" rx="4" fill="#fff" stroke="#13223D" stroke-width="2"/><rect x="-32" y="-6" width="52" height="5" fill="#B8C2CF"/></g><g transform="translate(408,206)"><rect x="-44" y="-16" width="88" height="30" rx="4" fill="#fff" stroke="#13223D" stroke-width="2"/><rect x="-32" y="-6" width="52" height="5" fill="#B8C2CF"/></g></g><g class="a pop" style="animation-delay:0.60s" ><g><circle cx="400" cy="285" r="14" fill="#F2A900"/></g><text x="400" y="330" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">In-between</text></g><g class="a growup" style="animation-delay:1.10s" ><g transform="translate(640,250)"><rect x="-44" y="-16" width="88" height="30" rx="4" fill="#fff" stroke="#13223D" stroke-width="2"/><rect x="-32" y="-6" width="52" height="5" fill="#B8C2CF"/></g><g transform="translate(644,228)"><rect x="-44" y="-16" width="88" height="30" rx="4" fill="#fff" stroke="#13223D" stroke-width="2"/><rect x="-32" y="-6" width="52" height="5" fill="#B8C2CF"/></g><g transform="translate(648,206)"><rect x="-44" y="-16" width="88" height="30" rx="4" fill="#fff" stroke="#13223D" stroke-width="2"/><rect x="-32" y="-6" width="52" height="5" fill="#B8C2CF"/></g><g transform="translate(652,184)"><rect x="-44" y="-16" width="88" height="30" rx="4" fill="#fff" stroke="#13223D" stroke-width="2"/><rect x="-32" y="-6" width="52" height="5" fill="#B8C2CF"/></g><g transform="translate(656,162)"><rect x="-44" y="-16" width="88" height="30" rx="4" fill="#fff" stroke="#13223D" stroke-width="2"/><rect x="-32" y="-6" width="52" height="5" fill="#B8C2CF"/></g><g transform="translate(660,140)"><rect x="-44" y="-16" width="88" height="30" rx="4" fill="#fff" stroke="#13223D" stroke-width="2"/><rect x="-32" y="-6" width="52" height="5" fill="#B8C2CF"/></g></g><g class="a pop" style="animation-delay:1.00s" ><g><circle cx="640" cy="285" r="14" fill="#C8102E"/></g><text x="640" y="330" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">Site-specific</text></g><g class="a fade" style="animation-delay:1.40s" ><text x="400" y="40" font-size="26" fill="#13223D" text-anchor="middle" font-weight="bold">More risk = more planning</text></g></svg>