<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Risk assessment group: crew, TTM staff and client, plus community and road users for complex sites" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Risk assessment group: crew, TTM staff and client, plus community and road users for complex sites</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a fade" style="animation-delay:0.00s" ><ellipse cx="400" cy="230" rx="230" ry="52" fill="#7A5230"/><ellipse cx="400" cy="222" rx="230" ry="52" fill="#A87A4F"/></g><g class="a up" style="animation-delay:0.20s" ><g transform="translate(260,200) scale(0.9)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="260" y="74" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">Crew</text></g><g class="a up" style="animation-delay:0.45s" ><g transform="translate(400,200) scale(0.9)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="400" y="74" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">TTM</text></g><g class="a up" style="animation-delay:0.70s" ><g transform="translate(540,200) scale(0.9)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#1E3A5F"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="540" y="74" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">Client</text></g><g class="a pop" style="animation-delay:1.30s" ><g transform="translate(140,220) scale(0.85)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#2E7D32"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="140" y="100" font-size="22" fill="#2E7D32" text-anchor="middle" font-weight="bold">Community</text></g><g class="a pop" style="animation-delay:1.60s" ><g transform="translate(660,220) scale(0.85)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#C8102E"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="660" y="100" font-size="22" fill="#C8102E" text-anchor="middle" font-weight="bold">Road users</text></g><g class="a fade" style="animation-delay:2.00s" ><rect x="215" y="292" width="370" height="36" rx="18" fill="#13223D"/><text x="400" y="318" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Complex sites: add more voices</text></g></svg>