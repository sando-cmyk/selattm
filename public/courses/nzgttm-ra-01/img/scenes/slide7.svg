<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="The five key TTM responsibilities" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The five key TTM responsibilities</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a pop" style="animation-delay:0.20s" ><g transform="translate(90,140)"><g><circle cx="0" cy="0" r="58" fill="#1E3A5F"/><g transform="translate(-14,26) scale(0.42)"><circle cx="0" cy="-78" r="12" fill="#FFFFFF"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#FFFFFF"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#FFFFFF"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#FFFFFF"/></g><g transform="translate(14,26) scale(0.42)"><circle cx="0" cy="-78" r="12" fill="#FFFFFF"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#FFFFFF"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#FFFFFF"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#FFFFFF"/></g></g></g><text x="90" y="250" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Everybody</text><text x="90" y="54" font-size="26" fill="#1E3A5F" text-anchor="middle" font-weight="bold">1</text></g><g class="a pop" style="animation-delay:0.45s" ><g transform="translate(245,140)"><g><circle cx="0" cy="0" r="58" fill="#2E7D32"/><path d="M0,-30 L26,-20 L26,4 Q26,26 0,36 Q-26,26 -26,4 L-26,-20Z" fill="#fff"/></g></g><text x="245" y="250" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Safety</text><text x="245" y="54" font-size="26" fill="#2E7D32" text-anchor="middle" font-weight="bold">2</text></g><g class="a pop" style="animation-delay:0.70s" ><g transform="translate(400,140)"><g><circle cx="0" cy="0" r="58" fill="#F2A900"/><path d="M0,-32 L32,26 L-32,26Z" fill="#fff"/><text x="0" y="20" font-size="38" fill="#F2A900" text-anchor="middle" font-weight="bold">!</text></g></g><text x="400" y="250" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Risk</text><text x="400" y="54" font-size="26" fill="#F2A900" text-anchor="middle" font-weight="bold">3</text></g><g class="a pop" style="animation-delay:0.95s" ><g transform="translate(555,140)"><g><circle cx="0" cy="0" r="58" fill="#C8102E"/><text x="0" y="16" font-size="52" fill="#FFFFFF" text-anchor="middle" font-weight="bold">?</text></g></g><text x="555" y="250" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Mistakes</text><text x="555" y="54" font-size="26" fill="#C8102E" text-anchor="middle" font-weight="bold">4</text></g><g class="a pop" style="animation-delay:1.20s" ><g transform="translate(710,140)"><g><circle cx="0" cy="0" r="58" fill="#13223D"/><path d="M0,28 C-40,0 -30,-34 0,-16 C30,-34 40,0 0,28Z" fill="#fff"/></g></g><text x="710" y="250" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Vulnerability</text><text x="710" y="54" font-size="26" fill="#13223D" text-anchor="middle" font-weight="bold">5</text></g></svg>