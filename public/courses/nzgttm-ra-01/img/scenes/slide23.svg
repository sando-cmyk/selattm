<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="The four activity risks placed on the teaching matrix" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The four activity risks placed on the teaching matrix</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a fade" style="animation-delay:0.00s" ><rect x="300" y="30" width="54" height="50" rx="5" fill="#FFF0B8"/><rect x="358" y="30" width="54" height="50" rx="5" fill="#FFC98A"/><rect x="416" y="30" width="54" height="50" rx="5" fill="#FFC98A"/><rect x="474" y="30" width="54" height="50" rx="5" fill="#F4A3A3"/><rect x="532" y="30" width="54" height="50" rx="5" fill="#F4A3A3"/><rect x="300" y="84" width="54" height="50" rx="5" fill="#DCEFD9"/><rect x="358" y="84" width="54" height="50" rx="5" fill="#FFF0B8"/><rect x="416" y="84" width="54" height="50" rx="5" fill="#FFC98A"/><rect x="474" y="84" width="54" height="50" rx="5" fill="#FFC98A"/><rect x="532" y="84" width="54" height="50" rx="5" fill="#F4A3A3"/><rect x="300" y="138" width="54" height="50" rx="5" fill="#DCEFD9"/><rect x="358" y="138" width="54" height="50" rx="5" fill="#FFF0B8"/><rect x="416" y="138" width="54" height="50" rx="5" fill="#FFF0B8"/><rect x="474" y="138" width="54" height="50" rx="5" fill="#FFC98A"/><rect x="532" y="138" width="54" height="50" rx="5" fill="#FFC98A"/><rect x="300" y="192" width="54" height="50" rx="5" fill="#DCEFD9"/><rect x="358" y="192" width="54" height="50" rx="5" fill="#DCEFD9"/><rect x="416" y="192" width="54" height="50" rx="5" fill="#FFF0B8"/><rect x="474" y="192" width="54" height="50" rx="5" fill="#FFF0B8"/><rect x="532" y="192" width="54" height="50" rx="5" fill="#FFC98A"/><rect x="300" y="246" width="54" height="50" rx="5" fill="#DCEFD9"/><rect x="358" y="246" width="54" height="50" rx="5" fill="#DCEFD9"/><rect x="416" y="246" width="54" height="50" rx="5" fill="#DCEFD9"/><rect x="474" y="246" width="54" height="50" rx="5" fill="#DCEFD9"/><rect x="532" y="246" width="54" height="50" rx="5" fill="#FFF0B8"/></g><g class="a drop" style="animation-delay:0.60s" ><g><circle cx="559" cy="109" r="14" fill="#C8102E" stroke="#fff" stroke-width="4"/><text x="559" y="114.88" font-size="16.8" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial">1</text></g></g><g class="a drop" style="animation-delay:0.95s" ><g><circle cx="544" cy="163" r="14" fill="#C8102E" stroke="#fff" stroke-width="4"/><text x="544" y="168.88" font-size="16.8" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial">2</text></g></g><g class="a drop" style="animation-delay:1.30s" ><g><circle cx="574" cy="163" r="14" fill="#C8102E" stroke="#fff" stroke-width="4"/><text x="574" y="168.88" font-size="16.8" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial">4</text></g></g><g class="a drop" style="animation-delay:1.65s" ><g><circle cx="443" cy="163" r="14" fill="#C8102E" stroke="#fff" stroke-width="4"/><text x="443" y="168.88" font-size="16.8" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial">3</text></g></g><g class="a left" style="animation-delay:0.60s" ><text x="40" y="90" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">1 Footpath</text></g><g class="a left" style="animation-delay:0.95s" ><text x="40" y="138" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">2 Bus stop</text></g><g class="a left" style="animation-delay:1.30s" ><text x="40" y="186" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">3 Van access</text></g><g class="a left" style="animation-delay:1.65s" ><text x="40" y="234" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">4 Sun</text></g><text x="445" y="320" font-size="18" fill="#3C4A5E" text-anchor="middle" font-weight="bold">Consequence →</text></svg>