<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Four emergency response phases from short term to recovery" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Four emergency response phases from short term to recovery</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a left" style="animation-delay:0.30s" ><path d="M40,150 h160 l20,40 l-20,40 h-160 l20,-40z" fill="#C8102E"/><text x="130" y="186" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Short</text><text x="130" y="212" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="normal">0–1 h</text></g><g class="a left" style="animation-delay:0.60s" ><path d="M225,150 h160 l20,40 l-20,40 h-160 l20,-40z" fill="#F26B1D"/><text x="315" y="186" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Medium</text><text x="315" y="212" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="normal">1–3 h</text></g><g class="a left" style="animation-delay:0.90s" ><path d="M410,150 h160 l20,40 l-20,40 h-160 l20,-40z" fill="#F2A900"/><text x="500" y="186" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">Long</text><text x="500" y="212" font-size="18" fill="#13223D" text-anchor="middle" font-weight="normal">3 h+</text></g><g class="a left" style="animation-delay:1.20s" ><path d="M595,150 h160 l20,40 l-20,40 h-160 l20,-40z" fill="#2E7D32"/><text x="685" y="186" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Recovery</text><text x="685" y="212" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="normal">→ normal</text></g><g class="a pop" style="animation-delay:0.00s" ><g transform="translate(400,70)"><rect x="-30" y="0" width="60" height="16" rx="4" fill="#333"/><path d="M-22,0 a22,22 0 0 1 44,0z" fill="#F2A900" class="pulse"/></g></g><g class="a fade" style="animation-delay:1.60s" ><text x="400" y="290" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Do the best you can with what you have</text></g></svg>