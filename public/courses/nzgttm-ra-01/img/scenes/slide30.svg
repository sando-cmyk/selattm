<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Practical design rules: short site, right time, quick set-up, fewer lanes, walk and cycle options, coordinate" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Practical design rules: short site, right time, quick set-up, fewer lanes, walk and cycle options, coordinate</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a pop" style="animation-delay:0.20s" ><g transform="translate(80,100)"><g><circle cx="0" cy="0" r="44" fill="#1E3A5F"/><rect x="-34" y="-8" width="68" height="16" fill="#fff"/><path d="M-24,-8v8M-12,-8v5M0,-8v8M12,-8v5M24,-8v8" stroke="#13223D" stroke-width="3"/></g></g><text x="140" y="108" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Short site</text></g><g class="a pop" style="animation-delay:0.40s" ><g transform="translate(335,100)"><g><circle cx="0" cy="0" r="44" fill="#13223D"/><circle r="28" fill="#fff"/><path d="M0,0 V-18 M0,0 L12,8" stroke="#13223D" stroke-width="5" stroke-linecap="round"/></g></g><text x="395" y="108" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Right time</text></g><g class="a pop" style="animation-delay:0.60s" ><g transform="translate(590,100)"><g><circle cx="0" cy="0" r="44" fill="#1E3A5F"/><path d="M-10,-30 L-24,4 H-2 L-12,30 L22,-8 H2 L12,-30Z" fill="#fff"/></g></g><text x="650" y="108" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Quick set-up</text></g><g class="a pop" style="animation-delay:0.80s" ><g transform="translate(80,240)"><g><circle cx="0" cy="0" r="44" fill="#13223D"/><rect x="-30" y="-26" width="18" height="52" fill="#fff"/><rect x="-6" y="-26" width="18" height="52" fill="#fff"/><rect x="18" y="-26" width="14" height="52" fill="#F26B1D"/></g></g><text x="140" y="248" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Fewer lanes</text></g><g class="a pop" style="animation-delay:1.00s" ><g transform="translate(335,240)"><g><circle cx="0" cy="0" r="44" fill="#1E3A5F"/><g transform="translate(-12,30) scale(0.42)"><circle cx="0" cy="-78" r="12" fill="#fff"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#fff"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#fff"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#fff"/></g><circle cx="16" cy="18" r="9" fill="none" stroke="#fff" stroke-width="3"/></g></g><text x="395" y="248" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Walk &amp; cycle</text></g><g class="a pop" style="animation-delay:1.20s" ><g transform="translate(590,240)"><g><circle cx="0" cy="0" r="44" fill="#13223D"/><rect x="-30" y="-20" width="24" height="24" rx="4" fill="#fff"/><rect x="6" y="-4" width="24" height="24" rx="4" fill="#fff"/><path d="M-6,-8 Q8,-20 14,-6" stroke="#fff" stroke-width="3" fill="none"/></g></g><text x="650" y="248" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Coordinate</text></g></svg>