<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Installing the site as designed; removal is often high risk because of fatigue" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Installing the site as designed; removal is often high risk because of fatigue</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><style>@keyframes install{0%{clip-path:inset(0 100% 0 0)}45%{clip-path:inset(0 0 0 0)}70%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}</style><rect x="0" y="170" width="800" height="170" fill="#CFE3C4"/><rect x="0" y="200" width="800" height="90" fill="#5B6270"/><line x1="0" y1="204" x2="800" y2="204" stroke="#fff" stroke-width="3"/><line x1="0" y1="286" x2="800" y2="286" stroke="#fff" stroke-width="3"/><line x1="0" y1="245.0" x2="800" y2="245.0" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/><g class="a drive" style="animation-delay:0.20s;animation-duration:1.4s" ><g transform="translate(170,262) scale(0.8)"><rect x="-104" y="-70" width="22" height="54" fill="#222"/><path d="M-104,-70 l22,-0 l0,7 l-22,7z" fill="#F2A900"/><path d="M-104,-56 l22,-0 l0,7 l-22,7z" fill="#F2A900"/><path d="M-104,-42 l22,-0 l0,7 l-22,7z" fill="#F2A900"/><path d="M-104,-28 l22,-0 l0,7 l-22,7z" fill="#F2A900"/><rect x="-76" y="-108" width="56" height="34" rx="3" fill="#222"/><path d="M-66,-91 h26 l-8,-8 M-40,-91 l-8,8" stroke="#F2A900" stroke-width="5" fill="none"/><rect x="-82" y="-74" width="110" height="62" rx="4" fill="#F2A900"/><rect x="28" y="-62" width="44" height="50" rx="6" fill="#F2A900"/><rect x="38" y="-56" width="26" height="18" rx="3" fill="#BFD6EA"/><circle cx="-56" cy="-10" r="13" fill="#222"/><circle cx="-24" cy="-10" r="13" fill="#222"/><circle cx="50" cy="-10" r="13" fill="#222"/></g></g><g class="a" style="animation:install 3.6s ease-in-out .4s both"><g transform="translate(260,246) scale(0.7)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(330,246) scale(0.7)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(400,246) scale(0.7)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(470,246) scale(0.7)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(540,246) scale(0.7)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(610,246) scale(0.7)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g></g><g class="a pop" style="animation-delay:1.50s" ><rect x="40" y="40" width="200" height="40" rx="20" fill="#2E7D32"/><text x="140" y="67" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Install as designed</text></g><g class="a pop" style="animation-delay:2.40s" ><rect x="530" y="40" width="230" height="40" rx="20" fill="#C8102E"/><text x="645" y="67" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Removal = high risk</text></g><g class="a fade" style="animation-delay:2.80s" ><circle cx="720" cy="130" r="22" fill="#F2A900"/><circle cx="730" cy="122" r="20" fill="#E3ECF5"/><text x="690" y="165" font-size="18" fill="#13223D" text-anchor="end" font-weight="bold">Fatigue</text></g></svg>