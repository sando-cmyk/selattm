<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Hierarchy of controls from eliminate (most effective) to PPE (least effective)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Hierarchy of controls from eliminate (most effective) to PPE (least effective)</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a drop" style="animation-delay:0.20s" ><rect x="170" y="40" width="600" height="56" rx="8" fill="#2E7D32"/><text x="470" y="77" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">ELIMINATE</text></g><g class="a drop" style="animation-delay:0.55s" ><rect x="210" y="106" width="520" height="56" rx="8" fill="#5B9A3C"/><text x="470" y="143" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">SUBSTITUTE / ISOLATE / ENGINEER</text></g><g class="a drop" style="animation-delay:0.90s" ><rect x="260" y="172" width="420" height="56" rx="8" fill="#F2A900"/><text x="470" y="209" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">ADMINISTRATIVE</text></g><g class="a drop" style="animation-delay:1.25s" ><rect x="320" y="238" width="300" height="56" rx="8" fill="#C8102E"/><text x="470" y="275" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">PPE</text></g><g class="a fade" style="animation-delay:1.70s" ><text x="40" y="64" font-size="20" fill="#2E7D32" text-anchor="start" font-weight="bold">Most</text><text x="40" y="88" font-size="20" fill="#2E7D32" text-anchor="start" font-weight="bold">effective</text><line x1="70" y1="110" x2="70.0" y2="232.0" stroke="#3C4A5E" stroke-width="4" stroke-linecap="round"/><path d="M70,250 L58.0,232.0 L82.0,232.0Z" fill="#3C4A5E"/><text x="40" y="280" font-size="20" fill="#C8102E" text-anchor="start" font-weight="bold">Least</text><text x="40" y="304" font-size="20" fill="#C8102E" text-anchor="start" font-weight="bold">effective</text></g></svg>