g><circle cx="0" cy="0" r="14" fill="#2E7D32"/><path d="M-6.3,0 l4.2,4.48 l7.700000000000001,-8.4" stroke="#fff" stroke-width="3.08" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="a left" style="animation-delay:1.10s" ><text x="100" y="270" font-size="20" fill="#13223D" text-anchor="start" font-weight="bold">Van access</text></g><g class="a grow" style="animation-delay:1.30s" ><rect x="300" y="254" width="200" height="10" rx="5" fill="#C9D1DC"/><rect x="300" y="272" width="140" height="10" rx="5" fill="#C9D1DC"/></g><g class="a grow" style="animation-delay:1.50s" ><rect x="540" y="254" width="150" height="10" rx="5" fill="#C9D1DC"/><rect x="540" y="272" width="110" height="10" rx="5" fill="#C9D1DC"/></g><g class="a pop" style="animation-delay:1.80s" ><g transform="translate(700,268)"><g><circle cx="0" cy="0" r="14" fill="#2E7D32"/><path d="M-6.3,0 l4.2,4.48 l7.700000000000001,-8.4" stroke="#fff" stroke-width="3.08" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg>