<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Five steps of a risk assessment, step 2 analyse highlighted" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Five steps of a risk assessment, step 2 analyse highlighted</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a fade" style="animation-delay:0.00s" ><path d="M60,250 C200,250 200,120 400,150 S640,60 740,90" fill="none" stroke="#C9C4B8" stroke-width="10" stroke-dasharray="4 14" stroke-linecap="round"/></g><g class="a pop" style="animation-delay:0.30s" ><g><circle cx="80" cy="250" r="34" fill="#13223D"/><text x="80" y="261" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text></g><text x="80" y="320" font-size="21" fill="#13223D" text-anchor="middle" font-weight="bold">Identify</text></g><g class="a pop" style="animation-delay:0.60s" ><g><circle cx="240" cy="190" r="34" fill="#F2A900"/><text x="240" y="201" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text></g><text x="240" y="260" font-size="21" fill="#13223D" text-anchor="middle" font-weight="bold">Analyse</text></g><g class="a pop" style="animation-delay:0.90s" ><g><circle cx="400" cy="150" r="34" fill="#13223D"/><text x="400" y="161" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text></g><text x="400" y="220" font-size="21" fill="#13223D" text-anchor="middle" font-weight="bold">Options</text></g><g class="a pop" style="animation-delay:1.20s" ><g><circle cx="560" cy="110" r="34" fill="#13223D"/><text x="560" y="121" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text></g><text x="560" y="180" font-size="21" fill="#13223D" text-anchor="middle" font-weight="bold">Lowest total risk</text></g><g class="a pop" style="animation-delay:1.50s" ><g><circle cx="720" cy="90" r="34" fill="#13223D"/><text x="720" y="101" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text></g><text x="720" y="160" font-size="21" fill="#13223D" text-anchor="middle" font-weight="bold">TMP</text></g><g class="a fade" style="animation-delay:2.00s" ><text x="240" y="120" font-size="18" fill="#F2A900" text-anchor="middle" font-weight="bold">This module</text></g></svg>