<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="The TMP and its audiences, with the STMS most important" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The TMP and its audiences, with the STMS most important</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a pop" style="animation-delay:0.00s" ><g transform="translate(400,170) scale(1.5)"><rect x="-36" y="-48" width="72" height="96" rx="6" fill="#FFFFFF" stroke="#13223D" stroke-width="3"/><rect x="-24" y="-32" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="-16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="0" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="16" width="36" height="6" rx="3" fill="#B8C2CF"/></g><rect x="352" y="96" width="96" height="30" rx="6" fill="#13223D"/><text x="400" y="118" font-size="22" fill="#F2A900" text-anchor="middle" font-weight="bold">TMP</text></g><g class="a fade" style="animation-delay:0.50s" ><line x1="340" y1="170" x2="215.6" y2="98.9" stroke="#F2A900" stroke-width="6" stroke-linecap="round"/><path d="M200,90 L221.6,88.5 L209.7,109.3Z" fill="#F2A900"/></g><g class="a pop" style="animation-delay:0.60s" ><g transform="translate(140,130) scale(1.0)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="140" y="160" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">STMS</text></g><g class="a fade" style="animation-delay:0.70s" ><line x1="340" y1="170" x2="215.1" y2="250.3" stroke="#9AA7B8" stroke-width="4" stroke-linecap="round"/><path d="M200,260 L208.7,240.2 L221.6,260.4Z" fill="#9AA7B8"/></g><g class="a pop" style="animation-delay:0.80s" ><g transform="translate(140,300) scale(0.8)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#1E3A5F"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="140" y="330" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Client</text></g><g class="a fade" style="animation-delay:0.90s" ><line x1="460" y1="170" x2="584.4" y2="98.9" stroke="#9AA7B8" stroke-width="4" stroke-linecap="round"/><path d="M600,90 L590.3,109.3 L578.4,88.5Z" fill="#9AA7B8"/></g><g class="a pop" style="animation-delay:1.00s" ><g transform="translate(660,130) scale(0.8)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#1E3A5F"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="660" y="160" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">TAO</text></g><g class="a fade" style="animation-delay:1.10s" ><line x1="460" y1="170" x2="584.9" y2="250.3" stroke="#9AA7B8" stroke-width="4" stroke-linecap="round"/><path d="M600,260 L578.4,260.4 L591.3,240.2Z" fill="#9AA7B8"/></g><g class="a pop" style="animation-delay:1.20s" ><g transform="translate(660,300) scale(0.8)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#1E3A5F"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="660" y="330" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Crew</text></g><g class="a pop" style="animation-delay:1.80s" ><rect x="300" y="290" width="200" height="38" rx="19" fill="#C8102E"/><text x="400" y="316" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Used in court</text></g></svg>