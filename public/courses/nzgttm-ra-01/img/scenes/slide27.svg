<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="SH6 culvert: a 360 km detour versus a closure with periodic openings" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>SH6 culvert: a 360 km detour versus a closure with periodic openings</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><rect width="800" height="340" fill="#DCE9D4"/><g class="a fade" style="animation-delay:0.10s" ><path d="M130,120 C170,80 230,70 260,96" fill="none" stroke="#13223D" stroke-width="8"/></g><g class="a fade" style="animation-delay:0.50s" ><path pathLength="900" class="a draw" style="animation-delay:.6s;animation-duration:2.4s" d="M130,120 C120,200 220,300 420,290 C600,280 720,220 700,140 C690,90 600,70 520,90 C420,110 330,130 260,96" fill="none" stroke="#C8102E" stroke-width="6" stroke-dasharray="900" stroke-linecap="round"/></g><g><circle cx="130" cy="120" r="12" fill="#13223D"/></g><text x="110" y="100" font-size="22" fill="#13223D" text-anchor="end" font-weight="bold">Nelson</text><g><circle cx="260" cy="96" r="12" fill="#13223D"/></g><text x="280" y="80" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Westport</text><g class="a pop" style="animation-delay:0.30s" ><g><circle cx="195" cy="86" r="16" fill="#C8102E" stroke="#fff" stroke-width="4"/><text x="195" y="92.72" font-size="19.2" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial">!</text></g><text x="195" y="52" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Culvert</text></g><g class="a pop" style="animation-delay:2.80s" ><rect x="460" y="120" width="220" height="44" rx="22" fill="#C8102E"/><text x="570" y="150" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">+360 km · +5 hrs</text></g><g class="a pop" style="animation-delay:3.30s" ><g transform="translate(330,200)"><circle cx="0" cy="0" r="40" fill="#fff" stroke="#13223D" stroke-width="5"/><path d="M0,0 L0,-40 A40,40 0 1 1 -23.5,-32.4 Z" fill="#C8102E" opacity=".85"/><path d="M0,0 L-23.5,-32.4 A40,40 0 0 1 0,-40 Z" fill="#2E7D32"/></g><text x="384" y="194" font-size="20" fill="#C8102E" text-anchor="start" font-weight="bold">50 min closed</text><text x="384" y="220" font-size="20" fill="#2E7D32" text-anchor="start" font-weight="bold">10 min open</text></g></svg>