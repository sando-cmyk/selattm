<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="From CoPTTM road levels to a site-specific NZGTTM risk assessment" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>From CoPTTM road levels to a site-specific NZGTTM risk assessment</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><g class="a left" style="animation-delay:0.00s" ><rect x="40" y="50" width="290" height="240" rx="14" fill="#ECECEC" stroke="#D8D4CA" stroke-width="2"/><text x="185" y="92" font-size="30" fill="#777" text-anchor="middle" font-weight="bold">CoPTTM</text><rect x="70" y="118" width="230" height="28" rx="6" fill="#D6D6D6"/><text x="185" y="139" font-size="18" fill="#888" text-anchor="middle" font-weight="bold">Road level 1 / 2 / 3</text><rect x="70" y="158" width="230" height="28" rx="6" fill="#D6D6D6"/><text x="185" y="179" font-size="18" fill="#888" text-anchor="middle" font-weight="bold">Static / mobile categories</text><rect x="70" y="198" width="230" height="28" rx="6" fill="#D6D6D6"/><text x="185" y="219" font-size="18" fill="#888" text-anchor="middle" font-weight="bold">Generic plan fits all</text><rect x="70" y="238" width="230" height="28" rx="6" fill="#D6D6D6"/><text x="185" y="259" font-size="18" fill="#888" text-anchor="middle" font-weight="bold">Tick the box</text></g><g class="a fade" style="animation-delay:0.60s" ><line x1="345" y1="170" x2="437.0" y2="170.0" stroke="#F2A900" stroke-width="8" stroke-linecap="round"/><path d="M455,170 L437.0,182.0 L437.0,158.0Z" fill="#F2A900"/></g><g class="a right" style="animation-delay:0.90s" ><rect x="470" y="50" width="290" height="240" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><text x="615" y="92" font-size="30" fill="#13223D" text-anchor="middle" font-weight="bold">NZGTTM</text><rect x="490" y="210" width="250" height="50" fill="#5B6270"/><line x1="490" y1="214" x2="740" y2="214" stroke="#fff" stroke-width="3"/><line x1="490" y1="256" x2="740" y2="256" stroke="#fff" stroke-width="3"/><line x1="490" y1="235.0" x2="740" y2="235.0" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/><g transform="translate(540,214) scale(0.7)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(600,214) scale(0.7)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><g transform="translate(670,210) scale(0.7)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><g transform="translate(670,210) scale(0.7)"><rect x="-14" y="-52" width="28" height="4" fill="#fff"/><path d="M-13,-90 Q0,-104 13,-90Z" fill="#F2A900"/></g><g><circle cx="600" cy="150" r="44" fill="none" stroke="#13223D" stroke-width="9"/><line x1="632" y1="182" x2="668" y2="218" stroke="#13223D" stroke-width="12" stroke-linecap="round"/></g><text x="600" y="160" font-size="34" fill="#F2A900" text-anchor="middle" font-weight="bold">?</text></g></svg>