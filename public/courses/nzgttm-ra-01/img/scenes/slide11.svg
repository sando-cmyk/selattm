nsform="translate(311,240)"><g transform="translate(0,0) scale(0.75)"><circle cx="-26" cy="-16" r="16" fill="#222"/><circle cx="26" cy="-16" r="16" fill="#222"/><path d="M-30,-30 L20,-30 L30,-44 L-14,-44Z" fill="#C8102E"/><circle cx="0" cy="-74" r="12" fill="#13223D"/><rect x="-10" y="-64" width="18" height="22" rx="5" fill="#1E3A5F"/></g></g><text x="311" y="290" font-size="15" fill="#13223D" text-anchor="middle" font-weight="bold">Motorbikes</text></g><g class="a up" style="animation-delay:0.75s" ><g transform="translate(398,240)"><g transform="translate(0,0) scale(0.42)"><rect x="-90" y="-80" width="180" height="70" rx="10" fill="#2E7D32"/><rect x="-80" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><rect x="-46" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><rect x="-12" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><rect x="22" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><rect x="56" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><circle cx="-56" cy="-10" r="13" fill="#222"/><circle cx="56" cy="-10" r="13" fill="#222"/></g></g><text x="398" y="290" font-size="15" fill="#13223D" text-anchor="middle" font-weight="bold">Buses</text></g><g class="a up" style="animation-delay:0.90s" ><g transform="translate(485,240)"><g transform="translate(0,0) scale(0.7)"><circle cx="-22" cy="-16" r="16" fill="none" stroke="#222" stroke-width="4"/><circle cx="22" cy="-16" r="16" fill="none" stroke="#222" stroke-width="4"/><path d="M-22,-16 L-4,-44 L14,-44 L22,-16 M-4,-44 L-2,-16 L-22,-16" stroke="#C8102E" stroke-width="4" fill="none"/><circle cx="0" cy="-86" r="10" fill="#E8B48A"/><path d="M0,-76 L-6,-52 L8,-44" stroke="#1E3A5F" stroke-width="10" stroke-linecap="round" fill="none"/></g></g><text x="485" y="290" font-size="15" fill="#13223D" text-anchor="middle" font-weight="bold">Cyclists</text></g><g class="a up" style="animation-delay:1.05s" ><g transform="translate(572,240)"><g transform="translate(0,0) scale(0.55)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#C8102E"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g></g><text x="572" y="290" font-size="15" fill="#13223D" text-anchor="middle" font-weight="bold">Children</text></g><g class="a up" style="animation-delay:1.20s" ><g transform="translate(659,240)"><g transform="translate(0,0) scale(0.75)"><circle cx="-4" cy="-22" r="22" fill="none" stroke="#222" stroke-width="5"/><circle cx="24" cy="-6" r="6" fill="#222"/><circle cx="-2" cy="-84" r="11" fill="#E8B48A"/><path d="M-2,-72 L-2,-46 L22,-46 L26,-10" stroke="#1E3A5F" stroke-width="11" stroke-linecap="round" fill="none"/></g></g><text x="659" y="290" font-size="15" fill="#13223D" text-anchor="middle" font-weight="bold">Mobility</text></g><g class="a up" style="animation-delay:1.35s" ><g transform="translate(746,240)"><g transform="translate(0,0) scale(0.75)"><rect x="-40" y="-56" width="60" height="30" rx="4" fill="#2E7D32"/><rect x="-20" y="-90" width="34" height="36" rx="4" fill="#2E7D32" stroke="#222" stroke-width="3"/><circle cx="-24" cy="-22" r="24" fill="#222"/><circle cx="-24" cy="-22" r="9" fill="#F2A900"/><circle cx="22" cy="-14" r="14" fill="#222"/></g></g><text x="746" y="290" font-size="15" fill="#13223D" text-anchor="middle" font-weight="bold">Farm / OD</text></g><g class="a fade" style="animation-delay:1.60s" ><text x="400" y="60" font-size="28" fill="#13223D" text-anchor="middle" font-weight="bold">Everybody has the same right to be safe</text></g></svg>