<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="The TMP form parts: planning, general, TMD and on-site record" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The TMP form parts: planning, general, TMD and on-site record</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a drop" style="animation-delay:0.20s" ><g transform="translate(130,175) rotate(-14)"><rect x="-70" y="-100" width="140" height="190" rx="8" fill="#fff" stroke="#13223D" stroke-width="4"/><rect x="-70" y="-100" width="140" height="40" rx="8" fill="#13223D"/><rect x="-50" y="-40" width="100" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="-18" width="70" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="4" width="100" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="26" width="70" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="48" width="100" height="7" rx="3" fill="#C9D1DC"/></g><text x="130" y="312" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Reviewers</text></g><g class="a fade" style="animation-delay:0.50s" ><text transform="rotate(-14 130 175)" x="130" y="92" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Planning</text></g><g class="a drop" style="animation-delay:0.50s" ><g transform="translate(310,175) rotate(-4)"><rect x="-70" y="-100" width="140" height="190" rx="8" fill="#fff" stroke="#1E3A5F" stroke-width="4"/><rect x="-70" y="-100" width="140" height="40" rx="8" fill="#1E3A5F"/><rect x="-50" y="-40" width="100" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="-18" width="70" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="4" width="100" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="26" width="70" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="48" width="100" height="7" rx="3" fill="#C9D1DC"/></g><text x="310" y="312" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Site + reviewers</text></g><g class="a fade" style="animation-delay:0.80s" ><text transform="rotate(-4 310 175)" x="310" y="92" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">General</text></g><g class="a drop" style="animation-delay:0.80s" ><g transform="translate(490,175) rotate(6)"><rect x="-70" y="-100" width="140" height="190" rx="8" fill="#fff" stroke="#2E7D32" stroke-width="4"/><rect x="-70" y="-100" width="140" height="40" rx="8" fill="#2E7D32"/><rect x="-50" y="-40" width="100" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="-18" width="70" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="4" width="100" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="26" width="70" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="48" width="100" height="7" rx="3" fill="#C9D1DC"/></g><text x="490" y="312" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">One per layout</text></g><g class="a fade" style="animation-delay:1.10s" ><text transform="rotate(6 490 175)" x="490" y="100" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">TMD</text></g><g class="a drop" style="animation-delay:1.10s" ><g transform="translate(670,175) rotate(16)"><rect x="-70" y="-100" width="140" height="190" rx="8" fill="#fff" stroke="#F2A900" stroke-width="4"/><rect x="-70" y="-100" width="140" height="40" rx="8" fill="#F2A900"/><rect x="-50" y="-40" width="100" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="-18" width="70" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="4" width="100" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="26" width="70" height="7" rx="3" fill="#C9D1DC"/><rect x="-50" y="48" width="100" height="7" rx="3" fill="#C9D1DC"/></g><text x="670" y="312" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Practitioners</text></g><g class="a fade" style="animation-delay:1.40s" ><text transform="rotate(16 670 175)" x="670" y="100" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Record</text></g></svg>