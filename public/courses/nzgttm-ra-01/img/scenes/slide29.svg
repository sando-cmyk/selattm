<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Checklist of questions to ask of every control" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Checklist of questions to ask of every control</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><rect x="180" y="30" width="440" height="290" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><g class="a left" style="animation-delay:0.20s" ><rect x="210" y="60" width="30" height="30" rx="6" fill="#fff" stroke="#13223D" stroke-width="3"/><text x="260" y="83" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Matches the severity?</text></g><g class="a pop" style="animation-delay:1.30s" ><path d="M214,74 l9,10 l16,-20" stroke="#2E7D32" stroke-width="5" fill="none" stroke-linecap="round"/></g><g class="a left" style="animation-delay:0.40s" ><rect x="210" y="112" width="30" height="30" rx="6" fill="#fff" stroke="#13223D" stroke-width="3"/><text x="260" y="135" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Works consistently?</text></g><g class="a pop" style="animation-delay:1.60s" ><path d="M214,126 l9,10 l16,-20" stroke="#2E7D32" stroke-width="5" fill="none" stroke-linecap="round"/></g><g class="a left" style="animation-delay:0.60s" ><rect x="210" y="164" width="30" height="30" rx="6" fill="#fff" stroke="#13223D" stroke-width="3"/><text x="260" y="187" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">New risks introduced?</text></g><g class="a pop" style="animation-delay:1.90s" ><path d="M214,178 l9,10 l16,-20" stroke="#2E7D32" stroke-width="5" fill="none" stroke-linecap="round"/></g><g class="a left" style="animation-delay:0.80s" ><rect x="210" y="216" width="30" height="30" rx="6" fill="#fff" stroke="#13223D" stroke-width="3"/><text x="260" y="239" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Most appropriate option?</text></g><g class="a pop" style="animation-delay:2.20s" ><path d="M214,230 l9,10 l16,-20" stroke="#2E7D32" stroke-width="5" fill="none" stroke-linecap="round"/></g><g class="a left" style="animation-delay:1.00s" ><rect x="210" y="268" width="30" height="30" rx="6" fill="#fff" stroke="#13223D" stroke-width="3"/><text x="260" y="291" font-size="22" fill="#13223D" text-anchor="start" font-weight="bold">Every stage, every group?</text></g><g class="a pop" style="animation-delay:2.50s" ><path d="M214,282 l9,10 l16,-20" stroke="#2E7D32" stroke-width="5" fill="none" stroke-linecap="round"/></g></svg>