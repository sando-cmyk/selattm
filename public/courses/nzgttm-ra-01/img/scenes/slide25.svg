<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Five fundamental TTM methodologies: remove, around, through, past, in the gaps" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Five fundamental TTM methodologies: remove, around, through, past, in the gaps</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><defs><linearGradient id="gr"><stop offset="0" stop-color="#2E7D32"/><stop offset="1" stop-color="#C8102E"/></linearGradient></defs><g class="a pop" style="animation-delay:0.20s" ><g transform="translate(90,150)"><g><circle cx="0" cy="0" r="60" fill="#13223D"/><path d="M-20,-20 L20,20 M20,-20 L-20,20" stroke="#fff" stroke-width="8" stroke-linecap="round"/></g></g><text x="90" y="60" font-size="28" fill="#13223D" text-anchor="middle" font-weight="bold">1</text><text x="90" y="250" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Remove</text></g><g class="a pop" style="animation-delay:0.45s" ><g transform="translate(245,150)"><g><circle cx="0" cy="0" r="60" fill="#2E7D32"/><path d="M-26,14 L-26,-10 Q-26,-24 -12,-24 L12,-24 Q26,-24 26,-10 L26,14" fill="none" stroke="#fff" stroke-width="7"/><path d="M26,22 l-10,-14 h20z" fill="#fff"/><rect x="-10" y="0" width="20" height="20" fill="#F26B1D"/></g></g><text x="245" y="60" font-size="28" fill="#2E7D32" text-anchor="middle" font-weight="bold">2</text><text x="245" y="250" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Around</text></g><g class="a pop" style="animation-delay:0.70s" ><g transform="translate(400,150)"><g><circle cx="0" cy="0" r="60" fill="#5B9A3C"/><rect x="-14" y="-30" width="28" height="60" rx="6" fill="#222"/><circle cx="0" cy="-16" r="8" fill="#C8102E"/><circle cx="0" cy="2" r="8" fill="#555"/><circle cx="0" cy="18" r="6" fill="#2E7D32"/></g></g><text x="400" y="60" font-size="28" fill="#5B9A3C" text-anchor="middle" font-weight="bold">3</text><text x="400" y="250" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Through</text></g><g class="a pop" style="animation-delay:0.95s" ><g transform="translate(555,150)"><g><circle cx="0" cy="0" r="60" fill="#F2A900"/><rect x="-30" y="-6" width="60" height="14" fill="#fff"/><path d="M-30,-6 h12 l-12,14z M-6,-6 h12 l-12,14z M18,-6 h12 l-12,14z" fill="#C8102E"/><path d="M-26,-22 h48" stroke="#fff" stroke-width="5"/><path d="M22,-22 l-10,-8 v16z" fill="#fff"/></g></g><text x="555" y="60" font-size="28" fill="#F2A900" text-anchor="middle" font-weight="bold">4</text><text x="555" y="250" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Past</text></g><g class="a pop" style="animation-delay:1.20s" ><g transform="translate(710,150)"><g><circle cx="0" cy="0" r="60" fill="#C8102E"/><circle cx="0" cy="-16" r="8" fill="#fff"/><rect x="-7" y="-6" width="14" height="22" rx="4" fill="#fff"/><path d="M-30,24 h14 M16,24 h14" stroke="#fff" stroke-width="6"/></g></g><text x="710" y="60" font-size="28" fill="#C8102E" text-anchor="middle" font-weight="bold">5</text><text x="710" y="250" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">In the gaps</text></g><g class="a grow" style="animation-delay:1.50s" ><rect x="80" y="286" width="640" height="10" rx="5" fill="url(#gr)"/></g><g class="a fade" style="animation-delay:1.80s" ><text x="80" y="326" font-size="18" fill="#2E7D32" text-anchor="start" font-weight="bold">Preferred</text><text x="720" y="326" font-size="18" fill="#C8102E" text-anchor="end" font-weight="bold">Lowest</text></g></svg>