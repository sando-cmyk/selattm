 cy="0" r="20" fill="#C8102E" stroke="#fff" stroke-width="4"/><text x="0" y="8.4" font-size="24.0" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial">2</text></g></g></g></g><g class="a pop" style="animation-delay:1.30s" ><g transform="translate(700,222)"><g class="pulse"><g><circle cx="0" cy="0" r="20" fill="#C8102E" stroke="#fff" stroke-width="4"/><text x="0" y="8.4" font-size="24.0" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial">3</text></g></g></g></g><g class="a fade" style="animation-delay:1.80s" ><rect x="300" y="20" width="240" height="40" rx="20" fill="#13223D"/><text x="420" y="47" font-size="22" fill="#F2A900" text-anchor="middle" font-weight="bold">Find 3 faults</text></g></svg>