<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Plan, Do, Check, Act risk management cycle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Plan, Do, Check, Act risk management cycle</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a fade" style="animation-delay:0.00s" ><g class="spin"><path d="M416.7,51.2 A120,120 0 0 1 518.8,153.3" fill="none" stroke="#1E3A5F" stroke-width="22" stroke-linecap="round"/><circle cx="519.7" cy="161.6" r="9" fill="#F2A900"/><path d="M518.8,186.7 A120,120 0 0 1 416.7,288.8" fill="none" stroke="#1E3A5F" stroke-width="22" stroke-linecap="round"/><circle cx="408.4" cy="289.7" r="9" fill="#F2A900"/><path d="M383.3,288.8 A120,120 0 0 1 281.2,186.7" fill="none" stroke="#1E3A5F" stroke-width="22" stroke-linecap="round"/><circle cx="280.3" cy="178.4" r="9" fill="#F2A900"/><path d="M281.2,153.3 A120,120 0 0 1 383.3,51.2" fill="none" stroke="#1E3A5F" stroke-width="22" stroke-linecap="round"/><circle cx="391.6" cy="50.3" r="9" fill="#F2A900"/></g></g><g class="a pop" style="animation-delay:0.30s" ><rect x="182" y="54" width="140" height="48" rx="24" fill="#13223D"/><text x="252" y="87" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">PLAN</text></g><g class="a pop" style="animation-delay:0.60s" ><rect x="478" y="54" width="140" height="48" rx="24" fill="#2E7D32"/><text x="548" y="87" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">DO</text></g><g class="a pop" style="animation-delay:0.90s" ><rect x="478" y="238" width="140" height="48" rx="24" fill="#F2A900"/><text x="548" y="271" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">CHECK</text></g><g class="a pop" style="animation-delay:1.20s" ><rect x="182" y="238" width="140" height="48" rx="24" fill="#C8102E"/><text x="252" y="271" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">ACT</text></g><g class="a fade" style="animation-delay:1.40s" ><text x="400" y="168" font-size="26" fill="#13223D" text-anchor="middle" font-weight="bold">ISO</text><text x="400" y="198" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">31000</text></g></svg>