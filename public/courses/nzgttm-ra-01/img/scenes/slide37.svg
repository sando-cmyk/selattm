<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Review flow: plan, risk review, network access, regulatory, approved by the contractor PCBU" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Review flow: plan, risk review, network access, regulatory, approved by the contractor PCBU</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a pop" style="animation-delay:0.20s" ><rect x="30" y="120" width="136" height="80" rx="12" fill="#1E3A5F"/><text x="98" y="168" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Plan</text></g><g class="a fade" style="animation-delay:0.40s" ><line x1="168" y1="160" x2="166.0" y2="160.0" stroke="#3C4A5E" stroke-width="4" stroke-linecap="round"/><path d="M184,160 L166.0,172.0 L166.0,148.0Z" fill="#3C4A5E"/></g><g class="a pop" style="animation-delay:0.55s" ><rect x="186" y="120" width="136" height="80" rx="12" fill="#F2A900"/><text x="254" y="168" font-size="19" fill="#13223D" text-anchor="middle" font-weight="bold">Risk review</text></g><g class="a fade" style="animation-delay:0.75s" ><line x1="324" y1="160" x2="322.0" y2="160.0" stroke="#3C4A5E" stroke-width="4" stroke-linecap="round"/><path d="M340,160 L322.0,172.0 L322.0,148.0Z" fill="#3C4A5E"/></g><g class="a pop" style="animation-delay:0.90s" ><rect x="342" y="120" width="136" height="80" rx="12" fill="#1E3A5F"/><text x="410" y="168" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Network access</text></g><g class="a fade" style="animation-delay:1.10s" ><line x1="480" y1="160" x2="478.0" y2="160.0" stroke="#3C4A5E" stroke-width="4" stroke-linecap="round"/><path d="M496,160 L478.0,172.0 L478.0,148.0Z" fill="#3C4A5E"/></g><g class="a pop" style="animation-delay:1.25s" ><rect x="498" y="120" width="136" height="80" rx="12" fill="#1E3A5F"/><text x="566" y="168" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Regulatory</text></g><g class="a fade" style="animation-delay:1.45s" ><line x1="636" y1="160" x2="634.0" y2="160.0" stroke="#3C4A5E" stroke-width="4" stroke-linecap="round"/><path d="M652,160 L634.0,172.0 L634.0,148.0Z" fill="#3C4A5E"/></g><g class="a pop" style="animation-delay:1.60s" ><rect x="654" y="120" width="136" height="80" rx="12" fill="#2E7D32"/><text x="722" y="168" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Approved</text></g><g class="a fade" style="animation-delay:1.00s" ><text x="264" y="236" font-size="18" fill="#3C4A5E" text-anchor="middle" font-weight="bold">Recommends —</text><text x="264" y="258" font-size="18" fill="#3C4A5E" text-anchor="middle" font-weight="bold">doesn't approve</text></g><g class="a fade" style="animation-delay:2.00s" ><text x="732" y="236" font-size="18" fill="#2E7D32" text-anchor="middle" font-weight="bold">Contractor</text><text x="732" y="258" font-size="18" fill="#2E7D32" text-anchor="middle" font-weight="bold">PCBU approves</text></g><g class="a fade" style="animation-delay:0.00s" ><text x="400" y="70" font-size="26" fill="#13223D" text-anchor="middle" font-weight="bold">Before a TMP is used</text></g></svg>