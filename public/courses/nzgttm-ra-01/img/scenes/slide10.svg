<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Activity context plus five environment categories" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Activity context plus five environment categories</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a fade" style="animation-delay:0.40s" ><line x1="400" y1="160" x2="120" y2="70" stroke="#F2A900" stroke-width="4" stroke-dasharray="8 8"/></g><g class="a fade" style="animation-delay:0.60s" ><line x1="400" y1="160" x2="680" y2="70" stroke="#F2A900" stroke-width="4" stroke-dasharray="8 8"/></g><g class="a fade" style="animation-delay:0.80s" ><line x1="400" y1="160" x2="120" y2="240" stroke="#F2A900" stroke-width="4" stroke-dasharray="8 8"/></g><g class="a fade" style="animation-delay:1.00s" ><line x1="400" y1="160" x2="680" y2="240" stroke="#F2A900" stroke-width="4" stroke-dasharray="8 8"/></g><g class="a fade" style="animation-delay:1.20s" ><line x1="400" y1="160" x2="400" y2="290" stroke="#F2A900" stroke-width="4" stroke-dasharray="8 8"/></g><g class="a pop" style="animation-delay:0.00s" ><g><circle cx="400" cy="160" r="74" fill="#13223D"/><text x="400" y="154" font-size="22" fill="#F2A900" text-anchor="middle" font-weight="bold">ACTIVITY</text><text x="400" y="184" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">+ site</text></g></g><g class="a pop" style="animation-delay:0.50s" ><g transform="translate(120,70)"><g><circle cx="0" cy="0" r="42" fill="#1E3A5F"/><rect x="-40" y="-30" width="80" height="30" fill="#5B6270"/><line x1="-40" y1="-26" x2="40" y2="-26" stroke="#fff" stroke-width="3"/><line x1="-40" y1="-4" x2="40" y2="-4" stroke="#fff" stroke-width="3"/><line x1="-40" y1="-15.0" x2="40" y2="-15.0" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/></g></g></g><g class="a fade" style="animation-delay:0.60s" ><text x="120" y="128" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Corridor</text></g><g class="a pop" style="animation-delay:0.70s" ><g transform="translate(680,70)"><g><circle cx="0" cy="0" r="42" fill="#1E3A5F"/><rect x="-30" y="-28" width="60" height="56" rx="6" fill="#fff"/><rect x="-30" y="-28" width="60" height="16" fill="#C8102E"/><text x="0" y="20" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">1–4</text></g></g></g><g class="a fade" style="animation-delay:0.80s" ><text x="680" y="128" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Programme</text></g><g class="a pop" style="animation-delay:0.90s" ><g transform="translate(120,240)"><g><circle cx="0" cy="0" r="42" fill="#1E3A5F"/><g transform="translate(-14,26) scale(0.4)"><circle cx="0" cy="-78" r="12" fill="#fff"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#fff"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#fff"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#fff"/></g><g transform="translate(14,26) scale(0.4)"><circle cx="0" cy="-78" r="12" fill="#fff"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#fff"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#fff"/></g></g></g></g><g class="a fade" style="animation-delay:1.00s" ><text x="120" y="312" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Network users</text></g><g class="a pop" style="animation-delay:1.10s" ><g transform="translate(680,240)"><g><circle cx="0" cy="0" r="42" fill="#1E3A5F"/><g transform="translate(0,26) scale(0.45)"><rect x="-40" y="-60" width="80" height="60" fill="#D9C7A8"/><path d="M-50,-58 L0,-100 L50,-58Z" fill="#C8102E"/><rect x="-10" y="-34" width="20" height="34" fill="#1E3A5F"/><rect x="-32" y="-48" width="16" height="16" fill="#BFD6EA"/><rect x="16" y="-48" width="16" height="16" fill="#BFD6EA"/></g></g></g></g><g class="a fade" style="animation-delay:1.20s" ><text x="680" y="312" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Neighbours</text></g><g class="a pop" style="animation-delay:1.30s" ><g transform="translate(400,290)"><g><circle cx="0" cy="0" r="42" fill="#1E3A5F"/><ellipse cx="0" cy="-4" rx="30" ry="18" fill="#fff"/><path d="M-12,18 l-5,10 M0,18 l-5,10 M12,18 l-5,10" stroke="#fff" stroke-width="4"/></g></g></g><g class="a fade" style="animation-delay:1.40s" ><text x="456" y="298" font-size="20" fill="#13223D" text-anchor="start" font-weight="bold">Natural env.</text></g></svg>