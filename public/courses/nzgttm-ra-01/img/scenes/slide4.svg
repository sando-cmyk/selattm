<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="HSWA 2015 duties apply to everyone in the contracting chain and to road users" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>HSWA 2015 duties apply to everyone in the contracting chain and to road users</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a pop" style="animation-delay:0.00s" ><path d="M400,40 L480,70 L480,150 Q480,220 400,262 Q320,220 320,150 L320,70Z" fill="#13223D"/><text x="400" y="150" font-size="40" fill="#F2A900" text-anchor="middle" font-weight="bold">HSWA</text><text x="400" y="188" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2015</text></g><g class="a pop" style="animation-delay:0.60s" ><g transform="translate(110,135) scale(0.75)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="110" y="167" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Client</text></g><g class="a fade" style="animation-delay:0.90s" ><line x1="150" y1="75" x2="330" y2="150" stroke="#F2A900" stroke-width="5" stroke-dasharray="10 8"/></g><g class="a pop" style="animation-delay:0.85s" ><g transform="translate(110,255) scale(0.75)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="110" y="287" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Contractor</text></g><g class="a fade" style="animation-delay:1.15s" ><line x1="150" y1="195" x2="330" y2="150" stroke="#F2A900" stroke-width="5" stroke-dasharray="10 8"/></g><g class="a pop" style="animation-delay:1.10s" ><g transform="translate(690,135) scale(0.75)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="690" y="167" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Sub-contractor</text></g><g class="a fade" style="animation-delay:1.40s" ><line x1="650" y1="75" x2="470" y2="150" stroke="#F2A900" stroke-width="5" stroke-dasharray="10 8"/></g><g class="a pop" style="animation-delay:1.35s" ><g transform="translate(690,255) scale(0.75)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#1E3A5F"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="690" y="287" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Road users</text></g><g class="a fade" style="animation-delay:1.65s" ><line x1="650" y1="195" x2="470" y2="150" stroke="#F2A900" stroke-width="5" stroke-dasharray="10 8"/></g></svg>