<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Ranking risks: the highest score is dealt with first" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Ranking risks: the highest score is dealt with first</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><text x="260" y="82" font-size="22" fill="#13223D" text-anchor="end" font-weight="bold">Footpath / pedestrians</text><g class="a grow" style="animation-delay:0.30s" ><rect x="280" y="50" width="400" height="46" rx="8" fill="#C8102E"/></g><g class="a fade" style="animation-delay:0.80s" ><text x="710" y="82" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">20</text></g><text x="260" y="148" font-size="22" fill="#13223D" text-anchor="end" font-weight="bold">Bus stop</text><g class="a grow" style="animation-delay:0.60s" ><rect x="280" y="116" width="300" height="46" rx="8" fill="#F26B1D"/></g><g class="a fade" style="animation-delay:1.10s" ><text x="610" y="148" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">15</text></g><text x="260" y="214" font-size="22" fill="#13223D" text-anchor="end" font-weight="bold">Afternoon sun</text><g class="a grow" style="animation-delay:0.90s" ><rect x="280" y="182" width="300" height="46" rx="8" fill="#F26B1D"/></g><g class="a fade" style="animation-delay:1.40s" ><text x="610" y="214" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">15</text></g><text x="260" y="280" font-size="22" fill="#13223D" text-anchor="end" font-weight="bold">Van access</text><g class="a grow" style="animation-delay:1.20s" ><rect x="280" y="248" width="180" height="46" rx="8" fill="#F2A900"/></g><g class="a fade" style="animation-delay:1.70s" ><text x="490" y="280" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">9</text></g><g class="a pop" style="animation-delay:1.80s" ><g transform="translate(740,72)"><line x1="0" y1="-30" x2="0" y2="30" stroke="#555" stroke-width="4"/><path d="M0,-30 L36,-18 L0,-6Z" fill="#C8102E"/></g><text x="700" y="130" font-size="20" fill="#C8102E" text-anchor="middle" font-weight="bold">First</text></g></svg>