0" y2="-150" stroke="#555" stroke-width="3"/><path d="M0,-150 L28,-141 L0,-132Z" fill="#C8102E"/><rect x="-58" y="-56" width="20" height="18" fill="#BFD6EA"/><rect x="-26" y="-56" width="20" height="18" fill="#BFD6EA"/><rect x="6" y="-56" width="20" height="18" fill="#BFD6EA"/><rect x="38" y="-56" width="20" height="18" fill="#BFD6EA"/><rect x="-12" y="-32" width="24" height="32" fill="#13223D"/></g><rect x="550" y="190" width="210" height="20" fill="#C9C4B8"/><g transform="translate(600,210) scale(0.45)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#C8102E"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><g transform="translate(625,210) scale(0.42)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#1E3A5F"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><path d="M560,214 H740" stroke="#2E7D32" stroke-width="5"/></g><rect x="540" y="40" width="230" height="46" rx="14" fill="#13223D"/><text x="655" y="72" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">C  School footpath</text><g transform="translate(655,262)"><g class="pulse"><g><circle cx="0" cy="0" r="18" fill="#F2A900"/><text x="0" y="7" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">?</text></g></g></g></g></svg>