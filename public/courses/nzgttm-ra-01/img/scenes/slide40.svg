<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="STMS inducting the crew and visitors, with an induction log" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>STMS inducting the crew and visitors, with an induction log</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><g class="a pop" style="animation-delay:0.00s" ><rect x="300" y="60" width="200" height="130" rx="8" fill="#fff" stroke="#13223D" stroke-width="4"/><text x="400" y="100" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">SITE INDUCTION</text><g transform="translate(330,124)"><g><circle cx="0" cy="0" r="8" fill="#2E7D32"/><path d="M-3.6,0 l2.4,2.56 l4.4,-4.8" stroke="#fff" stroke-width="1.76" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g><rect x="346" y="119" width="120" height="8" rx="4" fill="#C9D1DC"/><g transform="translate(330,146)"><g><circle cx="0" cy="0" r="8" fill="#2E7D32"/><path d="M-3.6,0 l2.4,2.56 l4.4,-4.8" stroke="#fff" stroke-width="1.76" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g><rect x="346" y="141" width="100" height="8" rx="4" fill="#C9D1DC"/><g transform="translate(330,168)"><g><circle cx="0" cy="0" r="8" fill="#2E7D32"/><path d="M-3.6,0 l2.4,2.56 l4.4,-4.8" stroke="#fff" stroke-width="1.76" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g><rect x="346" y="163" width="80" height="8" rx="4" fill="#C9D1DC"/><rect x="392" y="190" width="16" height="60" fill="#7A5230"/></g><g class="a up" style="animation-delay:0.40s" ><g transform="translate(160,300) scale(0.9)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g></g><g class="a up" style="animation-delay:0.60s" ><g transform="translate(240,300) scale(0.9)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g></g><g class="a up" style="animation-delay:0.80s" ><g transform="translate(560,300) scale(0.9)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#1E3A5F"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g></g><g class="a up" style="animation-delay:1.00s" ><g transform="translate(640,300) scale(0.9)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g></g><g class="a pop" style="animation-delay:1.40s" ><rect x="580" y="40" width="190" height="40" rx="20" fill="#2E7D32"/><text x="675" y="67" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Log kept</text></g></svg>