<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Roads have movement and place functions for every mode" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Roads have movement and place functions for every mode</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><rect x="0" y="200" width="800" height="140" fill="#CFE3C4"/><rect x="0" y="220" width="800" height="70" fill="#5B6270"/><line x1="0" y1="224" x2="800" y2="224" stroke="#fff" stroke-width="3"/><line x1="0" y1="286" x2="800" y2="286" stroke="#fff" stroke-width="3"/><line x1="0" y1="255.0" x2="800" y2="255.0" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/><g class="a fade" style="animation-delay:0.00s" ><rect x="30" y="80" width="210" height="120" fill="#E9D9B6"/><rect x="30" y="70" width="210" height="18" fill="#C8102E"/><rect x="30" y="70" width="21" height="18" fill="#fff"/><rect x="72" y="70" width="21" height="18" fill="#fff"/><rect x="114" y="70" width="21" height="18" fill="#fff"/><rect x="156" y="70" width="21" height="18" fill="#fff"/><rect x="198" y="70" width="21" height="18" fill="#fff"/><rect x="50" y="110" width="70" height="60" fill="#BFD6EA"/><rect x="150" y="110" width="70" height="90" fill="#1E3A5F"/><g transform="translate(270,210) scale(0.6)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#1E3A5F"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><g transform="translate(300,210) scale(0.55)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#C8102E"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><rect x="250" y="168" width="70" height="8" rx="4" fill="#7A5230"/></g><g transform="translate(360,200) scale(0.9)"><rect x="-6" y="-40" width="12" height="40" fill="#7A5230"/><circle cx="0" cy="-62" r="32" fill="#2E7D32"/><circle cx="-18" cy="-48" r="20" fill="#3E8E43"/></g><g class="a pop" style="animation-delay:0.30s" ><rect x="20" y="20" width="160" height="40" rx="20" fill="#2E7D32"/><text x="100" y="48" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">PLACE</text></g><g class="a pop" style="animation-delay:0.50s" ><rect x="620" y="20" width="160" height="40" rx="20" fill="#13223D"/><text x="700" y="48" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">MOVEMENT</text></g><g class="a drive" style="animation-delay:0.40s" ><g transform="translate(660,252) scale(0.7)"><rect x="-82" y="-74" width="110" height="62" rx="4" fill="#13223D"/><rect x="28" y="-62" width="44" height="50" rx="6" fill="#13223D"/><rect x="38" y="-56" width="26" height="18" rx="3" fill="#BFD6EA"/><circle cx="-56" cy="-10" r="13" fill="#222"/><circle cx="-24" cy="-10" r="13" fill="#222"/><circle cx="50" cy="-10" r="13" fill="#222"/></g></g><g class="a drive" style="animation-delay:0.80s" ><g transform="translate(480,290) scale(0.62)"><rect x="-90" y="-80" width="180" height="70" rx="10" fill="#2E7D32"/><rect x="-80" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><rect x="-46" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><rect x="-12" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><rect x="22" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><rect x="56" y="-70" width="26" height="24" rx="3" fill="#BFD6EA"/><circle cx="-56" cy="-10" r="13" fill="#222"/><circle cx="56" cy="-10" r="13" fill="#222"/></g></g><g class="a drive" style="animation-delay:1.10s" ><g transform="translate(380,250) scale(0.55)"><circle cx="-22" cy="-16" r="16" fill="none" stroke="#222" stroke-width="4"/><circle cx="22" cy="-16" r="16" fill="none" stroke="#222" stroke-width="4"/><path d="M-22,-16 L-4,-44 L14,-44 L22,-16 M-4,-44 L-2,-16 L-22,-16" stroke="#C8102E" stroke-width="4" fill="none"/><circle cx="0" cy="-86" r="10" fill="#E8B48A"/><path d="M0,-76 L-6,-52 L8,-44" stroke="#1E3A5F" stroke-width="10" stroke-linecap="round" fill="none"/></g></g></svg>