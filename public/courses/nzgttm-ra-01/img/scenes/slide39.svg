<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="The planner hands the risk register to the STMS; a stopwatch speed check" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The planner hands the risk register to the STMS; a stopwatch speed check</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#F5F3EE'/><style>@keyframes pass{from{transform:translateX(0)}to{transform:translateX(400px)}}</style><g class="a up" style="animation-delay:0.10s" ><g transform="translate(130,270) scale(1.1)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#1E3A5F"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="130" y="300" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Planner</text></g><g class="a up" style="animation-delay:0.30s" ><g transform="translate(670,270) scale(1.1)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/></g><text x="670" y="300" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">STMS</text></g><g class="a fade" style="animation-delay:0.50s" ><g class="a" style="animation:pass 1.6s cubic-bezier(.2,.8,.2,1) .6s both;transform-box:view-box"><g transform="translate(200,170) scale(0.8)"><rect x="-36" y="-48" width="72" height="96" rx="6" fill="#FFFFFF" stroke="#13223D" stroke-width="3"/><rect x="-24" y="-32" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="-16" width="36" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="0" width="48" height="6" rx="3" fill="#B8C2CF"/><rect x="-24" y="16" width="36" height="6" rx="3" fill="#B8C2CF"/></g></g></g><g class="a fade" style="animation-delay:0.30s" ><text x="400" y="70" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Risk register handed over</text></g><g class="a pop" style="animation-delay:2.30s" ><g transform="translate(400,250)"><circle cx="0" cy="0" r="30" fill="#fff" stroke="#13223D" stroke-width="5"/><rect x="-6" y="-42" width="12" height="10" fill="#13223D"/><line x1="0" y1="0" x2="0" y2="-20" stroke="#C8102E" stroke-width="4" stroke-linecap="round"/></g><text x="450" y="246" font-size="22" fill="#C8102E" text-anchor="start" font-weight="bold">3.6 s</text><text x="450" y="270" font-size="18" fill="#13223D" text-anchor="start" font-weight="bold">100 m = 100 km/h</text></g></svg>