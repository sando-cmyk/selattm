<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A shoulder washout (hazard), a car approaching it (exposure), creating risk" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A shoulder washout (hazard), a car approaching it (exposure), creating risk</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width='800' height='340' fill='#E3ECF5'/><rect x="0" y="170" width="800" height="170" fill="#CFE3C4"/><rect x="0" y="200" width="800" height="90" fill="#5B6270"/><line x1="0" y1="204" x2="800" y2="204" stroke="#fff" stroke-width="3"/><line x1="0" y1="286" x2="800" y2="286" stroke="#fff" stroke-width="3"/><line x1="0" y1="245.0" x2="800" y2="245.0" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/><g class="a pop" style="animation-delay:0.20s" ><ellipse cx="560" cy="204" rx="80" ry="22" fill="#6B4A2B"/><ellipse cx="560" cy="200" rx="64" ry="14" fill="#3B2A18"/><text x="560" y="160" font-size="28" fill="#C8102E" text-anchor="middle" font-weight="bold">HAZARD</text></g><g class="a drive" style="animation-delay:0.70s" ><g transform="translate(380,262) scale(1.0,1.0)"><rect x="-50" y="-34" width="100" height="24" rx="8" fill="#1E3A5F"/><path d="M-30,-34 L-18,-54 L18,-54 L32,-34Z" fill="#1E3A5F"/><path d="M-22,-36 L-14,-50 L0,-50 L0,-36Z M4,-36 L4,-50 L16,-50 L26,-36Z" fill="#BFD6EA"/><circle cx="-28" cy="-10" r="11" fill="#222"/><circle cx="28" cy="-10" r="11" fill="#222"/><rect x="42" y="-30" width="8" height="6" fill="#F2A900"/></g></g><g class="a fade" style="animation-delay:1.60s" ><text x="380" y="180" font-size="28" fill="#13223D" text-anchor="middle" font-weight="bold">EXPOSURE</text></g><g class="a pop" style="animation-delay:2.20s" ><polygon points="708.0,90.0 684.4,100.1 693.9,123.9 670.1,114.4 660.0,138.0 649.9,114.4 626.1,123.9 635.6,100.1 612.0,90.0 635.6,79.9 626.1,56.1 649.9,65.6 660.0,42.0 670.1,65.6 693.9,56.1 684.4,79.9" fill="#F2A900"/><text x="660" y="100" font-size="26" fill="#13223D" text-anchor="middle" font-weight="bold">RISK</text></g></svg>