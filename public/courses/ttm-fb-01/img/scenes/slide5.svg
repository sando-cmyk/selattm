<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A large ute beside a small worker, with equal and opposite force arrows" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A large ute beside a small worker, with equal and opposite force arrows</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><rect x="0" y="170" width="800" height="30" fill="#CFE3C4"/><rect x="0" y="200" width="800" height="90" fill="#5B6270"/><line x1="0" y1="245.0" x2="800" y2="245.0" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/><rect x="0" y="290" width="800" height="50" fill="#CFE3C4"/><g class="a left" style="animation-delay:0.1s"><g transform="translate(170,255) scale(1.5)"><rect x="0" y="-28" width="150" height="30" rx="4" fill="#E9EEF3" stroke="#9AA6B2"/><path d="M80,-28 L92,-58 L140,-58 L150,-28Z" fill="#E9EEF3" stroke="#9AA6B2"/><path d="M96,-54 L136,-54 L144,-32 L92,-32Z" fill="#BFD6EA"/><circle cx="32" cy="4" r="13" fill="#222"/><circle cx="118" cy="4" r="13" fill="#222"/><circle cx="32" cy="4" r="5" fill="#aaa"/><circle cx="118" cy="4" r="5" fill="#aaa"/><rect x="84" y="-62" width="24" height="5" fill="#F2A900"/></g></g><g class="a right" style="animation-delay:0.2s"><g transform="translate(520,292) scale(1.3)"><circle cx="0" cy="-74" r="10" fill="#E8B48A"/><path d="M-12,-80 Q0,-96 12,-80Z" fill="#F2A900"/><rect x="-13" y="-82" width="26" height="4" fill="#F2A900"/><rect x="-14" y="-62" width="28" height="34" rx="5" fill="#F26B1D"/><rect x="-14" y="-50" width="28" height="4" fill="#E6F0F0"/><rect x="-14" y="-40" width="28" height="4" fill="#E6F0F0"/><rect x="-20" y="-60" width="6" height="26" rx="3" fill="#F26B1D"/><rect x="14" y="-60" width="6" height="26" rx="3" fill="#F26B1D"/><rect x="-12" y="-28" width="10" height="28" fill="#13223D"/><rect x="2" y="-28" width="10" height="28" fill="#13223D"/></g></g><g class="a fade" style="animation-delay:1.0s"><line x1="430" y1="180" x2="470" y2="180" stroke="#C8102E" stroke-width="7"/><circle cx="470" cy="180" r="9" fill="#C8102E"/></g><g class="a fade" style="animation-delay:1.0s"><line x1="470" y1="200" x2="420" y2="200" stroke="#13223D" stroke-width="7"/><circle cx="420" cy="200" r="9" fill="#13223D"/></g><text class="a fade" style="animation-delay:0.6s" x="220" y="90" font-size="28" fill="#13223D" text-anchor="middle" font-weight="bold">2,200 kg</text><text class="a fade" style="animation-delay:0.7s" x="520" y="90" font-size="28" fill="#13223D" text-anchor="middle" font-weight="bold">80 kg</text><text class="a fade" style="animation-delay:1.2s" x="400" y="40" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Equal force. Very unequal outcome.</text></svg>
