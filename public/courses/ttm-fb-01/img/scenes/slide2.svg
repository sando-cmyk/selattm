<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A ute stopping while a load on the deck keeps sliding forward" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A ute stopping while a load on the deck keeps sliding forward</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><rect x="0" y="170" width="800" height="30" fill="#CFE3C4"/><rect x="0" y="200" width="800" height="90" fill="#5B6270"/><line x1="0" y1="245.0" x2="800" y2="245.0" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/><rect x="0" y="290" width="800" height="50" fill="#CFE3C4"/><g class="a drive" style="animation-delay:0s"><g transform="translate(300,255) scale(1.3)"><rect x="0" y="-28" width="150" height="30" rx="4" fill="#E9EEF3" stroke="#9AA6B2"/><path d="M80,-28 L92,-58 L140,-58 L150,-28Z" fill="#E9EEF3" stroke="#9AA6B2"/><path d="M96,-54 L136,-54 L144,-32 L92,-32Z" fill="#BFD6EA"/><rect x="6" y="-50" width="14" height="22" fill="#F26B1D"/><path d="M28,-28 L36,-56 L44,-28Z" fill="#F26B1D"/><rect x="31" y="-46" width="10" height="4" fill="#fff"/><rect x="50" y="-48" width="18" height="18" fill="#fff" stroke="#C8102E" stroke-width="3"/><circle cx="32" cy="4" r="13" fill="#222"/><circle cx="118" cy="4" r="13" fill="#222"/><circle cx="32" cy="4" r="5" fill="#aaa"/><circle cx="118" cy="4" r="5" fill="#aaa"/><rect x="84" y="-62" width="24" height="5" fill="#F2A900"/></g></g><g class="a right" style="animation-delay:1.4s"><rect x="520" y="150" width="30" height="30" fill="#F26B1D"/><rect x="520" y="160" width="30" height="5" fill="#fff"/></g><g class="a fade" style="animation-delay:1.6s"><line x1="560" y1="165" x2="640" y2="165" stroke="#C8102E" stroke-width="6"/><circle cx="640" cy="165" r="8" fill="#C8102E"/></g><text class="a fade" style="animation-delay:0.6s" x="400" y="60" font-size="26" fill="#13223D" text-anchor="middle" font-weight="bold">A body in motion stays in motion</text><text class="a fade" style="animation-delay:1.8s" x="620" y="135" font-size="18" fill="#C8102E" text-anchor="middle" font-weight="bold">keeps moving</text></svg>
