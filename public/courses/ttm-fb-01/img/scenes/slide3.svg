<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A car crumpled against a stop sign, showing the three collisions" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A car crumpled against a stop sign, showing the three collisions</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><rect x="0" y="250" width="800" height="90" fill="#5B6270"/><g class="a pop" style="animation-delay:1.2s"><rect x="597" y="110" width="10" height="150" fill="#777"/><polygon points="602,60 640,76 640,114 602,130 564,114 564,76" fill="#C8102E"/><text x="602" y="102" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">STOP</text></g><g class="a drive" style="animation-delay:0s"><g transform="translate(420,270) scale(1.4)"><rect x="0" y="-28" width="120" height="30" rx="8" fill="#E0A21A"/><path d="M22,-28 L38,-52 L84,-52 L100,-28Z" fill="#E0A21A"/><path d="M42,-48 L58,-48 L58,-30 L32,-30Z M62,-48 L80,-48 L94,-30 L62,-30Z" fill="#BFD6EA"/><circle cx="28" cy="4" r="12" fill="#222"/><circle cx="94" cy="4" r="12" fill="#222"/><circle cx="28" cy="4" r="5" fill="#aaa"/><circle cx="94" cy="4" r="5" fill="#aaa"/><rect x="114" y="-22" width="6" height="8" fill="#FFE08A"/></g></g><g class="a pop" style="animation-delay:1.6s"><circle cx="140" cy="70" r="26" fill="#13223D"/><text x="140" y="79" font-size="24" fill="#F2A900" text-anchor="middle" font-weight="bold">1</text></g><text class="a fade" style="animation-delay:1.7s" x="140" y="124" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Vehicle stops</text><g class="a pop" style="animation-delay:1.9000000000000001s"><circle cx="310" cy="70" r="26" fill="#13223D"/><text x="310" y="79" font-size="24" fill="#F2A900" text-anchor="middle" font-weight="bold">2</text></g><text class="a fade" style="animation-delay:2.0s" x="310" y="124" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Body keeps going</text><g class="a pop" style="animation-delay:2.2s"><circle cx="480" cy="70" r="26" fill="#13223D"/><text x="480" y="79" font-size="24" fill="#F2A900" text-anchor="middle" font-weight="bold">3</text></g><text class="a fade" style="animation-delay:2.3s" x="480" y="124" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Organs keep going</text><text class="a fade" style="animation-delay:0.4s" x="140" y="180" font-size="28" fill="#C8102E" text-anchor="middle" font-weight="bold">100 km/h</text></svg>
