="#1E3A5F"/><path d="M42,-48 L58,-48 L58,-30 L32,-30Z M62,-48 L80,-48 L94,-30 L62,-30Z" fill="#BFD6EA"/><circle cx="28" cy="4" r="12" fill="#222"/><circle cx="94" cy="4" r="12" fill="#222"/><circle cx="28" cy="4" r="5" fill="#aaa"/><circle cx="94" cy="4" r="5" fill="#aaa"/><rect x="114" y="-22" width="6" height="8" fill="#FFE08A"/></g></g><text class="a fade" style="animation-delay:0.6s" x="400" y="60" font-size="34" fill="#13223D" text-anchor="middle" font-weight="bold">FORCE &amp; THE BODY</text><text class="a fade" style="animation-delay:0.9s" x="400" y="98" font-size="20" fill="#3C4A5E" text-anchor="middle">Newton’s laws in the work zone</text></svg>
