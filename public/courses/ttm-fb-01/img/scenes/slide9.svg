<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A car braking towards a work site with reaction and braking distances marked" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A car braking towards a work site with reaction and braking distances marked</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><rect x="0" y="140" width="800" height="30" fill="#CFE3C4"/><rect x="0" y="170" width="800" height="90" fill="#5B6270"/><line x1="0" y1="215.0" x2="800" y2="215.0" stroke="#fff" stroke-width="4" stroke-dasharray="26 22"/><rect x="0" y="260" width="800" height="80" fill="#CFE3C4"/><g class="a drive" style="animation-delay:0s"><g transform="translate(30,232) scale(1)"><rect x="0" y="-28" width="120" height="30" rx="8" fill="#1E3A5F"/><path d="M22,-28 L38,-52 L84,-52 L100,-28Z" fill="#1E3A5F"/><path d="M42,-48 L58,-48 L58,-30 L32,-30Z M62,-48 L80,-48 L94,-30 L62,-30Z" fill="#BFD6EA"/><circle cx="28" cy="4" r="12" fill="#222"/><circle cx="94" cy="4" r="12" fill="#222"/><circle cx="28" cy="4" r="5" fill="#aaa"/><circle cx="94" cy="4" r="5" fill="#aaa"/><rect x="114" y="-22" width="6" height="8" fill="#FFE08A"/></g></g><rect class="a grow" style="animation-delay:1.2s" x="160" y="280" width="240" height="20" fill="#9AA6B2"/><text class="a fade" style="animation-delay:1.3s" x="280" y="320" font-size="17" fill="#13223D" text-anchor="middle" font-weight="bold">Reaction</text><rect class="a grow" style="animation-delay:1.6s" x="400" y="280" width="230" height="20" fill="#F26B1D"/><text class="a fade" style="animation-delay:1.7s" x="515" y="320" font-size="17" fill="#13223D" text-anchor="middle" font-weight="bold">Braking</text><g class="a drop" style="animation-delay:0.4s"><g transform="translate(660,230)"><path d="M-10,0 L-3,-30 L3,-30 L10,0Z" fill="#F26B1D"/><rect x="-6" y="-18" width="12" height="5" fill="#fff"/><rect x="-14" y="0" width="28" height="4" fill="#333"/></g></g><g class="a drop" style="animation-delay:0.5s"><g transform="translate(700,230)"><path d="M-10,0 L-3,-30 L3,-30 L10,0Z" fill="#F26B1D"/><rect x="-6" y="-18" width="12" height="5" fill="#fff"/><rect x="-14" y="0" width="28" height="4" fill="#333"/></g></g><g class="a up" style="animation-delay:0.6s"><g transform="translate(745,250) scale(1)"><circle cx="0" cy="-74" r="10" fill="#E8B48A"/><path d="M-12,-80 Q0,-96 12,-80Z" fill="#F2A900"/><rect x="-13" y="-82" width="26" height="4" fill="#F2A900"/><rect x="-14" y="-62" width="28" height="34" rx="5" fill="#F26B1D"/><rect x="-14" y="-50" width="28" height="4" fill="#E6F0F0"/><rect x="-14" y="-40" width="28" height="4" fill="#E6F0F0"/><rect x="-20" y="-60" width="6" height="26" rx="3" fill="#F26B1D"/><rect x="14" y="-60" width="6" height="26" rx="3" fill="#F26B1D"/><rect x="-12" y="-28" width="10" height="28" fill="#13223D"/><rect x="2" y="-28" width="10" height="28" fill="#13223D"/></g></g><text class="a fade" style="animation-delay:2s" x="400" y="60" font-size="26" fill="#13223D" text-anchor="middle" font-weight="bold">70 km/h → about 57 m to stop</text></svg>
