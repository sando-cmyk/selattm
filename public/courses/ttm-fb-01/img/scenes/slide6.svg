<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Bar chart of equivalent fall heights for 30, 50, 70 and 100 km/h" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Bar chart of equivalent fall heights for 30, 50, 70 and 100 km/h</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#F5F3EE"/><line x1="80" y1="290" x2="760" y2="290" stroke="#9AA6B2" stroke-width="2"/><text class="a fade" style="animation-delay:0.6s" x="400" y="36" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Being hit = falling from…</text><rect class="a growup" style="animation-delay:0.3s" x="130" y="271.2977099236641" width="80" height="18.702290076335878" fill="#2E7D32"/><text class="a fade" style="animation-delay:0.8s" x="170" y="265.2977099236641" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">3.5 m</text><text class="a fade" style="animation-delay:0.5s" x="170" y="316" font-size="18" fill="#3C4A5E" text-anchor="middle" font-weight="bold">30 km/h</text><rect class="a growup" style="animation-delay:0.55s" x="295" y="237.63358778625954" width="80" height="52.36641221374047" fill="#F2A900"/><text class="a fade" style="animation-delay:1.05s" x="335" y="231.63358778625954" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">9.8 m</text><text class="a fade" style="animation-delay:0.75s" x="335" y="316" font-size="18" fill="#3C4A5E" text-anchor="middle" font-weight="bold">50 km/h</text><rect class="a growup" style="animation-delay:0.8s" x="460" y="186.87022900763355" width="80" height="103.12977099236643" fill="#F26B1D"/><text class="a fade" style="animation-delay:1.3s" x="500" y="180.87022900763355" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">19.3 m</text><text class="a fade" style="animation-delay:1.0s" x="500" y="316" font-size="18" fill="#3C4A5E" text-anchor="middle" font-weight="bold">70 km/h</text><rect class="a growup" style="animation-delay:1.05s" x="625" y="80.0" width="80" height="210.0" fill="#C8102E"/><text class="a fade" style="animation-delay:1.55s" x="665" y="74.0" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">39.3 m</text><text class="a fade" style="animation-delay:1.25s" x="665" y="316" font-size="18" fill="#3C4A5E" text-anchor="middle" font-weight="bold">100 km/h</text></svg>
