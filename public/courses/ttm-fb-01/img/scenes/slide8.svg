<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A speedometer with the 30 km/h survivable zone marked in green" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A speedometer with the 30 km/h survivable zone marked in green</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#F5F3EE"/><g class="a fade" style="animation-delay:0.1s"><path d="M210.0,270.0 A190,190 0 0 1 275.6,126.4" stroke="#2E7D32" stroke-width="34" fill="none"/><path d="M275.6,126.4 A190,190 0 0 1 373.0,81.9" stroke="#F2A900" stroke-width="34" fill="none"/><path d="M373.0,81.9 A190,190 0 0 1 478.9,97.2" stroke="#F26B1D" stroke-width="34" fill="none"/><path d="M478.9,97.2 A190,190 0 0 1 590.0,270.0" stroke="#C8102E" stroke-width="34" fill="none"/></g><text class="a fade" style="animation-delay:0.4s" x="262.0" y="276.0" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">0</text><text class="a fade" style="animation-delay:0.4s" x="309.6292187155507" y="171.70655873911235" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">30</text><text class="a fade" style="animation-delay:0.4s" x="380.36055231828664" y="139.40464102043128" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">50</text><text class="a fade" style="animation-delay:0.4s" x="457.32727179426035" y="150.47078464107648" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">70</text><text class="a fade" style="animation-delay:0.4s" x="532.4100303588007" y="237.1209071558827" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">100</text><g class="a needle" style="transform-origin:400px 270px"><line x1="400" y1="270" x2="301.8" y2="156.6" stroke="#13223D" stroke-width="8" stroke-linecap="round"/></g><circle cx="400" cy="270" r="14" fill="#13223D"/><text class="a fade" style="animation-delay:1.4s" x="400" y="325" font-size="20" fill="#2E7D32" text-anchor="middle" font-weight="bold">Person on foot: survivable up to about 30 km/h</text></svg>
