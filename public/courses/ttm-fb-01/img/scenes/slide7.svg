<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Outline of the human body highlighting the brain, aorta, liver and legs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Outline of the human body highlighting the brain, aorta, liver and legs</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#EEF3FA"/><g class="a fade" style="animation-delay:0.1s"><circle cx="400" cy="60" r="30" fill="#E8C4A6"/><rect x="370" y="96" width="60" height="110" rx="20" fill="#E8C4A6"/><rect x="340" y="100" width="22" height="100" rx="11" fill="#E8C4A6"/><rect x="438" y="100" width="22" height="100" rx="11" fill="#E8C4A6"/><rect x="372" y="200" width="24" height="120" rx="12" fill="#E8C4A6"/><rect x="404" y="200" width="24" height="120" rx="12" fill="#E8C4A6"/></g><circle class="pulse" cx="400" cy="58" r="10" fill="#C8102E" opacity=".85"/><line class="a fade" style="animation-delay:0.5s" x1="400" y1="58" x2="270" y2="58" stroke="#13223D" stroke-width="2"/><text class="a fade" style="animation-delay:0.6s" x="210" y="64" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Brain</text><circle class="pulse" cx="392" cy="128" r="10" fill="#C8102E" opacity=".85"/><line class="a fade" style="animation-delay:0.75s" x1="392" y1="128" x2="270" y2="128" stroke="#13223D" stroke-width="2"/><text class="a fade" style="animation-delay:0.85s" x="210" y="134" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Aorta</text><circle class="pulse" cx="412" cy="160" r="10" fill="#C8102E" opacity=".85"/><line class="a fade" style="animation-delay:1.0s" x1="412" y1="160" x2="530" y2="160" stroke="#13223D" stroke-width="2"/><text class="a fade" style="animation-delay:1.1s" x="590" y="166" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Liver &amp; spleen</text><circle class="pulse" cx="416" cy="270" r="10" fill="#C8102E" opacity=".85"/><line class="a fade" style="animation-delay:1.25s" x1="416" y1="270" x2="530" y2="270" stroke="#13223D" stroke-width="2"/><text class="a fade" style="animation-delay:1.35s" x="590" y="276" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">Legs &amp; pelvis</text></svg>
