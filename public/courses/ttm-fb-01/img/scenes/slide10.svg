g class="a up" style="animation-delay:1.1s"><g transform="translate(700,210) scale(0.9)"><circle cx="0" cy="-74" r="10" fill="#E8B48A"/><path d="M-12,-80 Q0,-96 12,-80Z" fill="#F2A900"/><rect x="-13" y="-82" width="26" height="4" fill="#F2A900"/><rect x="-14" y="-62" width="28" height="34" rx="5" fill="#F26B1D"/><rect x="-14" y="-50" width="28" height="4" fill="#E6F0F0"/><rect x="-14" y="-40" width="28" height="4" fill="#E6F0F0"/><rect x="-20" y="-60" width="6" height="26" rx="3" fill="#F26B1D"/><rect x="14" y="-60" width="6" height="26" rx="3" fill="#F26B1D"/><rect x="-12" y="-28" width="10" height="28" fill="#13223D"/><rect x="2" y="-28" width="10" height="28" fill="#13223D"/></g></g><text class="a fade" style="animation-delay:1.3s" x="510" y="300" font-size="17" fill="#13223D" text-anchor="middle" font-weight="bold">Barrier</text><text class="a fade" style="animation-delay:1.4s" x="400" y="40" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">Lower speed · add time and distance · keep energy away</text></svg>
