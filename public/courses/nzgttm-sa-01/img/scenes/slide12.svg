<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Five Sela priority checks P1 to P5" xmlns:c2pa="http://c2pa.org/manifest"><title>Five Sela priority checks P1 to P5</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><g class="a pop" style="animation-delay:0.00s"><rect x="30" y="70" width="136" height="200" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><circle cx="98" cy="130" r="34" fill="#2E7D32"/><text x="98" y="139.36" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">P1</text><text x="98" y="210" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Open road</text></g><g class="a pop" style="animation-delay:0.15s"><rect x="182" y="70" width="136" height="200" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><circle cx="250" cy="130" r="34" fill="#2E7D32"/><text x="250" y="139.36" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">P2</text><text x="250" y="210" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Night</text></g><g class="a pop" style="animation-delay:0.30s"><rect x="334" y="70" width="136" height="200" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><circle cx="402" cy="130" r="34" fill="#2E7D32"/><text x="402" y="139.36" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">P3</text><text x="402" y="210" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Heavy vehicles</text></g><g class="a pop" style="animation-delay:0.45s"><rect x="486" y="70" width="136" height="200" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><circle cx="554" cy="130" r="34" fill="#2E7D32"/><text x="554" y="139.36" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">P4</text><text x="554" y="210" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Ped &amp; cycle</text></g><g class="a pop" style="animation-delay:0.60s"><rect x="638" y="70" width="136" height="200" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><circle cx="706" cy="130" r="34" fill="#2E7D32"/><text x="706" y="139.36" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">P5</text><text x="706" y="210" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Surface</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>