<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Activity: make the call on two sites" xmlns:c2pa="http://c2pa.org/manifest"><title>Activity: make the call on two sites</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><g class="a left" style="animation-delay:0.00s"><rect x="50" y="50" width="330" height="240" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><text x="215" y="95" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">S1 · SH at night</text><rect x="150" y="120" width="130" height="100" rx="8" fill="#1B2A44"/><circle cx="215" cy="170" r="30" fill="#FFF3C4"/><circle cx="228.5" cy="162.5" r="25.5" fill="#1B2A44"/><text x="215" y="255" font-size="17" fill="#C8102E" text-anchor="middle" font-weight="bold">TSL sign down</text></g><g class="a right" style="animation-delay:0.30s"><rect x="420" y="50" width="330" height="240" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><text x="585" y="95" font-size="22" fill="#13223D" text-anchor="middle" font-weight="bold">S3 · Quarry stop/go</text><g transform="translate(600,210) scale(0.6,0.6)"><rect x="-90" y="-62" width="120" height="56" rx="4" fill="#D8D4CA" stroke="#3C4A5E" stroke-width="2"/><rect x="32" y="-50" width="44" height="44" rx="6" fill="#C8102E"/><rect x="50" y="-44" width="20" height="16" rx="2" fill="#CADCFC"/><circle cx="-66" cy="0" r="11" fill="#222"/><circle cx="-38" cy="0" r="11" fill="#222"/><circle cx="56" cy="0" r="11" fill="#222"/></g><text x="585" y="255" font-size="17" fill="#C8102E" text-anchor="middle" font-weight="bold">Queue over a crest</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>