<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Preparing for the visit: TMP, crash history, contacts and kit" xmlns:c2pa="http://c2pa.org/manifest"><title>Preparing for the visit: TMP, crash history, contacts and kit</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><g class="a pop" style="animation-delay:0.00s"><rect x="40" y="60" width="165" height="220" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><g transform="translate(122,140)"><g transform="translate(0,0) scale(0.8)"><rect x="-40" y="-52" width="80" height="104" rx="8" fill="#fff" stroke="#13223D" stroke-width="4"/><rect x="-16" y="-60" width="32" height="16" rx="4" fill="#13223D"/><path d="M-26,-24 L-20,-18 L-10,-30" stroke="#2E7D32" stroke-width="4" fill="none"/><line x1="-2" y1="-24" x2="26" y2="-24" stroke="#AAB" stroke-width="5" stroke-linecap="round"/><path d="M-26,2 L-20,8 L-10,-4" stroke="#2E7D32" stroke-width="4" fill="none"/><line x1="-2" y1="2" x2="26" y2="2" stroke="#AAB" stroke-width="5" stroke-linecap="round"/><path d="M-26,28 L-20,34 L-10,22" stroke="#2E7D32" stroke-width="4" fill="none"/><line x1="-2" y1="28" x2="26" y2="28" stroke="#AAB" stroke-width="5" stroke-linecap="round"/></g></g><text x="122" y="240" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">TMP &amp; approval</text></g><g class="a pop" style="animation-delay:0.15s"><rect x="225" y="60" width="165" height="220" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><g transform="translate(307,140)"><polyline points="-36,30 -12,6 8,16 36,-24" fill="none" stroke="#2E7D32" stroke-width="6"/></g><text x="307" y="240" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Crash history</text></g><g class="a pop" style="animation-delay:0.30s"><rect x="410" y="60" width="165" height="220" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><g transform="translate(492,140)"><g transform="translate(0,0) scale(0.9)"><rect x="-36" y="-22" width="72" height="48" rx="8" fill="#13223D"/><rect x="-14" y="-32" width="28" height="12" rx="3" fill="#13223D"/><circle cx="0" cy="2" r="15" fill="#CADCFC" stroke="#fff" stroke-width="4"/><circle cx="24" cy="-12" r="3" fill="#F2A900"/></g></g><text x="492" y="240" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Camera / dashcam</text></g><g class="a pop" style="animation-delay:0.45s"><rect x="595" y="60" width="165" height="220" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><g transform="translate(677,140)"><rect x="-22" y="-36" width="44" height="72" rx="8" fill="#13223D"/><rect x="-16" y="-28" width="32" height="48" fill="#CADCFC"/></g><text x="677" y="240" font-size="16" fill="#13223D" text-anchor="middle" font-weight="bold">Contacts</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>