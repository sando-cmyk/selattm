late(200,280) scale(1.0,1.0)"><rect x="-90" y="-62" width="120" height="56" rx="4" fill="#D8D4CA" stroke="#3C4A5E" stroke-width="2"/><rect x="32" y="-50" width="44" height="44" rx="6" fill="#C8102E"/><rect x="50" y="-44" width="20" height="16" rx="2" fill="#CADCFC"/><circle cx="-66" cy="0" r="11" fill="#222"/><circle cx="-38" cy="0" r="11" fill="#222"/><circle cx="56" cy="0" r="11" fill="#222"/></g></g><g class="a up" style="animation-delay:0.40s"><g transform="translate(600,290) scale(0.7)"><circle cx="0" cy="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#F2A900"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="-14" y="-52" width="28" height="4" fill="#fff"/><path d="M-13,-90 Q0,-104 13,-90Z" fill="#F2A900"/></g></g><g class="a pop" style="animation-delay:0.90s"><text x="400" y="70" font-size="26" fill="#13223D" text-anchor="middle" font-weight="bold">Spot the issues</text></g><g class="a pop" style="animation-delay:1.10s"><g class="pulse"><circle cx="120" cy="120" r="16" fill="#F2A900"/></g><text x="120" y="126" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">!</text></g><g class="a pop" style="animation-delay:1.30s"><g class="pulse"><circle cx="400" cy="120" r="16" fill="#F2A900"/></g><text x="400" y="126" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">!</text></g><g class="a pop" style="animation-delay:1.50s"><g class="pulse"><circle cx="600" cy="150" r="16" fill="#F2A900"/></g><text x="600" y="156" font-size="20" fill="#13223D" text-anchor="middle" font-weight="bold">!</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>