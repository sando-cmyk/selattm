<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Bar chart: 89 percent of worksite deaths are at open-road sites" xmlns:c2pa="http://c2pa.org/manifest"><title>Bar chart: 89 percent of worksite deaths are at open-road sites</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><text x="40" y="50" font-size="20" fill="#13223D" text-anchor="start" font-weight="bold">Worksite deaths by setting, 2006–2026</text><text x="210" y="110" font-size="16" fill="#3C4A5E" text-anchor="end" font-weight="bold">Open road, SH</text><g class="a grow" style="animation-delay:0.00s"><rect x="225" y="88" width="386.09999999999997" height="34" rx="4" fill="#2E7D32"/><text x="621.0999999999999" y="112" font-size="17" fill="#13223D" text-anchor="start" font-weight="bold">99</text></g><text x="210" y="170" font-size="16" fill="#3C4A5E" text-anchor="end" font-weight="bold">Open road, local</text><g class="a grow" style="animation-delay:0.20s"><rect x="225" y="148" width="163.79999999999998" height="34" rx="4" fill="#2E7D32"/><text x="398.79999999999995" y="172" font-size="17" fill="#13223D" text-anchor="start" font-weight="bold">42</text></g><text x="210" y="230" font-size="16" fill="#3C4A5E" text-anchor="end" font-weight="bold">Urban, local</text><g class="a grow" style="animation-delay:0.40s"><rect x="225" y="208" width="39.0" height="34" rx="4" fill="#9AA5B1"/><text x="274.0" y="232" font-size="17" fill="#13223D" text-anchor="start" font-weight="bold">10</text></g><text x="210" y="290" font-size="16" fill="#3C4A5E" text-anchor="end" font-weight="bold">Urban, SH</text><g class="a grow" style="animation-delay:0.60s"><rect x="225" y="268" width="27.3" height="34" rx="4" fill="#9AA5B1"/><text x="262.3" y="292" font-size="17" fill="#13223D" text-anchor="start" font-weight="bold">7</text></g><g class="a pop" style="animation-delay:1.20s"><rect x="660" y="90" width="120" height="120" rx="14" fill="#F2A900" stroke="#F2A900" stroke-width="2"/><text x="720" y="155" font-size="40" fill="#13223D" text-anchor="middle" font-weight="bold">89%</text><text x="720" y="185" font-size="15" fill="#13223D" text-anchor="middle" font-weight="bold">open road</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>