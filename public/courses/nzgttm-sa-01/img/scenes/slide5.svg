<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Four duties: shared duties, own safety, independence and consistency" xmlns:c2pa="http://c2pa.org/manifest"><title>Four duties: shared duties, own safety, independence and consistency</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><g class="a pop" style="animation-delay:0.00s"><rect x="40" y="60" width="165" height="220" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><circle cx="122" cy="120" r="34" fill="#13223D"/><text x="122" y="130.08" font-size="28" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="122" y="200" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Shared duties</text><text x="122" y="230" font-size="15" fill="#3C4A5E" text-anchor="middle">HSWA</text></g><g class="a pop" style="animation-delay:0.20s"><rect x="225" y="60" width="165" height="220" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><circle cx="307" cy="120" r="34" fill="#F2A900"/><text x="307" y="130.08" font-size="28" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="307" y="200" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Safety first</text><text x="307" y="230" font-size="15" fill="#3C4A5E" text-anchor="middle">You</text></g><g class="a pop" style="animation-delay:0.40s"><rect x="410" y="60" width="165" height="220" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><circle cx="492" cy="120" r="34" fill="#13223D"/><text x="492" y="130.08" font-size="28" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="492" y="200" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Independent</text><text x="492" y="230" font-size="15" fill="#3C4A5E" text-anchor="middle">Declare</text></g><g class="a pop" style="animation-delay:0.60s"><rect x="595" y="60" width="165" height="220" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><circle cx="677" cy="120" r="34" fill="#F2A900"/><text x="677" y="130.08" font-size="28" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="677" y="200" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Consistent</text><text x="677" y="230" font-size="15" fill="#3C4A5E" text-anchor="middle">Same result</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>