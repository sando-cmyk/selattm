<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="All six modules lead to the final assessment" xmlns:c2pa="http://c2pa.org/manifest"><title>All six modules lead to the final assessment</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><g class="a pop" style="animation-delay:0.00s"><circle cx="70" cy="110" r="34" fill="#13223D"/><text x="70" y="118.64" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold">M1</text></g><g class="a draw" style="animation-delay:0.80s"><path d="M70,150 Q70,230 400,250" fill="none" stroke="#C9CED3" stroke-width="4"/></g><g class="a pop" style="animation-delay:0.12s"><circle cx="180" cy="110" r="34" fill="#13223D"/><text x="180" y="118.64" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold">M2</text></g><g class="a draw" style="animation-delay:0.80s"><path d="M180,150 Q180,230 400,250" fill="none" stroke="#C9CED3" stroke-width="4"/></g><g class="a pop" style="animation-delay:0.24s"><circle cx="290" cy="110" r="34" fill="#13223D"/><text x="290" y="118.64" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold">M3</text></g><g class="a draw" style="animation-delay:0.80s"><path d="M290,150 Q290,230 400,250" fill="none" stroke="#C9CED3" stroke-width="4"/></g><g class="a pop" style="animation-delay:0.36s"><circle cx="400" cy="110" r="34" fill="#13223D"/><text x="400" y="118.64" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold">M4</text></g><g class="a draw" style="animation-delay:0.80s"><path d="M400,150 Q400,230 400,250" fill="none" stroke="#C9CED3" stroke-width="4"/></g><g class="a pop" style="animation-delay:0.48s"><circle cx="510" cy="110" r="34" fill="#13223D"/><text x="510" y="118.64" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold">M5</text></g><g class="a draw" style="animation-delay:0.80s"><path d="M510,150 Q510,230 400,250" fill="none" stroke="#C9CED3" stroke-width="4"/></g><g class="a pop" style="animation-delay:0.60s"><circle cx="620" cy="110" r="34" fill="#13223D"/><text x="620" y="118.64" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold">M6</text></g><g class="a draw" style="animation-delay:0.80s"><path d="M620,150 Q620,230 400,250" fill="none" stroke="#C9CED3" stroke-width="4"/></g><g class="a pop" style="animation-delay:1.40s"><rect x="310" y="240" width="180" height="54" rx="27.0" fill="#F2A900"/><text x="400.0" y="275.64" font-size="24" fill="#13223D" text-anchor="middle" font-weight="bold">Final</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>