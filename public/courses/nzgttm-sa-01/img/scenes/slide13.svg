<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Activity: three sites, where would you focus?" xmlns:c2pa="http://c2pa.org/manifest"><title>Activity: three sites, where would you focus?</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><rect width="800" height="340" fill="#1B2A44"/><rect x="0" y="170" width="800" height="170" fill="#22324A"/><circle cx="80" cy="40" r="1.6" fill="#fff" opacity=".7"/><circle cx="160" cy="90" r="1.6" fill="#fff" opacity=".7"/><circle cx="260" cy="30" r="1.6" fill="#fff" opacity=".7"/><circle cx="420" cy="60" r="1.6" fill="#fff" opacity=".7"/><circle cx="520" cy="25" r="1.6" fill="#fff" opacity=".7"/><circle cx="600" cy="80" r="1.6" fill="#fff" opacity=".7"/><circle cx="700" cy="45" r="1.6" fill="#fff" opacity=".7"/><circle cx="760" cy="110" r="1.6" fill="#fff" opacity=".7"/><circle cx="340" cy="110" r="1.6" fill="#fff" opacity=".7"/><rect x="0" y="0" width="266" height="340" fill="#1B2A44"/><rect x="266" y="0" width="268" height="340" fill="#E3ECF5"/><rect x="534" y="0" width="266" height="340" fill="#EAF5EA"/><circle cx="130" cy="70" r="22" fill="#FFF3C4"/><circle cx="139.9" cy="64.5" r="18.7" fill="#1B2A44"/><g class="a fade" style="animation-delay:0.20s"><text x="133" y="250" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">SH1 at night</text></g><g class="a fade" style="animation-delay:0.40s"><g transform="translate(400,200) scale(1.1)"><circle cx="0" cy="-58" r="8" fill="#E8B48A"/><rect x="-8" y="-48" width="16" height="26" rx="6" fill="#1E3A5F"/><path d="M-4,-22 L-10,0 M4,-22 L10,0" stroke="#13223D" stroke-width="5" stroke-linecap="round"/></g><text x="400" y="250" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Urban footpath</text></g><g class="a fade" style="animation-delay:0.60s"><g transform="translate(690,200) scale(0.7,0.7)"><rect x="-90" y="-62" width="120" height="56" rx="4" fill="#D8D4CA" stroke="#3C4A5E" stroke-width="2"/><rect x="32" y="-50" width="44" height="44" rx="6" fill="#C8102E"/><rect x="50" y="-44" width="20" height="16" rx="2" fill="#CADCFC"/><circle cx="-66" cy="0" r="11" fill="#222"/><circle cx="-38" cy="0" r="11" fill="#222"/><circle cx="56" cy="0" r="11" fill="#222"/></g><text x="667" y="250" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Logging trucks</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>