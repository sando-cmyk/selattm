<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Hierarchy of controls from elimination to PPE" xmlns:c2pa="http://c2pa.org/manifest"><title>Hierarchy of controls from elimination to PPE</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><g class="a grow" style="animation-delay:0.00s"><rect x="140" y="30" width="520" height="40" rx="4" fill="#2E7D32"/><text x="152" y="56.3" font-size="18" fill="#fff" text-anchor="start" font-weight="bold">Eliminate</text></g><g class="a grow" style="animation-delay:0.12s"><rect x="140" y="78" width="460" height="40" rx="4" fill="#2E7D32"/><text x="152" y="104.3" font-size="18" fill="#fff" text-anchor="start" font-weight="bold">Substitute</text></g><g class="a grow" style="animation-delay:0.24s"><rect x="140" y="126" width="400" height="40" rx="4" fill="#2E7D32"/><text x="152" y="152.3" font-size="18" fill="#fff" text-anchor="start" font-weight="bold">Isolate</text></g><g class="a grow" style="animation-delay:0.36s"><rect x="140" y="174" width="340" height="40" rx="4" fill="#3C4A5E"/><text x="152" y="200.3" font-size="18" fill="#fff" text-anchor="start" font-weight="bold">Engineer</text></g><g class="a grow" style="animation-delay:0.48s"><rect x="140" y="222" width="280" height="40" rx="4" fill="#3C4A5E"/><text x="152" y="248.3" font-size="18" fill="#fff" text-anchor="start" font-weight="bold">Administrative</text></g><g class="a grow" style="animation-delay:0.60s"><rect x="140" y="270" width="220" height="40" rx="4" fill="#9AA5B1"/><text x="152" y="296.3" font-size="18" fill="#fff" text-anchor="start" font-weight="bold">PPE</text></g><g class="a fade" style="animation-delay:0.90s"><text x="720" y="60" font-size="16" fill="#2E7D32" text-anchor="middle" font-weight="bold">Most</text><text x="720" y="80" font-size="16" fill="#2E7D32" text-anchor="middle" font-weight="bold">effective</text><text x="720" y="290" font-size="16" fill="#3C4A5E" text-anchor="middle" font-weight="bold">Least</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>