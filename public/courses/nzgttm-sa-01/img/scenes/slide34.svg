<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Next steps: online course, field assessments, then endorsement" xmlns:c2pa="http://c2pa.org/manifest"><title>Next steps: online course, field assessments, then endorsement</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><g class="a pop" style="animation-delay:0.00s"><circle cx="100" cy="150" r="44" fill="#13223D"/><text x="100" y="162.24" font-size="34" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="100" y="230" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Online modules</text></g><g class="a fade" style="animation-delay:0.20s"><line x1="154" y1="150" x2="246" y2="150" stroke="#C9CED3" stroke-width="5"/></g><g class="a pop" style="animation-delay:0.25s"><circle cx="300" cy="150" r="44" fill="#13223D"/><text x="300" y="162.24" font-size="34" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="300" y="230" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Final test</text></g><g class="a fade" style="animation-delay:0.45s"><line x1="354" y1="150" x2="446" y2="150" stroke="#C9CED3" stroke-width="5"/></g><g class="a pop" style="animation-delay:0.50s"><circle cx="500" cy="150" r="44" fill="#13223D"/><text x="500" y="162.24" font-size="34" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="500" y="230" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Field visits ×2</text></g><g class="a fade" style="animation-delay:0.70s"><line x1="554" y1="150" x2="646" y2="150" stroke="#C9CED3" stroke-width="5"/></g><g class="a pop" style="animation-delay:0.75s"><circle cx="700" cy="150" r="44" fill="#2E7D32"/><text x="700" y="162.24" font-size="34" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="700" y="230" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Endorsed</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>