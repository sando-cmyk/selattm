y="-78" r="12" fill="#E8B48A"/><rect x="-14" y="-64" width="28" height="36" rx="8" fill="#7BC67E"/><rect x="-12" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="3" y="-30" width="9" height="30" rx="3" fill="#13223D"/><rect x="-14" y="-52" width="28" height="4" fill="#fff"/><path d="M-13,-90 Q0,-104 13,-90Z" fill="#7BC67E"/></g><g transform="translate(560,228) scale(1.0)"><rect x="12" y="-62" width="18" height="24" rx="2" fill="#fff" stroke="#13223D" stroke-width="2"/><line x1="16" y1="-54" x2="26" y2="-54" stroke="#13223D" stroke-width="2"/><line x1="16" y1="-47" x2="26" y2="-47" stroke="#13223D" stroke-width="2"/></g></g><g class="a pop" style="animation-delay:0.80s"><rect x="330" y="30" width="160" height="70" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><text x="410" y="72" font-size="18" fill="#13223D" text-anchor="middle" font-weight="bold">Here’s why…</text></g><g class="a pop" style="animation-delay:1.20s"><rect x="520" y="30" width="170" height="70" rx="14" fill="#EAF5EA" stroke="#CFE3CF" stroke-width="2"/><text x="605" y="72" font-size="18" fill="#2E7D32" text-anchor="middle" font-weight="bold">Agreed — fix</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>