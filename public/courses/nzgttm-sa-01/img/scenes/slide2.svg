<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Six layers of assurance with holes; a hazard is stopped when the holes do not line up" xmlns:c2pa="http://c2pa.org/manifest"><title>Six layers of assurance with holes; a hazard is stopped when the holes do not line up</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><g class="a up" style="animation-delay:0.00s"><rect x="150" y="60" width="60" height="210" rx="10" fill="#2E7D32"/><circle cx="175" cy="95" r="11" fill="#E3ECF5"/><circle cx="185" cy="150" r="11" fill="#E3ECF5"/><circle cx="175" cy="215" r="11" fill="#E3ECF5"/><text x="180" y="325" font-size="14" fill="#3C4A5E" text-anchor="middle" font-weight="bold">TMP</text></g><g class="a up" style="animation-delay:0.15s"><rect x="240" y="66" width="60" height="210" rx="10" fill="#A9C9A4"/><circle cx="275" cy="107" r="11" fill="#E3ECF5"/><circle cx="265" cy="162" r="11" fill="#E3ECF5"/><circle cx="275" cy="227" r="11" fill="#E3ECF5"/><text x="270" y="325" font-size="14" fill="#3C4A5E" text-anchor="middle" font-weight="bold">STMS</text></g><g class="a up" style="animation-delay:0.30s"><rect x="330" y="72" width="60" height="210" rx="10" fill="#2E7D32"/><circle cx="355" cy="119" r="11" fill="#E3ECF5"/><circle cx="365" cy="174" r="11" fill="#E3ECF5"/><circle cx="355" cy="239" r="11" fill="#E3ECF5"/><text x="360" y="325" font-size="14" fill="#3C4A5E" text-anchor="middle" font-weight="bold">Partial</text></g><g class="a up" style="animation-delay:0.45s"><rect x="420" y="78" width="60" height="210" rx="10" fill="#A9C9A4"/><circle cx="455" cy="95" r="11" fill="#E3ECF5"/><circle cx="445" cy="150" r="11" fill="#E3ECF5"/><circle cx="455" cy="215" r="11" fill="#E3ECF5"/><text x="450" y="325" font-size="14" fill="#3C4A5E" text-anchor="middle" font-weight="bold">SCR</text></g><g class="a up" style="animation-delay:0.60s"><rect x="510" y="84" width="60" height="210" rx="10" fill="#2E7D32"/><circle cx="535" cy="107" r="11" fill="#E3ECF5"/><circle cx="545" cy="162" r="11" fill="#E3ECF5"/><circle cx="535" cy="227" r="11" fill="#E3ECF5"/><text x="540" y="325" font-size="14" fill="#3C4A5E" text-anchor="middle" font-weight="bold">Full risk</text></g><g class="a up" style="animation-delay:0.75s"><rect x="600" y="90" width="60" height="210" rx="10" fill="#A9C9A4"/><circle cx="635" cy="119" r="11" fill="#E3ECF5"/><circle cx="625" cy="174" r="11" fill="#E3ECF5"/><circle cx="635" cy="239" r="11" fill="#E3ECF5"/><text x="630" y="325" font-size="14" fill="#3C4A5E" text-anchor="middle" font-weight="bold">Systems</text></g><g class="a left" style="animation-delay:1.10s"><line x1="20" y1="170" x2="122" y2="170" stroke="#C8102E" stroke-width="7" stroke-linecap="round"/><path d="M140,170 L122,182 L122,158Z" fill="#C8102E"/><text x="70" y="150" font-size="16" fill="#C8102E" text-anchor="middle" font-weight="bold">Hazard</text></g><g class="a pop" style="animation-delay:1.70s"><circle cx="720" cy="170" r="26" fill="#C8102E"/><path d="M709.6,159.6 L730.4,180.4 M730.4,159.6 L709.6,180.4" stroke="#fff" stroke-width="5.7" stroke-linecap="round"/></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>