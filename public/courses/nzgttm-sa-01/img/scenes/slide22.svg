<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Evidence: numbered, time-stamped photos from a safe position" xmlns:c2pa="http://c2pa.org/manifest"><title>Evidence: numbered, time-stamped photos from a safe position</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;transform-box:fill-box;transform-origin:center;}
.fade{animation-name:fade}.up{animation-name:up}.pop{animation-name:pop}.left{animation-name:left}.right{animation-name:right}
.drive{animation-name:drive;animation-duration:1.6s}.drop{animation-name:drop}.grow{animation-name:grow;transform-origin:left center}
.growup{animation-name:growup;transform-origin:center bottom}.draw{stroke-dasharray:900;animation-name:draw;animation-duration:1.4s}
.spin{animation:spin 14s linear infinite;transform-origin:400px 170px;transform-box:view-box}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.needle{animation-name:needle;animation-duration:1.4s;transform-box:view-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-420px)}to{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px)}60%{transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes needle{from{transform:rotate(-120deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a,.spin,.pulse,.needle{animation:none!important}}
</style><rect width="800" height="340" fill="#E3ECF5"/><g class="a pop" style="animation-delay:0.00s"><g transform="translate(160,170) scale(2.2)"><rect x="-36" y="-22" width="72" height="48" rx="8" fill="#13223D"/><rect x="-14" y="-32" width="28" height="12" rx="3" fill="#13223D"/><circle cx="0" cy="2" r="15" fill="#CADCFC" stroke="#fff" stroke-width="4"/><circle cx="24" cy="-12" r="3" fill="#F2A900"/></g></g><g class="a up" style="animation-delay:0.40s"><rect x="330" y="80" width="130" height="160" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><rect x="342" y="92" width="106" height="90" fill="#CFE3C4"/><g transform="translate(394,172) scale(0.7)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><text x="395" y="210" font-size="15" fill="#13223D" text-anchor="middle" font-weight="bold">Photo 07</text><text x="395" y="230" font-size="12" fill="#3C4A5E" text-anchor="middle">10:20 · 450 m</text></g><g class="a up" style="animation-delay:0.60s"><rect x="480" y="80" width="130" height="160" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><rect x="492" y="92" width="106" height="90" fill="#CFE3C4"/><g transform="translate(544,172) scale(0.7)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><text x="545" y="210" font-size="15" fill="#13223D" text-anchor="middle" font-weight="bold">Photo 08</text><text x="545" y="230" font-size="12" fill="#3C4A5E" text-anchor="middle">10:22 · 450 m</text></g><g class="a up" style="animation-delay:0.80s"><rect x="630" y="80" width="130" height="160" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="2"/><rect x="642" y="92" width="106" height="90" fill="#CFE3C4"/><g transform="translate(694,172) scale(0.7)"><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#333"/><path d="M-11,-4 L-3,-44 L3,-44 L11,-4Z" fill="#F26B1D"/><path d="M-8,-16 L8,-16 L6,-26 L-6,-26Z" fill="#fff"/></g><text x="695" y="210" font-size="15" fill="#13223D" text-anchor="middle" font-weight="bold">Photo 09</text><text x="695" y="230" font-size="12" fill="#3C4A5E" text-anchor="middle">10:24 · 450 m</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>