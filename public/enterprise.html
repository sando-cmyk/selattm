<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Portal - Sela Civil Advisory Ltd</title>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>
  <div class="page-container">
    <header class="site-header" id="global-header"></header>

    <div class="main-wrapper">
      <main class="container">
        <div class="main-content">
          <h1 class="page-title">Enterprise Account Management</h1>
          <p id="org-display" style="color: #666; margin-bottom: 1.5rem;">Verifying employer access...</p>

          <div id="loading" style="text-align: center; padding: 3rem; color: #555;">
            Verifying employer authorization credentials...
          </div>

          <div id="portal-content" style="display: none;">
            <div style="background: rgba(26, 108, 122, 0.05); padding: 1.5rem; border-left: 4px solid var(--primary-color); border-radius: 6px; margin-bottom: 2rem;">
              <h3 style="font-family: 'Playfair Display', serif; color: var(--dark-blue); margin-bottom: 0.5rem;">Staff Authorisations & Allocations</h3>
              <p style="color: #333;">Assign or revoke certified training seats for your workforce. Approved seats unlock immediately in the employee's Learner Hub.</p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <footer class="site-footer" id="global-footer"></footer>
  </div>

  <script type="module" src="./js/navigation.js"></script>

  <script type="module">
    import { auth, db, doc, getDoc, onAuthStateChanged } from "./js/firebase-init.js";
    import { showUnauthorizedModal, showErrorModal } from "./js/modal.js";

    const orgDisplay = document.getElementById("org-display");
    const loading = document.getElementById("loading");
    const portalContent = document.getElementById("portal-content");

    onAuthStateChanged(auth, async (user) => {
      if (!user || user.isAnonymous) {
        showUnauthorizedModal("Sorry, you are not authorized to view the Enterprise Portal. Please sign in with an authorized manager account.");
        return;
      }

      try {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        const data = userDoc.exists() ? userDoc.data() : null;

        const isAuthorised = data && (data.role === "enterprise" || data.role === "admin" || data.isAdmin === true);

        if (!isAuthorised) {
          showUnauthorizedModal("Access Restricted: You must be an authorized Enterprise Account Manager or Administrator to view this portal.");
          return;
        }

        orgDisplay.textContent = `Organization Manager: ${user.email} (${data.companyName || "SELA Civil"})`;
        loading.style.display = "none";
        portalContent.style.display = "block";

      } catch (err) {
        console.error(err);
        showErrorModal("An error occurred while verifying manager permissions.");
      }
    });
  </script>
</body>
</html>
